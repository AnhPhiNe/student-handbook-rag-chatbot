- phieu: V4-091
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô ạ. Kỳ này em đang chuẩn bị cho đợt thực tập tốt nghiệp sắp tới nhưng bản thân cảm thấy kỹ năng đứng lớp cũng như việc ứng dụng công nghệ giảng dạy còn yếu quá. Em có nghe nói trường mình có hỗ trợ tập giảng trong các phòng học ảo với phòng học thông minh, nên em muốn hỏi là nếu em có nhu cầu tham gia tập giảng, kiến tập và thực tập giảng tại các phòng học trực tuyến, phòng học ảo hoặc thông minh thì em liên hệ ai và ở đâu ạ? Nhân tiện cho em hỏi thêm, quy định về việc công nhận tốt nghiệp và cấp bằng tốt nghiệp của trường mình hiện nay được thực hiện như thế nào ạ?"
  dap_an_nhap: "1. Về nhu cầu tập giảng, kiến tập và thực tập giảng tại các phòng học trực tuyến, phòng học ảo và phòng học thông minh, bạn liên hệ Trung tâm Phát triển kỹ năng Sư phạm:\n- Địa chỉ: Nhà A, tầng 2, P.201, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM.\n- Điện thoại: (028) 38397868\n- Email: trungtamptknsp@hcmue.edu.vn\n\n2. Quy định về công nhận tốt nghiệp và cấp bằng tốt nghiệp (Điều 15 Quy chế đào tạo trình độ đại học):\n- Điều kiện công nhận tốt nghiệp: Tích lũy đủ học phần, số tín chỉ và hoàn thành các nội dung bắt buộc khác theo yêu cầu của CTĐT, đạt chuẩn đầu ra; Điểm trung bình tích lũy toàn khóa đạt từ trung bình trở lên; Tại thời điểm xét không bị truy cứu trách nhiệm hình sự hoặc không đang trong thời gian bị kỷ luật đình chỉ học tập.\n- Cấp bằng tốt nghiệp: Hiệu trưởng ký quyết định công nhận tốt nghiệp và cấp bằng trong thời hạn 03 tháng kể từ thời điểm sinh viên đáp ứng đầy đủ điều kiện và hoàn thành nghĩa vụ với Trường.\n- Hạng tốt nghiệp: Căn cứ điểm trung bình tích lũy toàn khóa. Hạng Xuất sắc và Giỏi bị giảm một mức nếu khối lượng học phần học lại vượt quá 5% tổng số tín chỉ của chương trình, hoặc đã bị kỷ luật từ mức cảnh cáo trở lên trong thời gian học.\n- Xử lý khi hết thời gian tối đa: Sinh viên hết thời gian tối đa nhưng chưa đủ điều kiện tốt nghiệp do thiếu học phần GDQP-AN, GDTC hoặc chưa đạt chuẩn đầu ra ngoại ngữ, CNTT được hoàn thiện trong 03 năm kể từ khi thôi học để đề nghị xét công nhận tốt nghiệp. Sinh viên chính quy hết thời gian được chuyển sang hình thức vừa làm vừa học nếu còn trong thời hạn đào tạo quy định của hình thức chuyển đến.\n- Đợt xét tốt nghiệp: Hình thức chính quy có 03 đợt chính thức (tháng 5, tháng 8, tháng 10); vừa làm vừa học có 05 đợt (tháng 3, tháng 5, tháng 8, tháng 10, tháng 12) cùng các đợt bổ sung do Hiệu trưởng quyết định.\n- Quy trình: Trường ban hành kế hoạch và công bố kết quả dự kiến trên cổng thông tin; sinh viên và khoa chuyên môn rà soát, phản hồi sai sót về Phòng Đào tạo trong thời gian quy định; tổ chức họp Hội đồng xét tốt nghiệp và ban hành Quyết định công nhận tốt nghiệp."
  y_bat_buoc:
    - "Đơn vị: Trung tâm Phát triển kỹ năng Sư phạm"
    - "Địa chỉ: Nhà A, tầng 2, P.201, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM"
    - "Điện thoại: (028) 38397868"
    - "Email: trungtamptknsp@hcmue.edu.vn"
    - "Điều kiện công nhận tốt nghiệp: tích lũy đủ học phần, tín chỉ, nội dung bắt buộc, đạt chuẩn đầu ra; ĐTB tích lũy toàn khóa từ trung bình trở lên; không bị truy cứu trách nhiệm hình sự hoặc đình chỉ học tập"
    - "Cấp bằng tốt nghiệp trong thời hạn 03 tháng tính từ khi đủ điều kiện và hoàn thành nghĩa vụ"
    - "Hạng Xuất sắc và Giỏi bị giảm một mức nếu học lại vượt quá 5% tổng số tín chỉ CTĐT hoặc bị kỷ luật từ cảnh cáo trở lên"
    - "Hết thời gian tối đa nếu còn thiếu GDQP-AN, GDTC hoặc chuẩn ngoại ngữ, CNTT được hoàn thiện trong 03 năm kể từ khi thôi học"
    - "Các đợt xét chính thức: chính quy có 03 đợt (tháng 5, tháng 8, tháng 10); vừa làm vừa học có 05 đợt (tháng 3, tháng 5, tháng 8, tháng 10, tháng 12)"
    - "Quy trình: công bố kết quả dự kiến, sinh viên và khoa rà soát phản hồi sai sót về Phòng Đào tạo, họp Hội đồng xét và ban hành quyết định"
  nguon:
    - "Đ1: Danh bạ trong Sổ tay sinh viên K48-K49"
    - "Đ2: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 15"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-092
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "thay co cho e hoi e muon hoi ve may cong tac khao thi voi dam bao chat luong cua truong thi lien he o dau a? voi lai theo quy dinh thi hoat dong nghien cuu khoa hoc cua sv lay tu nhung nguon tai chinh nao the a"
  dap_an_nhap: "1. Về công tác khảo thí và đảm bảo chất lượng, bạn liên hệ Phòng Khảo thí và Đảm bảo chất lượng:\n- Địa chỉ: Nhà A, tầng 2, P.202, P.206, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM.\n- Điện thoại: (028) 38352020\n- Email: phongkhaothi@hcmue.edu.vn\n\n2. Tài chính cho hoạt động nghiên cứu khoa học của sinh viên gồm 4 nguồn theo quy định:\n- Ngân sách Nhà nước trích từ kinh phí hoạt động khoa học và công nghệ.\n- Tài trợ, viện trợ của các tổ chức, cá nhân trong và ngoài nước.\n- Trích từ nguồn thu hợp pháp của Trường.\n- Huy động từ các nguồn hợp pháp khác."
  y_bat_buoc:
