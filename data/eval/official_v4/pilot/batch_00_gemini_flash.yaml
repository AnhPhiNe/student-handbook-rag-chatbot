      noi_dung: "cho em hỏi xíu mai thời tiết khu quận 5 có mưa to ngập đường không ạ, tính ghé ktx bạn chơi mà sợ mưa quá?"
  dap_an_nhap: "Xin lỗi bạn, mình chỉ hỗ trợ giải đáp các thông tin về quy chế, quy định và dịch vụ sinh viên trong Sổ tay sinh viên Trường Đại học Sư phạm TP.HCM nên không thể cung cấp thông tin dự báo thời tiết. Bạn vui lòng tra cứu trên các ứng dụng dự báo thời tiết nhé!"
