# Development questions for the handbook texts without articles (notices,
# conduct score framework, guides, dormitory procedure, link pages, forms).
#
# Development data, not a hold-out: written 2026-09-28 from the supplementary
# parents built by src/chunking/supplementary_parents.py, to check that the
# planner routes these questions to RAG, retrieval finds the right parent and
# the answer states the handbook facts. Measured with
# scripts/eval_supplementary_questions.py.
#
# gold_parent: the parent that holds the answer (<cohort>_<doc id>_Phan<n>)
# must_include: facts the answer must state (checked case-insensitively)
