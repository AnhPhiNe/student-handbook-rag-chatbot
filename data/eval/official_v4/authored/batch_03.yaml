  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Thầy cô cho em hỏi xíu ạ, kỳ rồi em ráng cày cuốc thi cử thì điểm học tập với điểm rèn luyện đều đạt mức Giỏi, chắc là đủ tiêu chuẩn nhận học bổng khuyến khích học tập loại Giỏi rồi. Em đang tính xem mình sẽ nhận được tầm bao nhiêu tiền để chuẩn bị đóng học phí kỳ sau đỡ phiền bố mẹ gửi lên. Thầy cô cho em hỏi công thức và hệ số tính học bổng loại Giỏi là như thế nào, và mức học phí một tín chỉ để nhân vào được tính dựa trên căn cứ gì ạ?"
  dap_an_nhap: "Mức học bổng khuyến khích học tập loại Giỏi được tính theo công thức: Số tín chỉ x định mức học phí 01 tín chỉ x 1,25 (hệ số là 1,25). Mức học phí 01 tín chỉ được xác định phụ thuộc vào ngành học của sinh viên và quy định mức thu học phí trong năm học đó."
  y_bat_buoc:
    - "Công thức: Số tín chỉ x định mức học phí 01 tín chỉ x 1,25"
    - "Hệ số: 1,25"
    - "Mức học phí 01 tín chỉ phụ thuộc vào ngành học của sinh viên và quy định mức thu học phí trong năm học đó"
  nguon:
    - "Đ10: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-023
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Để được xét học bổng khuyến khích học tập loại Giỏi thì cần đáp ứng điểm học tập, điểm rèn luyện và điểm học bổng trong khoảng nào ạ?"
  dap_an_nhap: "Để đạt học bổng khuyến khích học tập loại Giỏi, sinh viên cần đáp ứng: điểm học bổng từ 3.20 đến 3.672; điểm học tập từ 3.20 đến 3.59; và điểm rèn luyện đạt từ 80 trở lên (>= 80)."
  y_bat_buoc:
    - "Điểm học bổng: từ 3.20 đến 3.672"
    - "Điểm học tập: 3.20 – 3.59"
    - "Điểm rèn luyện: >= 80"
  nguon:
    - "Đ8: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 28"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-024
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Học bổng khuyến khích học tập loại Giỏi được tính theo công thức và hệ số như thế nào, định mức học phí tính theo căn cứ gì ạ?"
  dap_an_nhap: "Học bổng khuyến khích học tập loại Giỏi được tính theo công thức: Số tín chỉ x định mức học phí 1 tín chỉ x 1,25 (hệ số là 1,25). Mức học phí 1 tín chỉ được xác định phụ thuộc vào ngành học của sinh viên và quy định mức thu học phí trong năm học đó."
  y_bat_buoc:
    - "Công thức: Số tín chỉ x định mức học phí 1 tín chỉ x 1,25"
    - "Hệ số: 1,25"
    - "Mức học phí 1 tín chỉ phụ thuộc vào ngành học của sinh viên và quy định mức thu học phí trong năm học đó"
  nguon:
    - "Đ9: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-025
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi công thức tính điểm trung bình chung học kỳ của trường mình được quy định như thế nào vậy ạ?"
  dap_an_nhap: "Điểm trung bình chung học kỳ được tính theo công thức: A = Σ(ai × ni) / Σ(ni) và làm tròn đến 2 chữ số thập phân. Trong đó: A là điểm trung bình chung học kỳ; ai là điểm của học phần thứ i; ni là số tín chỉ của học phần thứ i; n là tổng số học phần."
  y_bat_buoc:
    - "Công thức: A = Σ(ai × ni) / Σ(ni)"
    - "Làm tròn đến 2 chữ số thập phân"
    - "A là điểm trung bình chung học kỳ"
    - "ai là điểm của học phần thứ i"
    - "ni là số tín chỉ của học phần thứ i"
    - "n là tổng số học phần"
  nguon:
    - "Đ3: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-026
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào thầy cô, kỳ vừa rồi em hoàn thành xong các môn thi và điểm rèn luyện cũng đã có trên hệ thống rồi. Em có điểm học tập hệ 4 là 3.30 và điểm rèn luyện là 85. Em muốn biết chính xác cách tính điểm xét học bổng khuyến khích học tập của trường để xem mình đạt bao nhiêu điểm, thầy cô hướng dẫn công thức và tính giúp em với ạ."
  dap_an_nhap: "Công thức tính điểm học bổng là: Điểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100 (trong đó Điểm rèn luyện / 25 là quy đổi về thang điểm 4). Với điểm học tập là 3.30 và điểm rèn luyện là 85, điểm học bổng của bạn được tính như sau: (3.30 x 80 + (85 / 25) x 20) / 100 = (264 + 3.4 x 20) / 100 = (264 + 68) / 100 = 3.32."
  y_bat_buoc:
    - "Công thức: Điểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100"
    - "Điểm rèn luyện / 25 là quy đổi về thang điểm 4"
    - "Điểm học bổng tính ra là 3.32"
  nguon:
    - "Đ8: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 28"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-027
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Trường mình tính điểm trung bình chung học kỳ theo công thức nào và làm tròn mấy chữ số thập phân vậy ạ?"
  dap_an_nhap: "Điểm trung bình chung học kỳ được tính theo công thức: A = Σ(ai × ni) / Σ(ni) và được làm tròn đến 2 chữ số thập phân. Trong đó: A là điểm trung bình chung học kỳ; ai là điểm của học phần thứ i; ni là số tín chỉ của học phần thứ i; n là tổng số học phần."
  y_bat_buoc:
    - "Công thức: A = Σ(ai × ni) / Σ(ni)"
    - "Làm tròn đến 2 chữ số thập phân"
    - "A là điểm trung bình chung học kỳ"
    - "ai là điểm của học phần thứ i"
    - "ni là số tín chỉ của học phần thứ i"
    - "n là tổng số học phần"
  nguon:
    - "Đ4: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-028
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô ạ, học kỳ này em đang phấn đấu săn học bổng để phụ giúp gia đình tiền sinh hoạt phí. Kết thúc kỳ vừa rồi, điểm học tập của em là 3.45 và điểm rèn luyện được 80 điểm. Em nghe nói trường tính điểm xét học bổng kết hợp cả điểm học tập lẫn rèn luyện nhưng chưa rõ cụ thể công thức thế nào. Thầy cô chỉ giúp em công thức tính điểm học bổng và tính thử điểm của em với ạ."
  dap_an_nhap: "Điểm học bổng được tính theo công thức: Điểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100 (trong đó Điểm rèn luyện / 25 là quy đổi về thang điểm 4). Với điểm học tập là 3.45 và điểm rèn luyện là 80, điểm học bổng của bạn là: (3.45 x 80 + (80 / 25) x 20) / 100 = (276 + 3.2 x 20) / 100 = (276 + 64) / 100 = 3.40."
  y_bat_buoc:
    - "Công thức: Điểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100"
    - "Điểm rèn luyện / 25 là quy đổi về thang điểm 4"
    - "Điểm học bổng tính ra là 3.40"
  nguon:
    - "Đ9: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-029
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Thầy cô ơi, em vừa mới có điểm tổng kết học kỳ xong, điểm học tập của em là 3.55 còn điểm rèn luyện được 90 điểm. Em không rõ công thức tính điểm học bổng khuyến khích học tập của trường mình như thế nào để xếp loại từ cao xuống thấp. Thầy cô cho em xin công thức và tính giúp điểm học bổng của em với ạ."
  dap_an_nhap: "Điểm học bổng được tính theo công thức: Điểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100 (trong đó Điểm rèn luyện / 25 là quy đổi về thang điểm 4). Với điểm học tập 3.55 và điểm rèn luyện 90, điểm học bổng của bạn là: (3.55 x 80 + (90 / 25) x 20) / 100 = (284 + 3.6 x 20) / 100 = (284 + 72) / 100 = 3.56."
  y_bat_buoc:
    - "Công thức: Điểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100"
    - "Điểm rèn luyện / 25 là quy đổi về thang điểm 4"
    - "Điểm học bổng tính ra là 3.56"
  nguon:
    - "Đ10: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-030
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi công thức tính điểm trung bình chung tích lũy của trường mình được quy định như thế nào vậy ạ?"
  dap_an_nhap: "Điểm trung bình chung tích lũy được tính theo công thức: A = Σ(ai × ni) / Σ(ni) và làm tròn đến 2 chữ số thập phân. Trong đó: A là điểm trung bình chung tích lũy; ai là điểm của học phần thứ i; ni là số tín chỉ của học phần thứ i; n là tổng số học phần."
  y_bat_buoc:
    - "Công thức: A = Σ(ai × ni) / Σ(ni)"
    - "Làm tròn đến 2 chữ số thập phân"
    - "A là điểm trung bình chung tích lũy"
    - "ai là điểm của học phần thứ i"
    - "ni là số tín chỉ của học phần thứ i"
    - "n là tổng số học phần"
  nguon:
    - "Đ1: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-069
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "sinh vien tham gia nckh thi co dc nhan kinh phi gi ko a voi neu dat giai thuong nckh thi co dc chuyen diem mon hoc ko"
  dap_an_nhap: "Theo quy định, sinh viên tham gia nghiên cứu khoa học được nhận kinh phí thực hiện đề tài (theo đề cương được Hội đồng Khoa học và Đào tạo Trường xét duyệt) và các khoản hỗ trợ, khen thưởng khác theo quy định của Bộ và của Trường. Nếu có đề tài đạt giải thưởng NCKH, sinh viên sẽ được cấp giấy chứng nhận đạt giải, giấy khen và được chuyển điểm vào điểm của môn học có liên quan."
  y_bat_buoc:
    - "Được nhận kinh phí thực hiện đề tài (theo đề cương được Hội đồng Khoa học và Đào tạo Trường xét duyệt)"
    - "Được nhận các khoản hỗ trợ, khen thưởng khác theo quy định của Bộ và của Trường"
    - "Sinh viên có đề tài đạt giải thưởng NCKH được cấp giấy chứng nhận đạt giải, giấy khen"
    - "Được chuyển điểm vào điểm của môn học có liên quan"
  nguon:
    - "Đ11: Quy định về việc tổ chức hoạt động nghiên cứu khoa học của sinh viên, Điều 12"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ11 không có thông tin thủ tục, hồ sơ, nơi nộp và thời hạn giải quyết; chuyển sang hỏi quyền lợi của sinh viên khi tham gia NCKH (nhận kinh phí và chuyển đổi điểm môn học)"
- phieu: V4-072
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Sinh viên muốn xin thôi học thì cần làm những thủ tục gì và có điều kiện gì không ạ?"
  dap_an_nhap: "Sinh viên được phép thôi học nếu có đơn xin thôi học với lý do rõ ràng, hợp lệ và bồi hoàn đầy đủ kinh phí đào tạo."
  y_bat_buoc:
    - "Có đơn xin thôi học với lý do rõ ràng, hợp lệ"
    - "Bồi hoàn đầy đủ kinh phí đào tạo"
  nguon:
    - "Đ12: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 31"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ12 chỉ quy định điều kiện nộp đơn thôi học và bồi hoàn kinh phí, không nêu chi tiết nơi nộp và thời hạn giải quyết"
- phieu: V4-074
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu, em tính đk học cùng lúc hai chương trình (song bằng) thì từ năm mấy mới dc đăng ký và cần đk điểm tích lũy ntn ạ?"
  dap_an_nhap: "Sinh viên được đăng ký học chương trình thứ hai sớm nhất khi đã được xếp trình độ năm thứ hai của chương trình thứ nhất. Tại thời điểm đăng ký, sinh viên phải đáp ứng một trong hai điều kiện: (1) Học lực theo điểm trung bình tích lũy xếp loại khá trở lên và đáp ứng ngưỡng bảo đảm chất lượng của chương trình thứ hai trong năm tuyển sinh; hoặc (2) Học lực theo điểm trung bình tích lũy xếp loại trung bình và đáp ứng điều kiện trúng tuyển của chương trình thứ hai trong năm tuyển sinh (cùng các điều kiện bổ sung khác theo quy định hiện hành của Trường)."
  y_bat_buoc:
    - "Sớm nhất khi đã được xếp trình độ năm thứ hai của chương trình thứ nhất"
    - "Điểm trung bình tích lũy xếp loại khá trở lên và đáp ứng ngưỡng bảo đảm chất lượng của chương trình thứ hai trong năm tuyển sinh"
    - "Điểm trung bình tích lũy xếp loại trung bình và đáp ứng điều kiện trúng tuyển của chương trình thứ hai trong năm tuyển sinh"
  nguon:
    - "Đ13: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 19"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ13 không nêu cụ thể nơi nộp hay thời hạn giải quyết hồ sơ (khoản 6 dẫn chiếu quy định hiện hành), chuyển sang hỏi điều kiện và thời điểm được phép đăng ký học cùng lúc hai chương trình"
