- phieu: V4-128
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi Phòng Công nghệ Thông tin hỗ trợ những công việc gì liên quan đến sinh viên vậy ạ? Với lại Trung tâm Ngoại ngữ của trường thì hỗ trợ sinh viên những việc gì ạ?"
  dap_an_nhap: "Các công việc liên quan đến sinh viên của hai đơn vị gồm:\n1. Phòng Công nghệ Thông tin:\n- Quản lý email của sinh viên được cấp theo tên miền của Trường Đại học Sư phạm Thành phố Hồ Chí Minh;\n- Quản lý trang thông tin điện tử của Trường;\n- Hỗ trợ về tài khoản sinh viên trên hệ thống phần mềm quản lý đào tạo theo học chế tín chỉ;\n- Quản lý về kỹ thuật với các hệ thống phần mềm tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh;\n- Phụ trách kỹ thuật phòng máy chủ và hệ thống mạng trung tâm của Trường;\n- Các công tác khác có liên quan đến công nghệ thông tin.\n\n2. Trung tâm Ngoại ngữ:\nTổ chức các loại hình lớp học ngoại ngữ, luyện thi, tổ chức thi các chứng chỉ ngoại ngữ quốc gia và phối hợp tổ chức thi cấp chứng chỉ ngoại ngữ quốc tế, cụ thể:\n- Giảng dạy các Chương trình Ngoại ngữ tổng quát theo Khung năng lực ngoại ngữ 6 bậc dùng cho Việt Nam, các lớp chuyên luyện các kỹ năng ngoại ngữ từ cơ bản đến nâng cao;\n- Tổ chức kỳ thi cấp chứng chỉ/chứng nhận năng lực ngoại ngữ theo Khung năng lực ngoại ngữ 6 bậc dùng cho Việt Nam;\n- Giảng dạy các Chương trình Ngoại ngữ Quốc tế như TOEFL, TOEIC, IELTS, HSK, DELF, DALF, N1 – N5,… Phối hợp với các Tổ chức Khảo thí Quốc tế tổ chức các kỳ thi nói trên."
  y_bat_buoc:
    - "Phòng CNTT: Quản lý email của sinh viên được cấp theo tên miền của Trường Đại học Sư phạm Thành phố Hồ Chí Minh"
    - "Phòng CNTT: Hỗ trợ về tài khoản sinh viên trên hệ thống phần mềm quản lý đào tạo theo học chế tín chỉ"
    - "Phòng CNTT: Quản lý trang thông tin điện tử, quản lý kỹ thuật hệ thống phần mềm, phụ trách phòng máy chủ và hệ thống mạng trung tâm"
    - "Trung tâm Ngoại ngữ: Giảng dạy các Chương trình Ngoại ngữ tổng quát theo Khung năng lực ngoại ngữ 6 bậc dùng cho Việt Nam, các lớp chuyên luyện kỹ năng ngoại ngữ"
    - "Trung tâm Ngoại ngữ: Tổ chức kỳ thi cấp chứng chỉ/chứng nhận năng lực ngoại ngữ theo Khung năng lực ngoại ngữ 6 bậc dùng cho Việt Nam"
    - "Trung tâm Ngoại ngữ: Giảng dạy các Chương trình Ngoại ngữ Quốc tế (TOEFL, TOEIC, IELTS, HSK, DELF, DALF, N1 – N5,...) và phối hợp tổ chức thi cấp chứng chỉ ngoại ngữ quốc tế"
  nguon:
    - "Đ7: Danh bạ trong Sổ tay sinh viên K50, 1. Phòng Công nghệ Thông tin"
    - "Đ8: Danh bạ trong Sổ tay sinh viên K50, 19. Trung tâm Ngoại ngữ"
  hanh_vi: tra_loi
  ghi_chu: ""
