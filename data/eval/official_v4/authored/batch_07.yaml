- phieu: V4-144
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em muốn tham gia các hoạt động giao lưu văn hóa và học thuật với sinh viên nước ngoài thì liên hệ đơn vị nào và ở đâu ạ? Ngoài ra, em biết điểm tích lũy dưới 1,0 là Kém còn từ 2,0 đến dưới 2,5 là Trung bình, vậy nếu điểm là 1,8 thì xếp loại học lực gì, khung thang điểm 4 của loại Yếu được quy định thế nào ạ?"
  dap_an_nhap: "1. Để tham gia giao lưu văn hóa – học thuật với sinh viên nước ngoài, bạn liên hệ Phòng Hợp tác Quốc tế[cite: 1]:\n- Địa chỉ: Nhà A, tầng 1, P.111, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM[cite: 1].\n- Điện thoại: (028) 38391080[cite: 1].\n- Email: phonghtqt@hcmue.edu.vn[cite: 1].\n2. Theo Bảng xếp loại học lực theo thang điểm 4, loại Yếu có thang điểm 4 từ 1,0 đến dưới 2,0[cite: 1]. Do đó, mức điểm 1,8 được xếp loại học lực Yếu[cite: 1]."
  y_bat_buoc:
    - "Giao lưu văn hóa – học thuật với sinh viên nước ngoài: Phòng Hợp tác Quốc tế"
    - "Địa chỉ: Nhà A, tầng 1, P.111, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM"
    - "Điện thoại: (028) 38391080"
    - "Email: phonghtqt@hcmue.edu.vn"
    - "Xếp loại Yếu theo thang điểm 4: Từ 1,0 đến dưới 2,0 (điểm 1,8 xếp loại Yếu)"
