- phieu: V4-134
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "nganh Giao duc Tieu hoc thuoc khoa nao quan ly vay ad? voi e biet de xet hb Gioi thi can diem hoc tap tu 3.20 den 3.59 va drl >= 80 roi, the diem hoc bong dat 3.40 thi co nam trong khoang diem xet loai Gioi khong, khoang diem hb loai Gioi quy dinh la bao nhieu the a"
  dap_an_nhap: "1. Ngành Giáo dục Tiểu học thuộc Khoa Giáo dục Tiểu học[cite: 1].\n2. Theo quy định xếp loại học bổng khuyến khích học tập, Học bổng loại Giỏi có khoảng điểm học bổng từ 3,20 đến 3,67 (với điều kiện điểm học tập từ 3,20 – 3,59 và điểm rèn luyện >= 80)[cite: 1]. Do đó, điểm học bổng đạt 3,40 nằm trong khoảng điểm xét học bổng loại Giỏi[cite: 1]."
  y_bat_buoc:
    - "Ngành Giáo dục Tiểu học thuộc Khoa Giáo dục Tiểu học"
    - "Khoảng điểm học bổng loại Giỏi: từ 3,20 đến 3,67 (hoặc 3.20 - 3.67)"
    - "Điểm học tập: 3,20 – 3,59 (hoặc 3.20 - 3.59)"
    - "Điểm rèn luyện: >= 80"
  nguon:
    - "Đ25: Danh bạ trong Sổ tay sinh viên K50"
    - "Đ26: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-135
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hoi xiu a, neu ket qua hoc tap cua em xep loai Xuat sac nhung drl chi dat loai Kha thi co duoc xet hb loai Kha khong a? voi ca cong thuc tinh diem hb nhu the nao, vi du diem hoc tap cua em la 3.6 con drl la 85 thi diem hb ra bao nhieu vay a?"
  dap_an_nhap: "1. Theo bảng xếp loại học bổng khuyến khích học tập, sinh viên có kết quả học tập xếp loại Xuất sắc và kết quả rèn luyện xếp loại Khá sẽ được xét cấp học bổng loại Khá[cite: 1].\n2. Công thức tính điểm học bổng:\nĐiểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100[cite: 1].\n(Trong đó: Điểm rèn luyện / 25 là quy đổi về thang điểm 4)[cite: 1].\nVới số liệu của bạn: Điểm học tập = 3,6 và Điểm rèn luyện = 85 (quy đổi thang 4: 85 / 25 = 3,4), điểm học bổng được tính là:\nĐiểm học bổng = (3,6 × 80 + 3,4 × 20) / 100 = (288 + 68) / 100 = 3,56."
  y_bat_buoc:
    - "Kết quả học tập Xuất sắc và kết quả rèn luyện Khá được xếp/xét học bổng loại Khá"
    - "Công thức tính điểm học bổng: (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100"
    - "Điểm rèn luyện / 25 là quy đổi về thang điểm 4"
    - "Kết quả tính với số liệu nêu (điểm học tập 3,6 và rèn luyện 85): 3,56"
  nguon:
    - "Đ5: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-136
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi công thức tính điểm trung bình chung học kỳ của trường mình được tính thế nào ạ? Nếu kỳ này em học 1 môn 3 tín chỉ đạt điểm B+ (3,5) và 1 môn 2 tín chỉ đạt điểm A (4,0) thì điểm trung bình chung học kỳ của em là bao nhiêu? Với lại ngành Giáo dục Đặc biệt thuộc khoa nào vậy ạ?"
  dap_an_nhap: "1. Công thức tính điểm trung bình chung học kỳ:\nA = Σ(ai × ni) / Σ(ni), làm tròn đến 2 chữ số thập phân[cite: 1].\nTrong đó: A là điểm trung bình chung học kỳ; ai là điểm của học phần thứ i (theo thang điểm 4); ni là số tín chỉ của học phần thứ i; n là tổng số học phần[cite: 1].\nVới số liệu của bạn: môn 3 tín chỉ đạt 3,5 và môn 2 tín chỉ đạt 4,0, điểm trung bình chung học kỳ là:\nA = (3,5 × 3 + 4,0 × 2) / (3 + 2) = (10,5 + 8,0) / 5 = 18,5 / 5 = 3,70.\n2. Ngành Giáo dục Đặc biệt thuộc Khoa Giáo dục Đặc biệt[cite: 1]."
  y_bat_buoc:
    - "Công thức tính điểm trung bình chung: A = Σ(ai × ni) / Σ(ni)"
    - "Làm tròn đến 2 chữ số thập phân"
    - "A là điểm trung bình chung học kỳ, ai là điểm học phần thứ i, ni là số tín chỉ học phần thứ i, n là tổng số học phần"
    - "Kết quả tính theo số liệu đã cho: 3,70"
    - "Ngành Giáo dục Đặc biệt thuộc Khoa Giáo dục Đặc biệt"
  nguon:
    - "Đ1: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
    - "Đ27: Danh bạ trong Sổ tay sinh viên K51"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-137
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô ạ, đợt vừa rồi em bị ốm phải nghỉ mất mấy buổi nên kết quả một môn đại cương không được như ý. Em có xem bảng quy đổi điểm chữ sang thang 4 thì thấy điểm F+ được quy đổi thành 0,5 điểm. Thầy cô cho em hỏi nếu chẳng may bị điểm chữ F thì quy đổi sang thang điểm 4 sẽ là bao nhiêu điểm ạ? Ngoài ra em đang muốn hỏi giúp người quen định thi vào ngành Quản lý giáo dục, không biết ngành này trực thuộc khoa nào quản lý vậy ạ?"
  dap_an_nhap: "1. Theo Bảng quy đổi điểm chữ sang thang điểm 4, thang điểm chữ F được quy đổi sang thang điểm 4 là 0,0[cite: 1].\n2. Ngành Quản lý giáo dục thuộc Khoa Khoa học Giáo dục[cite: 1]."
  y_bat_buoc:
    - "Thang điểm chữ F quy đổi sang thang điểm 4 là 0,0"
    - "Ngành Quản lý giáo dục thuộc Khoa Khoa học Giáo dục"
  nguon:
    - "Đ28: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
    - "Đ29: Danh bạ trong Sổ tay sinh viên K48-K49"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-138
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em muốn tìm kiếm việc làm thêm và thông tin khảo sát, giới thiệu chỗ trọ thì liên hệ đơn vị nào của trường ạ? Thêm nữa, em biết mức học bổng Giỏi nhân hệ số 1,25 còn Xuất sắc nhân hệ số 1,5, vậy công thức tính mức học bổng loại Khá quy định hệ số là bao nhiêu và căn cứ học phí thế nào ạ?"
  dap_an_nhap: "1. Để được hỗ trợ giới thiệu việc làm, thông tin học bổng, khảo sát và giới thiệu chỗ trọ, bạn liên hệ Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp[cite: 1]:\n- Điện thoại: (028) 38352020[cite: 1].\n- Email: csaed@hcmue.edu.vn[cite: 1].\n2. Mức học bổng khuyến khích học tập loại Khá được tính theo công thức: Số tín chỉ x định mức học phí 1 tín chỉ x 1,0 (hệ số là 1,0)[cite: 1]. Trong đó, mức học phí 1 tín chỉ được xác định phụ thuộc vào ngành học của sinh viên và quy định mức thu học phí trong năm học đó[cite: 1]."
  y_bat_buoc:
    - "Đơn vị hỗ trợ việc làm, chỗ trọ: Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp"
    - "Điện thoại: (028) 38352020"
    - "Email: csaed@hcmue.edu.vn"
    - "Công thức học bổng loại Khá: Số tín chỉ x định mức học phí 1 tín chỉ x 1,0 (hệ số 1,0)"
    - "Mức học phí 1 tín chỉ phụ thuộc vào ngành học của sinh viên và quy định mức thu học phí trong năm học đó"
  nguon:
    - "Đ30: Danh bạ trong Sổ tay sinh viên K50"
    - "Đ26: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-139
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hoi xiu, em biet diem thang 10 tu 3.0 den 3.9 la xep F+ khong dat roi, the neu diem hoc phan bi 2.5 thi quy doi sang diem chu gi va dat hay khong dat a? tien cho em hoi luon dia chi vp Khoa Vat ly o dau vay a"
  dap_an_nhap: "1. Theo Bảng quy đổi thang điểm 10 sang điểm chữ, khoảng điểm từ 0,0 – 2,9 (bao gồm điểm 2,5) thuộc loại Không đạt và được quy đổi sang thang điểm chữ là F[cite: 1].\n2. Văn phòng làm việc của Khoa Vật lý: Nhà B, tầng 5, P.504, P.509, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM[cite: 1]. (Điện thoại: (028) 38352020, số máy nội bộ: 109, 110; Email: khoavatly@hcmue.edu.vn)[cite: 1]."
  y_bat_buoc:
    - "Điểm thang 10 từ 0,0 – 2,9 (điểm 2,5) quy đổi sang thang điểm chữ là F"
    - "Loại: Không đạt"
    - "Văn phòng Khoa Vật lý: Nhà B, tầng 5, P.504, P.509, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM"
  nguon:
