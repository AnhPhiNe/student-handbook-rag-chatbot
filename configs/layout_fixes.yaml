# Places where the PDF text does not show the handbook's structure, reviewed by hand
# (2026-10-05). A fix only says how lines group; it never changes the handbook's words.
# `line` is the exact line after whitespace cleanup; `line_prefix` matches the start
# of a line. A fix that matches no line fails the build.
#
# fix:
#   heading_tail   the line is the end of the article heading the stored title lacks
#   table_header   the line heads a column of the table under it; it goes with the table
#   label_of_next  the line names the marked line under it (a date in a timeline)
#   split_items    the PDF ran a list into one line: split it before each `before`
#                  that follows ";" or ":"
#   nested_list    the next `lines` marked lines belong to this point, although they
#                  use the clause marker
#   starts_group   the line introduces the points under it as a new group
