      noi_dung: "Kỳ này điểm trung bình tích lũy của em được 1.6 theo thang điểm 4 thì xếp loại học lực gì vậy ạ?"
  dap_an_nhap: "Điểm trung bình tích lũy đạt 1.6 (thuộc khoảng từ 1,0 đến dưới 2,0) được xếp loại học lực Yếu."
  y_bat_buoc:
