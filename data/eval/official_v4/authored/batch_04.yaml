    - "Đ18: Nghị định quy định về chính sách hỗ trợ tiền đóng học phí, chi phí sinh hoạt đối với sinh viên sư phạm, Điều 7[cite: 1]"
    - "Đ19: Danh bạ trong Sổ tay sinh viên K48-K49[cite: 1]"
    - "Đ20: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11[cite: 1]"
    - "Đ21: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 38[cite: 1]"
  hanh_vi: tra_loi
  ghi_chu: "Yêu cầu 1: Đoạn Đ18 không nêu hệ quả vi phạm hoặc ngoại lệ, chuyển sang hỏi về thời hạn và số lượng hồ sơ nộp đơn đề nghị hỗ trợ tiền đóng học phí và chi phí sinh hoạt của sinh viên sư phạm."
