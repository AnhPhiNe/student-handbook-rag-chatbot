# Phòng CTCT-HSSV, Phòng Hợp tác Quốc tế, Phòng Khảo thí, Phòng Quản trị –
# Thiết bị, Phòng Tổ chức – Hành chính, Phòng Đào tạo, Thư viện, Trung tâm
# Ngoại ngữ, Trung tâm Tin học, Trạm Y tế), so measuring on them cannot tune
# the system to the hold-out. The official_v1 office tasks are added by the
# script from their planner outputs.
