burst:
  - "Quy định rút bớt học phần sau đăng ký như thế nào?"
  - "Em muốn hỏi chính sách học hai chương trình cùng lúc."
  - "Bị khiển trách thì sau thời gian nào quyết định hết hiệu lực?"
  - "Học lại lấy điểm quá trình cũ được không, còn cải thiện thì lấy lần nào?"
  - "Nghỉ tạm để thực hiện nghĩa vụ quân sự có được bảo lưu kết quả không?"
  - "Lớp học phần không đủ sinh viên thì nhà trường xử lý thế nào?"
  - "Giấy chứng nhận các môn đã tích lũy có được cấp sau khi thôi học không?"
  - "Không đồng ý quyết định kỷ luật thì được khiếu nại lên đâu?"
  - "Em cần điều kiện tốt nghiệp và những trường hợp bằng giỏi bị giảm hạng."
  - "Khi tự đánh giá rèn luyện em có cần nộp minh chứng hoạt động không?"
