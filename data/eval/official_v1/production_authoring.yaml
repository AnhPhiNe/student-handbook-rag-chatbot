# Operational requests, not answer-quality gold. No fault injection on HF.
# Warm repeats and sync/stream pairs intentionally share question and cohort.
cold_rag:
  - "Nếu phải đi nghĩa vụ trong thời gian học thì trường cho nghỉ tạm theo quy định nào?"
  - "Em muốn xin chuyển ngành sau năm nhất, cần đáp ứng những gì?"
  - "Học cải thiện mà lần sau thấp hơn thì điểm môn lấy lần nào?"
  - "Khiển trách có làm ảnh hưởng kết quả xét rèn luyện không?"
  - "Em xin nghỉ vì bệnh dài ngày thì cần chứng minh gì, khi học lại phải xin tiếp nhận ra sao?"
  - "Học cùng lúc hai ngành thì khi nào mới được xét tốt nghiệp ngành thứ hai?"
  - "Lỡ buổi thi vì lý do chính đáng thì em phải làm thủ tục gì?"
  - "Thời gian nghỉ học vì nhu cầu cá nhân có tính vào hạn học tối đa không?"
  - "Còn thiếu chuẩn đầu ra ngoại ngữ khi hết thời hạn học thì xử lý ra sao?"
  - "Người học liên thông có được xét học bổng khuyến khích học tập của trường không?"
  - "Nhà trường xử lý việc sử dụng chứng chỉ giả để tốt nghiệp thế nào?"
  - "Muốn khiếu nại kết quả rèn luyện thì thủ tục và thời hạn ra sao?"
  - "Việc chuyển tín chỉ từ trường khác có được tự động chấp nhận không?"
  - "Trường có cho đổi môn tự chọn bắt buộc đã trượt không?"
  - "Sinh viên hệ vừa làm vừa học bị cảnh báo do nợ tín chỉ thì được đăng ký những môn nào?"
  - "Học lại nhiều có bị hạ bằng, còn thiếu ngoại ngữ thì có được bổ sung sau khi hết thời gian học không?"
  - "Hết thời gian đình chỉ thì em cần giấy xác nhận gì để trường nhận lại?"
  - "Điểm học bổng bằng nhau thì ưu tiên ai, tiền học bổng được chuyển qua đâu?"
  - "Sinh viên năm cuối có được xin đổi ngành đào tạo không?"
  - "Không tự chấm rèn luyện thì bị xử lý sao, nếu điểm đã công bố sai thì khiếu nại ở đâu?"
structured:
