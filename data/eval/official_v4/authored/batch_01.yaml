    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu, ai chỉ định đại diện lớp học phần và bạn này có trách nhiệm gì v ạ?"
  dap_an_nhap: "Đại diện lớp học phần do giảng viên phụ trách lớp học phần chỉ định và có trách nhiệm báo cáo việc chấp hành nội quy, quy định, quy chế của sinh viên với khoa.[cite: 2]"
  y_bat_buoc:
    - "giảng viên phụ trách lớp học phần chỉ định[cite: 2]"
    - "báo cáo việc chấp hành nội quy, quy định, quy chế của sinh viên với khoa[cite: 2]"
  nguon:
    - "Đ26: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 26[cite: 2]"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ26 không nêu hệ quả vi phạm hay trường hợp ngoại lệ, chuyển sang hỏi người chỉ định và trách nhiệm của đại diện lớp học phần."
- phieu: V4-078
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Những trường hợp nào thì cá nhân sinh viên không được xét khen thưởng toàn diện, định kỳ cuối năm học vậy ạ?"
  dap_an_nhap: "Không xét khen thưởng đối với sinh viên bị kỷ luật hoặc có điểm thi kết thúc học phần ở lần thi thứ nhất trong học kỳ hoặc năm học đó dưới mức trung bình.[cite: 2]"
  y_bat_buoc:
    - "bị kỷ luật[cite: 2]"
    - "có điểm thi kết thúc học phần ở lần thi thứ nhất trong học kỳ hoặc năm học đó dưới mức trung bình[cite: 2]"
  nguon:
    - "Đ27: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 32[cite: 2]"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-080
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Sinh viên sư phạm phải bồi hoàn kinh phí hỗ trợ tiền đóng học phí và chi phí sinh hoạt trong những trường hợp nào vậy ạ?"
  dap_an_nhap: "Đối tượng phải bồi hoàn kinh phí hỗ trợ tiền đóng học phí và chi phí sinh hoạt gồm: sinh viên sư phạm đã hưởng chính sách không công tác trong ngành giáo dục sau 02 năm kể từ ngày có quyết định công nhận tốt nghiệp; sinh viên sư phạm đã hưởng chính sách và công tác trong ngành giáo dục nhưng không đủ thời gian công tác theo quy định; sinh viên sư phạm được hưởng chính sách đang trong thời gian đào tạo nhưng chuyển sang ngành đào tạo khác, tự thôi học, không hoàn thành CTĐT hoặc bị kỷ luật buộc thôi học.[cite: 2]"
  y_bat_buoc:
    - "không công tác trong ngành giáo dục sau 02 năm kể từ ngày có quyết định công nhận tốt nghiệp[cite: 2]"
    - "công tác trong ngành giáo dục nhưng không đủ thời gian công tác theo quy định[cite: 2]"
    - "chuyển sang ngành đào tạo khác, tự thôi học, không hoàn thành CTĐT hoặc bị kỷ luật buộc thôi học[cite: 2]"
  nguon:
    - "Đ28: Nghị định quy định về chính sách hỗ trợ tiền đóng học phí, chi phí sinh hoạt đối với sinh viên sư phạm, Điều 6[cite: 2]"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-083
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Nếu vi phạm quy định các kỳ thi và bị lập biên bản kỷ luật thì sinh viên bị trừ điểm rèn luyện ở Phần I như thế nào ạ?"
  dap_an_nhap: "Khi vi phạm quy định các kỳ thi và bị lập biên bản hình thức kỷ luật, điểm trừ được tính cho tất cả những lần vi phạm và không vượt quá khung 20 điểm như sau: Khiển trách: lần đầu - 2 điểm, lần thứ 2 trở lên - 4 điểm/lần; Cảnh cáo: lần đầu - 3 điểm, lần thứ 2 trở lên - 6 điểm/lần; Đình chỉ thi: lần đầu - 4 điểm, lần thứ 2 trở lên - 8 điểm/lần.[cite: 2]"
  y_bat_buoc:
    - "Khiển trách: lần đầu - 2 điểm, lần thứ 2 trở lên - 4 điểm/lần[cite: 2]"
    - "Cảnh cáo: lần đầu - 3 điểm, lần thứ 2 trở lên - 6 điểm/lần[cite: 2]"
    - "Đình chỉ thi: lần đầu - 4 điểm, lần thứ 2 trở lên - 8 điểm/lần[cite: 2]"
    - "Điểm trừ được tính tất cả những lần vi phạm và không vượt quá khung 20 điểm[cite: 2]"
  nguon:
    - "Đ29: Phiếu đánh giá kết quả rèn luyện sinh viên (Phụ lục 1), Phần I. Đánh giá về ý thức tham gia học tập (Tối đa 20 điểm)[cite: 2]"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-084
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu, sv sư phạm được hỗ trợ tiền chi phí sinh hoạt bao nhiêu 1 tháng và tối đa mấy tháng trong năm học v ạ?"
  dap_an_nhap: "Sinh viên sư phạm được Nhà nước hỗ trợ 3,63 triệu đồng/tháng để chi trả chi phí sinh hoạt trong thời gian học tập tại trường. Thời gian hỗ trợ tiền đóng học phí và chi phí sinh hoạt được xác định theo số tháng thực tế học tập tại trường theo quy định, nhưng không quá 10 tháng/năm học.[cite: 2]"
  y_bat_buoc:
    - "3,63 triệu đồng/tháng[cite: 2]"
    - "không quá 10 tháng/năm học[cite: 2]"
  nguon:
    - "Đ30: Nghị định quy định về chính sách hỗ trợ tiền đóng học phí, chi phí sinh hoạt đối với sinh viên sư phạm, Điều 4[cite: 2]"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ30 không nêu hệ quả vi phạm hay trường hợp ngoại lệ, chuyển sang hỏi mức hỗ trợ chi phí sinh hoạt và thời gian hỗ trợ tối đa trong năm học."
