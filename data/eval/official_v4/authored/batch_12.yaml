      noi_dung: "Cho em hỏi ngành Ngôn ngữ Nga thuộc khoa nào vậy ạ? Sẵn tiện cho em hỏi thủ tục xin visa du lịch Hàn Quốc tự túc gồm những giấy tờ gì ạ?"
  dap_an_nhap: "Ngành Ngôn ngữ Nga thuộc Khoa Tiếng Nga.[cite: 2] Còn về thủ tục xin visa du lịch Hàn Quốc, nội dung này nằm ngoài phạm vi quy chế và dịch vụ sinh viên của trường nên tôi không thể hỗ trợ bạn."
  y_bat_buoc:
    - "Khoa Tiếng Nga[cite: 2]"
    - "từ chối trả lời thủ tục xin visa du lịch"
  nguon:
    - "Đ12: Danh bạ trong Sổ tay sinh viên K50[cite: 2]"
  hanh_vi: tra_loi_va_tu_choi
  ghi_chu: ""
- phieu: V4-245
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, ban cán sự lớp mà hoàn thành xuất sắc nhiệm vụ thì được cộng mấy điểm đrl ở phần V dạ? Với ad biết cách trị mụn trứng cá tuổi dậy thì hiệu quả không chỉ em với."
  dap_an_nhap: "Theo khung điểm rèn luyện ở Phần V, sinh viên giữ chức vụ Ban cán sự lớp nếu Hoàn thành Xuất sắc nhiệm vụ sẽ được 3 điểm.[cite: 2] Về cách trị mụn trứng cá, câu hỏi này nằm ngoài phạm vi tư vấn quy chế và dịch vụ sinh viên của trường nên tôi không thể giải đáp."
  y_bat_buoc:
    - "3 điểm[cite: 2]"
    - "từ chối trả lời về cách trị mụn trứng cá"
  nguon:
    - "Đ13: Phiếu đánh giá kết quả rèn luyện sinh viên (Phụ lục 1), Phần V. Đánh giá về ý thức và kết quả tham gia công tác phụ trách lớp, các đoàn thể, tổ chức trong nhà trường; đạt thành tích xuất sắc trong học tập, rèn luyện (Tối đa 10 điểm)[cite: 2]"
  hanh_vi: tra_loi_va_tu_choi
  ghi_chu: ""
