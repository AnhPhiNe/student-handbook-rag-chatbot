- phieu: V4-223
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, đrl kỳ này của em được 75 điểm thì xếp loại gì dạ? Với lại môn chỉ tính đạt/không đạt thì em có bị tính là chưa đạt không ad?"
  dap_an_nhap: "Với điểm rèn luyện 75 điểm, bạn được xếp loại Khá.[cite: 2] Đối với học phần đánh giá đạt/không đạt không phân mức, bạn vui lòng cung cấp điểm theo thang điểm 10 của học phần đó để biết kết quả đạt hay chưa đạt (dưới 5,0 điểm là chưa đạt, từ 5,0 điểm trở lên là đạt).[cite: 2]"
  y_bat_buoc:
    - "Xếp loại Khá[cite: 2]"
    - "hỏi lại điểm thang điểm 10 của sinh viên ở học phần đó"
  nguon:
    - "Đ1: Quy chế đánh giá kết quả rèn luyện của sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 9[cite: 2]"
    - "Đ2: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10[cite: 2]"
  hanh_vi: tra_loi_va_hoi_lai
  ghi_chu: ""
- phieu: V4-224
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em muốn xin địa chỉ email của Phòng Sau Đại học ạ. Với lại cho em hỏi điểm môn vừa rồi của em có bị quy thành điểm F+ không ạ?"
  dap_an_nhap: "Địa chỉ email của Phòng Sau Đại học là phongsdh@hcmue.edu.vn.[cite: 2] Về điểm môn học, bạn vui lòng cung cấp điểm theo thang điểm 10 của học phần đó để biết có bị quy đổi thành điểm F+ (không đạt, áp dụng cho khoảng điểm 3,0 – 3,9) hay không.[cite: 2]"
  y_bat_buoc:
    - "phongsdh@hcmue.edu.vn[cite: 2]"
    - "hỏi lại điểm thang điểm 10 của sinh viên"
  nguon:
    - "Đ3: Danh bạ trong Sổ tay sinh viên K50[cite: 2]"
    - "Đ4: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10[cite: 2]"
  hanh_vi: tra_loi_va_hoi_lai
  ghi_chu: ""
- phieu: V4-225
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Học kỳ này em có kết quả học tập loại Xuất sắc và rèn luyện loại Tốt thì được xét học bổng khuyến khích học tập loại nào ạ? Cho em hỏi thêm là học lực của em có bị xếp loại Kém không ạ?"
  dap_an_nhap: "Với kết quả học tập Xuất sắc và rèn luyện loại Tốt, bạn đủ điều kiện xét học bổng khuyến khích học tập loại Giỏi.[cite: 2] Về xếp loại học lực, bạn vui lòng cung cấp điểm trung bình theo thang điểm 4 để xác định học lực (điểm dưới 1,0 mới xếp loại Kém).[cite: 2]"
  y_bat_buoc:
    - "loại Giỏi[cite: 2]"
    - "hỏi lại điểm trung bình thang điểm 4 của sinh viên"
  nguon:
    - "Đ5: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27[cite: 2]"
    - "Đ6: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11[cite: 2]"
  hanh_vi: tra_loi_va_hoi_lai
  ghi_chu: ""
- phieu: V4-226
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em muốn mua và in ấn giáo trình phục vụ học tập thì liên hệ đơn vị nào và ở đâu ạ? Tiện cho em hỏi chứng chỉ tiếng Nhật JLPT của em có được công nhận tương đương bậc 3 chuẩn đầu ra không ạ?"
  dap_an_nhap: "Để in ấn giáo trình phục vụ học tập, bạn liên hệ Nhà xuất bản ĐHSP Thành phố Hồ Chí Minh tại Nhà A, tầng trệt: P.007, tầng 1: P.114, tầng 2: P.212, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM.[cite: 2] Đối với chứng chỉ tiếng Nhật JLPT, bạn cần cung cấp cấp độ cụ thể của chứng chỉ để xác định quy đổi (cấp độ N4 tương đương bậc 3, cấp độ N3 tương đương bậc 4).[cite: 2]"
  y_bat_buoc:
    - "Nhà xuất bản ĐHSP Thành phố Hồ Chí Minh[cite: 2]"
    - "Nhà A, tầng trệt: P.007, tầng 1: P.114, tầng 2: P.212, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM[cite: 2]"
    - "hỏi lại cấp độ chứng chỉ JLPT của sinh viên"
  nguon:
    - "Đ7: Danh bạ trong Sổ tay sinh viên K50[cite: 2]"
    - "Đ8: Quy định tổ chức dạy học và công nhận đạt chuẩn đầu ra ngoại ngữ cho sinh viên tốt nghiệp các ngành đào tạo trình độ đại học của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 8[cite: 2]"
  hanh_vi: tra_loi_va_hoi_lai
  ghi_chu: ""
- phieu: V4-227
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em cần hỏi về việc xây dựng thời khóa biểu và đăng ký học phần thì liên hệ ai, ở phòng nào ạ? Tiện thể điểm học tập kỳ này của em là 3.6, nhờ trường tính giúp điểm xét học bổng của em với ạ."
  dap_an_nhap: "Về việc xây dựng thời khóa biểu và tổ chức đăng ký học phần, bạn liên hệ Phòng Đào tạo tại Nhà A, tầng 1, P.106, P.107 số 280 An Dương Vương, phường Chợ Quán, TP. HCM.[cite: 2] Để tính điểm học bổng theo công thức: Điểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100, bạn vui lòng cung cấp thêm điểm rèn luyện của mình.[cite: 2]"
  y_bat_buoc:
    - "Phòng Đào tạo[cite: 2]"
    - "Nhà A, tầng 1, P.106, P.107 số 280 An Dương Vương, phường Chợ Quán, TP. HCM[cite: 2]"
    - "hỏi lại điểm rèn luyện của sinh viên"
  nguon:
    - "Đ9: Danh bạ trong Sổ tay sinh viên K51[cite: 2]"
    - "Đ5: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27[cite: 2]"
  hanh_vi: tra_loi_va_hoi_lai
  ghi_chu: ""
- phieu: V4-228
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, môn em bị điểm D+ thì quy sang thang 4 được mấy điểm v ad? Tiện thể cho em hỏi môn Triết của em có được điểm C không ạ?"
  dap_an_nhap: "Điểm chữ D+ được quy đổi sang thang điểm 4 là 1,5 điểm.[cite: 2] Để biết môn Triết của bạn có đạt điểm chữ C (tương ứng thang điểm 10 từ 5,5 đến 6,2) hay không, bạn vui lòng cung cấp điểm thang điểm 10 của môn học đó.[cite: 2]"
  y_bat_buoc:
    - "1,5[cite: 2]"
    - "hỏi lại điểm thang điểm 10 của sinh viên"
  nguon:
    - "Đ10: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11[cite: 2]"
    - "Đ2: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10[cite: 2]"
  hanh_vi: tra_loi_va_hoi_lai
  ghi_chu: ""
