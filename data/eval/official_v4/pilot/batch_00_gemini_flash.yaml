- phieu: V4-229
  khong_phu_hop: ""
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ cho em hỏi học phí kỳ 1 năm học 2024-2025 của ngành Sư phạm Toán khóa K50 cụ thể là bao nhiêu tiền và hạn chót nộp là ngày mấy vậy ạ?"
  dap_an_nhap: "Rất tiếc là Sổ tay sinh viên không có thông tin chi tiết về mức học phí cụ thể cũng như thời hạn nộp học phí cho từng học kỳ hay năm học. Bạn vui lòng theo dõi thông báo đóng học phí chính thức trên cổng thông tin đào tạo hoặc liên hệ Phòng Kế hoạch - Tài chính của trường để được hướng dẫn chi tiết nhé."
  y_bat_buoc:
    - "Nói rõ Sổ tay sinh viên không có thông tin về số tiền học phí cụ thể và hạn nộp học phí của từng năm học/học kỳ"
    - "Gợi ý liên hệ Phòng Kế hoạch - Tài chính hoặc theo dõi thông báo chính thức của trường"
  nguon: []
