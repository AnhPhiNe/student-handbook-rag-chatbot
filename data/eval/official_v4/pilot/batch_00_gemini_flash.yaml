- phieu: V4-166
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi giữa khóa K50 và K51 thì quy định xử lý thế nào nếu sinh viên vi phạm kỷ luật không chấp hành viết bản tự kiểm điểm hoặc không đến dự buổi họp xét kỷ luật của trường ạ? Hai khóa có khác nhau không?"
  dap_an_nhap: "Quy định xử lý kỷ luật đối với các trường hợp này ở khóa K50 và K51 là hoàn toàn giống nhau, cụ thể:\n- Trường hợp sinh viên có khuyết điểm không chấp hành việc làm bản tự kiểm điểm thì Hội đồng vẫn họp để xử lý trên cơ sở các chứng cứ thu thập được.\n- Trường hợp sinh viên vi phạm kỷ luật đã được mời mà không đến dự (nếu không có lý do chính đáng) thì Hội đồng vẫn tiến hành họp và xét thêm khuyết điểm thiếu ý thức tổ chức kỷ luật."
  y_bat_buoc:
    - "Quy định của khóa K50 và khóa K51 là hoàn toàn giống nhau"
    - "Không chấp hành làm bản tự kiểm điểm: Hội đồng vẫn họp để xử lý trên cơ sở các chứng cứ thu thập được"
    - "Được mời mà không đến dự không có lý do chính đáng: Hội đồng vẫn tiến hành họp và xét thêm khuyết điểm thiếu ý thức tổ chức kỷ luật"
  nguon:
    - "Đ16: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 35"
    - "Đ17: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 35"
  hanh_vi: tra_loi
