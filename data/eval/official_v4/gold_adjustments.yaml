rules:
  F.refuse_in_domain:
    cases: [V4-229, V4-230, V4-231, V4-232, V4-233, V4-234, V4-235, V4-236]
    rule: >-
      The required suggestion ("gợi ý liên hệ ...") is met by any relevant
      official channel (the unit the handbook names for the topic, the faculty
      office, the adviser, the class officers, or the school's official
      notices or student portal), not only the channel the gold names. The
      scored core is saying the handbook does not hold the information and not
      inventing it.
