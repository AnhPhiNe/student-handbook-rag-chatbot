- phieu: V4-204
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho mình xin địa chỉ email của Viện Nghiên cứu Giáo dục với ạ."
    - vai: tro_ly
      noi_dung: "Địa chỉ email của Viện Nghiên cứu Giáo dục là vienncgd@hcmue.edu.vn."
    - vai: sinh_vien
      noi_dung: "Thế còn Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp hỗ trợ sinh viên những việc gì vậy bạn?"
  dap_an_nhap: "Những công việc liên quan đến sinh viên của Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp bao gồm:\n− Tổ chức dịch vụ hỗ trợ đời sống của sinh viên: giới thiệu việc làm, thông tin học bổng, khảo sát và giới thiệu chỗ trọ…;\n− Tổ chức các hoạt động trang bị, bồi dưỡng kỹ năng thực hành xã hội, các kiến thức, kỹ năng về khởi nghiệp cần thiết cho sinh viên theo từng đối tượng và chuyên ngành;\n− Tập huấn kỹ năng và hướng dẫn sinh viên tham gia các chương trình, dự án khởi nghiệp; tổ chức các hoạt động tạo môi trường để hỗ trợ sinh viên hình thành và hiện thực hóa các ý tưởng, dự án khởi nghiệp, góp phần tạo việc làm cho sinh viên sau khi tốt nghiệp;\n− Phối hợp các đơn vị tuyển chọn và quản lý các nhóm cộng tác viên (là sinh viên) hỗ trợ cho công tác tổ chức các sự kiện trong trường;\n− Tổ chức và phối hợp tổ chức các hoạt động nhằm nâng cao chuyên môn nghiệp vụ cho sinh viên khi tốt nghiệp;\n− Xây dựng và điều hành các kênh thông tin của trung tâm để nắm bắt và giải quyết các nhu cầu hỗ trợ sinh viên;\n− Tổ chức ngày hội việc làm, và các hoạt động giúp sinh viên tiếp cận với các nguồn lực của xã hội."
  y_bat_buoc:
    - "Tổ chức dịch vụ hỗ trợ đời sống của sinh viên: giới thiệu việc làm, thông tin học bổng, khảo sát và giới thiệu chỗ trọ…"
    - "Tổ chức các hoạt động trang bị, bồi dưỡng kỹ năng thực hành xã hội, các kiến thức, kỹ năng về khởi nghiệp cần thiết cho sinh viên theo từng đối tượng và chuyên ngành"
    - "Tập huấn kỹ năng và hướng dẫn sinh viên tham gia các chương trình, dự án khởi nghiệp; tổ chức các hoạt động tạo môi trường để hỗ trợ sinh viên hình thành và hiện thực hóa các ý tưởng, dự án khởi nghiệp, góp phần tạo việc làm cho sinh viên sau khi tốt nghiệp"
    - "Phối hợp các đơn vị tuyển chọn và quản lý các nhóm cộng tác viên (là sinh viên) hỗ trợ cho công tác tổ chức các sự kiện trong trường"
    - "Tổ chức và phối hợp tổ chức các hoạt động nhằm nâng cao chuyên môn nghiệp vụ cho sinh viên khi tốt nghiệp"
