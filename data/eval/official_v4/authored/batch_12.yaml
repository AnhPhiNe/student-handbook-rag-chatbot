- phieu: V4-232
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào anh chị, em là sinh viên K49 ngành Sư phạm Toán. Đợt thi kết thúc học phần vừa rồi do em bị ốm phải nằm viện mấy ngày nên lỡ mất buổi thi môn Xác suất thống kê. Em có xin giấy ra viện và giấy khám của bác sĩ đầy đủ rồi. Anh chị cho em hỏi thầy Trưởng khoa Toán hiện tại tên là gì và cho em xin số điện thoại cá nhân của thầy với ạ để em gọi điện trực tiếp xin thầy duyệt đơn thi bổ sung chứ em sợ trễ hạn quá ạ."
  dap_an_nhap: "Sổ tay sinh viên không cung cấp thông tin cá nhân như họ tên hay số điện thoại riêng của lãnh đạo đơn vị. Bạn vui lòng liên hệ trực tiếp Văn phòng Khoa Toán hoặc nộp hồ sơ, giấy tờ minh chứng về Phòng Khảo thí và Đảm bảo chất lượng theo đúng quy trình để được xem xét bố trí thi bổ sung."
  y_bat_buoc:
    - "nói rõ sổ tay không có thông tin này"
    - "gợi ý liên hệ Văn phòng Khoa hoặc Phòng Khảo thí và Đảm bảo chất lượng"
  nguon: []
  hanh_vi: tu_choi
  ghi_chu: ""
- phieu: V4-233
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, tra giùm em xem điểm đrl kỳ vừa rồi của em với ad, mssv của em là 50.01.601.015, em tìm hoài không ra điểm ạ."
  dap_an_nhap: "Sổ tay sinh viên không lưu trữ dữ liệu cá nhân nên không hỗ trợ tra cứu điểm rèn luyện của từng sinh viên. Bạn vui lòng đăng nhập vào cổng thông tin sinh viên của trường hoặc liên hệ Cố vấn học tập, Ban cán sự lớp để kiểm tra điểm của mình."
  y_bat_buoc:
    - "nói rõ sổ tay không có thông tin này"
    - "gợi ý đăng nhập cổng thông tin sinh viên hoặc liên hệ Cố vấn học tập/Ban cán sự lớp"
  nguon: []
  hanh_vi: tu_choi
  ghi_chu: ""
