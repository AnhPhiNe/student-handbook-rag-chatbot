- phieu: V4-140
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Thầy cô cho em hỏi công thức tính điểm học bổng khuyến khích học tập được tính thế nào ạ? Nếu điểm học tập của em là 3,5 và điểm rèn luyện là 90 thì điểm học bổng ra bao nhiêu? Với lại em muốn được tư vấn nghề nghiệp, việc làm thì liên hệ đơn vị nào ở đâu ạ?"
  dap_an_nhap: "1. Công thức tính điểm học bổng:\nĐiểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100[cite: 1].\n(Trong đó: Điểm rèn luyện / 25 là quy đổi về thang điểm 4)[cite: 1].\nVới số liệu của bạn: Điểm học tập = 3,5 và Điểm rèn luyện = 90 (quy đổi thang 4: 90 / 25 = 3,6), điểm học bổng là:\nĐiểm học bổng = (3,5 × 80 + 3,6 × 20) / 100 = (280 + 72) / 100 = 3,52.\n2. Để được tư vấn nghề nghiệp, việc làm, bạn liên hệ Phòng Công tác chính trị và Học sinh, sinh viên[cite: 1]:\n- Địa chỉ: Nhà A, tầng 1, P.108, P.109, P.110 số 280 An Dương Vương, phường Chợ Quán, TP. HCM[cite: 1].\n- Điện thoại: (028) 38352020[cite: 1].\n- Email: hopthusinhvien@hcmue.edu.vn[cite: 1]."
  y_bat_buoc:
    - "Công thức tính điểm học bổng: (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100"
    - "Điểm rèn luyện / 25 là quy đổi về thang điểm 4"
    - "Kết quả tính với số liệu đã cho: 3,52"
    - "Đơn vị tư vấn nghề nghiệp, việc làm: Phòng Công tác chính trị và Học sinh, sinh viên"
    - "Địa chỉ: Nhà A, tầng 1, P.108, P.109, P.110 số 280 An Dương Vương, phường Chợ Quán, TP. HCM"
    - "Điện thoại: (028) 38352020"
    - "Email: hopthusinhvien@hcmue.edu.vn"
  nguon:
    - "Đ5: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
    - "Đ33: Danh bạ trong Sổ tay sinh viên K51"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-141
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hoi xiu a, nganh Su pham Lich su – Dia ly thuoc khoa nao vay a? voi ca em biet drl tu 90 den 100 la Xuat sac roi, the khung diem tu 80 den duoi 90 diem (vi du em duoc 85 diem drl) thi xep loai gi the a?"
  dap_an_nhap: "1. Ngành Sư phạm Lịch sử – Địa lý thuộc Khoa Địa lí[cite: 1].\n2. Theo Bảng phân loại kết quả rèn luyện, khung điểm từ 80 đến dưới 90 điểm được xếp loại Tốt[cite: 1]. Do đó, nếu bạn đạt 85 điểm rèn luyện thì sẽ được xếp loại Tốt[cite: 1]."
  y_bat_buoc:
    - "Ngành Sư phạm Lịch sử – Địa lý thuộc Khoa Địa lí"
    - "Khung điểm từ 80 đến dưới 90 điểm xếp loại Tốt (85 điểm xếp loại Tốt)"
  nguon:
    - "Đ34: Danh bạ trong Sổ tay sinh viên K48-K49"
    - "Đ35: Quy chế đánh giá kết quả rèn luyện của sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 9"
  hanh_vi: tra_loi
  ghi_chu: ""

