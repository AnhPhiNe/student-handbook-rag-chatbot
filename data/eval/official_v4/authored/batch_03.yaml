- phieu: V4-002
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Học phần chỉ tính đạt/không đạt mà điểm hệ 10 em chỉ được 4.2 thì có được tính là đạt không, có quy đổi sang điểm P và tính vào điểm trung bình học tập không ạ?"
  dap_an_nhap: "Học phần chỉ yêu cầu đạt không phân mức nếu có điểm thang điểm 10 dưới 5,0 (như mức 4.2) thì kết quả là Chưa đạt, không được quy đổi thành P và không tính vào điểm trung bình học tập."
  y_bat_buoc:
    - "Kết quả: Chưa đạt"
    - "Thang điểm 10 dưới 5,0"
    - "Không quy đổi thành P"
