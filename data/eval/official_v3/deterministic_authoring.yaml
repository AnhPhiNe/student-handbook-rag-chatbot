# official_v3: planner hold-out written from handbook content in student phrasing.
# Six families of 17 questions each: single structured, single regulation, and the three
# two-request pairings (structured+regulation, regulation+regulation, structured+structured),
# plus comparisons (across cohorts, or between two values or levels in one cohort).
# Gold comes from catalog selectors (see scripts/build_official_deterministic.py),
# never from system output. Every case names its UI cohort (`selected_cohort`) and its
# `slice` (`family.detail`). Multi-request questions only combine independent requests:
# a request that needs the answer of another ("khoa đó") is a known executor limit,
# not what this bundle measures.
settings:
  id_prefix: official_v3_det
  independent_holdout: true
  overlap_policy: >-
    Held-out: written after official_v1 and official_v2 were frozen, screened against
    both for near-duplicate queries, frozen before the planner prompt and model changes
    of 2026-09 were made, and never used to tune prompts or code.
  expected: {cases: 132, per_cohort: 44}

cases:
  # ================================================================ single.structured
  - query: "Môn Tâm lý học đại cương em được 7,3 thì quy ra điểm chữ là gì ạ?"
    category: scoring
    slice: single.structured
    selected_cohort: K48-K49
    table: [grade_scale, 2, grade_10_to_letter]
    input_slots: {score_or_grade: 7.3}
  - query: "Điểm D+ quy sang thang điểm 4 được mấy điểm?"
    category: scoring
    slice: single.structured
    selected_cohort: K50
    table: [letter_to_grade4, 5, letter_to_grade_4]
