# Questions the handbook's regulations and notices do not answer, for the
# catalog-referral path (official_v4 SPEC, run S).
#
# Purpose: when a part of a question has no evidence, the system may append a
# referral to a unit from the student-service catalog
# (data/processed/directories/student_service_directory.json), picked by the
# existing directory selector over that closed list. This set measures the
# referral itself: whether the unit is right, whether the path stays silent when
# no unit fits, and whether it refers personal-contact, staff-only or
# out-of-domain questions anywhere.
#
# Development data, not a hold-out: DRAFT written 2026-10-19 by the AI assistant
# from the K51 service catalog and a text search of the regulations, before any
# code or run. The owner reviews the gold before it is used; until then
# `review_status: draft`; approved without change on 2026-10-19. No official_v4
# wording was copied.
#
# Fields:
#   kind: referral   a catalog service handles the matter; the handbook text does
#                    not give the specific asked (a date, a price, a step)
#         personal   asks for one person's contact or record: no referral
#         staff      a rule for staff, outside the assistant's scope: no referral
#         ood        outside the handbook's domain: no referral
#         control    the regulations themselves say where to go (added
#                    2026-10-19 for the template rule): the composer must not mark
#                    the question, so neither the template nor a referral fires
#   gold: the catalog service ids that are a right referral (any one counts);
#         [] means no referral is right. The unit is what the wrong-unit metric
#         compares. `cohort` on a case overrides the default below.
#   expected_unit (control only): the unit the regulation names, for reading.
