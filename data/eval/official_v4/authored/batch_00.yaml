- phieu: V4-207
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Chào anh/chị ạ, chuyện là học kỳ này em có đăng ký một môn học mà thầy cô phổ biến đây là học phần đánh giá theo hình thức đạt hoặc không đạt không phân mức chứ không chấm điểm A, B, C. Do là lần đầu học môn dạng này nên em chưa rõ quy định, anh/chị cho em hỏi đối với các môn chỉ yêu cầu đạt không phân mức như thế thì sinh viên cần đạt tối thiểu bao nhiêu điểm theo thang điểm 10 để được tính là đạt và quy đổi ra điểm chữ gì vậy ạ?"
    - vai: tro_ly
      noi_dung: "Đối với các học phần thuộc loại đạt không phân mức, bạn cần đạt từ 5,0 điểm trở lên theo thang điểm 10 để được đánh giá là Đạt và được quy đổi ra điểm chữ là P (không tính vào điểm trung bình học tập)."
    - vai: sinh_vien
      noi_dung: "Dạ em hiểu rồi, nhưng mà lỡ như bài thi của em làm không tốt lắm, giả sử nó chỉ được có 4,5 điểm hệ 10 thôi thì kết quả của nó sẽ bị tính là chưa đạt đúng không ạ? Và khi đó thì nó có được quy đổi thành chữ P hay bị tính vào điểm trung bình học tập của cả kỳ không anh/chị?"
  dap_an_nhap: "Nếu điểm đánh giá của học phần đó chỉ đạt 4,5 điểm (thuộc khoảng dưới 5,0 theo thang điểm 10) thì kết quả được xếp loại là Chưa đạt. Khi đó, điểm của nó không được quy đổi thành điểm chữ P và cũng không tính vào điểm trung bình học tập."
  y_bat_buoc:
    - "Kết quả xếp loại: Chưa đạt (khi dưới 5,0 điểm)"
    - "Điểm chữ: Không quy đổi thành P"
    - "Tính vào điểm trung bình học tập: Không"
  nguon:
    - "Đ21: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10"
  hanh_vi: tra_loi
  ghi_chu: ""

