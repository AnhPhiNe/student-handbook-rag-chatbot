- phieu: V4-007
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em muốn xét chuẩn đầu ra ngoại ngữ tương đương bậc 3 bằng tiếng Trung thì cần nộp chứng chỉ HSK bậc mấy ạ?"
  dap_an_nhap: "Đối với tiếng Trung Quốc, chứng chỉ Hanyu Shuiping Kaoshi (HSK) yêu cầu đạt HSK bậc 3 để được quy đổi tương đương bậc 3."
  y_bat_buoc:
    - "Tiếng Trung Quốc / Hanyu Shuiping Kaoshi (HSK)"
    - "Tương đương bậc 3 là HSK bậc 3"
  nguon:
    - "Đ5: Quy định tổ chức dạy học và công nhận đạt chuẩn đầu ra ngoại ngữ cho sinh viên tốt nghiệp các ngành đào tạo trình độ đại học của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Phụ lục"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-008
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào thầy cô ạ, chuyện là em đang tự học tiếng Hàn để nộp xét chuẩn đầu ra ra trường cho kịp tiến độ tốt nghiệp. Tuần trước em vừa thi xong đợt thi chứng chỉ TOPIK II bên ngoài và đang chờ báo điểm, nhưng nghe mấy anh chị bảo phải đạt số điểm nhất định chứ không phải có chứng chỉ là xong. Thầy cô cho em hỏi cụ thể là chứng chỉ TOPIK II cần đạt bao nhiêu điểm thì mới được công nhận tương đương bậc 4 ạ?"
  dap_an_nhap: "Đối với tiếng Hàn Quốc, chứng chỉ TOPIK II cần đạt cấp độ TOPIK II (150) để được quy đổi tương đương bậc 4."
  y_bat_buoc:
    - "Chứng chỉ TOPIK II"
    - "Tương đương bậc 4 là TOPIK II (150)"
  nguon:
    - "Đ5: Quy định tổ chức dạy học và công nhận đạt chuẩn đầu ra ngoại ngữ cho sinh viên tốt nghiệp các ngành đào tạo trình độ đại học của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Phụ lục"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-009
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu, em tính nộp cđr ngoại ngữ bằng tiếng Nga chứng chỉ ТРКИ á, thì phải đạt cấp độ ТРКИ mấy mới tương đương bậc 3 vậy ạ?"
  dap_an_nhap: "Đối với tiếng Nga, chứng chỉ ТРКИ (Тест по русскому языку как иностранному) cần đạt trình độ ТРКИ-1 để được công nhận tương đương bậc 3."
  y_bat_buoc:
    - "Tiếng Nga / chứng chỉ ТРКИ"
    - "Tương đương bậc 3 là ТРКИ-1"
  nguon:
