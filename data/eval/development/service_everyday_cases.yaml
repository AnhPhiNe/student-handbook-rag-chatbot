# "none" although Phòng Khảo thí và Đảm bảo chất lượng "cấp các loại giấy
# chứng nhận điểm"). Written 2026-09-29 by the AI assistant from the 78 K51
# service texts in data/processed/directories/student_service_directory.json,
# before any run of a changed prompt; not independent review. It uses services
# and wording not already in service_matching_cases.yaml, and avoids every
# service official_v3 asks about (lending a microphone, health insurance
# cards, paying tuition, emergency care, student loans, wifi) and the Trạm Y
# tế catalog. Case e01 is the question that prompted this set, so it is not
# blind.
#
# Groups:
#   everyday  a student's own words for a listed service (should be found)
#   cross     wording that sits near another unit's service; the gold unit is
#             the one whose listed service meets the need
#   absent    a plausible student need that no K51 service lists; the right
#             answer is none (asking back is also safe)
#
# expect: unit   -> the named unit must be the top match
#         one_of -> clarification, or any listed unit as the top match
#         none   -> no unit; clarification is safe
#
# Decision rule, fixed before running: run the current prompt and the
# loosened prompt once each on this file and on the existing development
# sets. Adopt the loosened prompt only if, on this file, "wrong" does not
# increase (in particular no absent case gets a unit), and on the existing
# sets nothing that was correct becomes wrong. Any prompt change made after
# seeing these results turns this file into development data as well.
