# Offline-prepared experiment only; not a production default.
# Requires OPENAI_API_KEY and clearing conflicting STUDENT_RAG_ROUTER_* overrides.
provider: openai
model_name: gpt-6-luna
reasoning_effort: low
response_format: json_object
# Responses omits temperature; JSON syntax is not a semantic/schema guarantee.
max_output_tokens: 8192
hard_max_output_tokens: 8192
output_tokens_per_task: 640
request_timeout_seconds: 20
max_retries: 1
cache_enabled: false
cache_path: data/cache/openai_luna_router_cache.json
key_pool:
  # Conservative local throttle, not a statement of the account's API limits.
  rpm_limit_per_key: 30
  rpd_limit_per_key: null
  tpm_limit_per_key: null
  tpd_limit_per_key: null
  cooldown_seconds: 30
  state_path: data/cache/openai_luna_router_key_state.json
  wait_when_limited: false
