      điểm trung bình học tập (GPA) trong sổ tay K51.
      Bảng nêu ngưỡng điểm thang 10, kết quả Đạt hoặc Chưa đạt và cách quy đổi
      thành điểm chữ P; không dùng thang điểm chữ phân mức của môn tính GPA.
  - key: '["K51","K51_QuyCheDaoTao_Chuong3_Dieu11","K51_QuyCheDaoTao_Chuong3_Dieu11_academic_classification"]'
    content: >-
      Tra xếp loại học lực theo điểm trung bình thang 4 (GPA) trong sổ tay K51,
      gồm Xuất sắc, Giỏi, Khá, Trung bình, Yếu và Kém.
      Bảng áp dụng cho điểm trung bình học kỳ, năm học hoặc tích lũy;
      không phải bảng quy đổi điểm học phần thang 10 hay phân loại rèn luyện.
  - key: '["K51","K51_QuyCheDaoTao_Chuong3_Dieu11","K51_QuyCheDaoTao_Chuong3_Dieu11_letter_to_grade4"]'
    content: >-
      Tra quy đổi điểm chữ học phần A, B+, B, C+, C, D+, D, F+ và F sang
      điểm số thang 4 để tính điểm trung bình học tập (GPA) trong sổ tay K51.
      Bảng không quy đổi trực tiếp từ điểm thang 10, không xếp loại học lực
      và không bao gồm những điểm chữ đặc biệt nằm ngoài các hàng đã liệt kê.
  - key: '["K51","K51_QuyCheDaoTao_Chuong1_Dieu3","K51_QuyCheDaoTao_Chuong1_Dieu3_study_duration_chinh_quy"]'
    content: >-
      Tra thời gian học tập chuẩn toàn khóa và tối đa của hình thức đào tạo
      chính quy theo nội dung sửa đổi trong sổ tay K51,
      áp dụng từ khóa tuyển sinh năm 2025 trở về sau.
      Bảng có quy tắc xác định thời gian tối đa đối với sinh viên liên thông
      đã được miễn trừ tín chỉ, nhưng không cung cấp phép tính tự động từ
      số tín chỉ miễn trừ.
