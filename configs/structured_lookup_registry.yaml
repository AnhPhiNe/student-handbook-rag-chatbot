version: 10

# span_aliases (per slot): the phrases in a question that count as evidence
# for a slot value. The planner's span must contain the value or one of its
# aliases, and when the planner gives a value without a span, a matching
# phrase in the question becomes its span. Matching ignores case, diacritics
# and punctuation, so write each phrase once, with diacritics. The first alias
# of an opaque code (e.g. secondary_bridge) is its meaning in the planner
# prompt. A slot with no span_aliases gets no span recovery, which is why some
# lists hold only the value itself (IELTS: [IELTS]).
tools:
  foreign_language:
    data_category: regulation_table
    presentation_type: table
    selection_mode: table_first
    # regulation tables (structured_tables_registry table_type) this tool reads
    table_types: [foreign_language]
    description: "Tra bảng quy đổi chứng chỉ/điểm ngoại ngữ sang bậc tương đương, gồm kỹ năng, kể cả khi chưa biết điểm/bậc; không tự xác lập chuẩn đầu ra bắt buộc. Hỏi chuẩn tốt nghiệp theo chứng chỉ cần bảng này cùng quy định qua RAG."
    intents: [direct_value, list_items]
    default_intent: direct_value
    required_slots:
      direct_value: []
      list_items: []
    slot_schema:
      certificate_or_language:
        type: string
        verification_role: directory_entity
        examples: [IELTS, TOEFL, JLPT, HSK, TOPIK]
        span_aliases:
          IELTS: [IELTS]
          TOEFL: [TOEFL, TOEFL iBT, TOEFL ITP]
          TOEIC: [TOEIC, TOEIC 4 kỹ năng]
          Cambridge: [Cambridge, Linguaskill]
          JLPT: [JLPT, Japanese Language Proficiency Test]
          HSK: [HSK, Hanyu Shuiping Kaoshi]
          TOPIK: [TOPIK, TOPIK II]
          TCF_DELF: [TCF, DELF, TCF DELF]
      score_or_level:
        type: [string, number]
        verification_role: result_input
        examples: [5.5, N3, HSK4, TOPIK3]
        span_aliases:
          N1: [N1]
          N2: [N2]
          N3: [N3]
          N4: [N4]
          N5: [N5]
      listening_score:
        type: [string, number]
        verification_role: result_input
      reading_score:
        type: [string, number]
        verification_role: result_input
      speaking_score:
        type: [string, number]
        verification_role: result_input
      writing_score:
        type: [string, number]
        verification_role: result_input
    strategy: foreign_language_lookup
    response_intent: foreign_language_lookup_query
    target_chunk_types: [structured_lookup]

  study_duration:
    data_category: regulation_table
    presentation_type: table
    selection_mode: table_first
    # regulation tables (structured_tables_registry table_type) this tool reads
    table_types: [study_duration]
    description: Tra thời gian học chuẩn/tối đa theo hệ đào tạo và loại chương trình trong sổ tay của khóa; chưa rõ phạm vi thì giữ các trường hợp. Không tính thời gian còn lại từ tín chỉ miễn; điều kiện gia hạn/bảo lưu dùng RAG.
    intents: [direct_value, list_items]
    default_intent: direct_value
    required_slots:
      direct_value: []
      list_items: []
    slot_schema:
      training_mode:
        type: string
        verification_role: result_input
        enum: [chinh_quy, vua_lam_vua_hoc]
        span_aliases:
          chinh_quy: [chính quy]
          vua_lam_vua_hoc: [vừa làm vừa học, VLVH]
      program_type:
        type: string
        verification_role: result_input
        canonical_values: [first_degree, college_bridge, secondary_bridge, second_degree]
        span_aliases:
          first_degree: [cấp bằng thứ nhất, bằng thứ nhất, cử nhân, first degree]
          college_bridge: [liên thông từ cao đẳng, cao đẳng, college bridge]
          secondary_bridge: [liên thông từ trung cấp, trung cấp, secondary bridge]
          second_degree: [bằng đại học thứ hai, văn bằng hai, second degree]
    table_selector:
      slot: training_mode
      values:
        chinh_quy:
          table_id_suffixes: [study_duration_chinh_quy]
        vua_lam_vua_hoc:
          table_id_suffixes: [study_duration_vua_lam_vua_hoc]
    strategy: study_duration_lookup
    response_intent: study_duration_lookup_query
    target_chunk_types: [structured_lookup]

  scholarship_classification:
    data_category: regulation_table
    presentation_type: table
    selection_mode: table_first
    # regulation tables (structured_tables_registry table_type) this tool reads
    table_types: [scholarship]
    description: Tra mức tiền, công thức tiền, hệ số, căn cứ học phí hoặc xếp loại HBKKHT của từng loại kèm khoảng điểm học bổng, điểm học tập và rèn luyện, hoặc xếp loại học tập và rèn luyện tương ứng. Mức tiền phụ thuộc tín chỉ/học phí, không phải số tiền cố định. Tổng quan không điền aspect để lấy cả bảng điều kiện xét và thang điểm tham chiếu; quyền hưởng, ngoại lệ và kết luận được cấp học bổng cần quy định RAG.
    intents: [direct_value, list_items]
    default_intent: direct_value
    required_slots:
      direct_value: []
      list_items: []
    slot_schema:
      aspect:
        type: string
        verification_role: reading_intent
        enum: [amount, classification]
        description: "Bảng được hỏi: amount=mức tiền, công thức tiền, hệ số, căn cứ học phí; classification=khoảng điểm học bổng, điểm học tập và rèn luyện, hoặc xếp loại tương ứng của từng loại; hỏi điểm học bổng phải đạt bao nhiêu là classification, không phải công thức. Chọn theo kết quả cần tra, không theo riêng tên loại học bổng. Không cung cấp khi hỏi tổng quan."
        span_aliases:
          amount: [mức tiền, mức học bổng, hệ số]
          classification: [xếp loại, loại học bổng, điểm học bổng, khoảng điểm]
      score_or_label:
        type: [string, number]
        verification_role: result_input
        description: Điểm học bổng hoặc tên loại học bổng được hỏi (vd. Khá, Giỏi), dùng cho cả amount và classification; không coi riêng điểm học tập/rèn luyện là điểm học bổng. Điền khi người hỏi nêu.
    table_selector:
      slot: aspect
      values:
        amount:
          table_types: [scholarship]
          table_subtypes: [scholarship_amount]
        classification:
          table_types: [scholarship]
          table_subtypes: [scholarship_classification]
    strategy: scholarship_classification_lookup
    response_intent: scholarship_classification_lookup_query
    target_chunk_types: [structured_lookup]

  scoring:
    data_category: regulation_table
    presentation_type: table
    selection_mode: table_first
    # regulation tables (structured_tables_registry table_type) this tool reads
    table_types: [scoring, conduct]
    description: Tra bảng quy đổi điểm học phần, xếp loại học lực hoặc phân loại tổng điểm rèn luyện; quy tắc chấm từng tiêu chí thành phần và chính sách học bổng dùng RAG.
    intents: [direct_value, list_items]
    default_intent: direct_value
    required_slots:
      direct_value: []
      list_items: []
    slot_schema:
      operation:
        type: string
        verification_role: reading_intent
        enum: [grade_10_to_letter, pass_fail_ungraded, letter_to_grade_4, academic_classification, conduct_classification, pass_threshold]
        description: "grade_10_to_letter trả điểm chữ kèm Đạt/Không đạt của môn tính GPA, hỏi cả hai vẫn một task; pass_threshold chỉ hỏi qua môn hoặc điểm tối thiểu; pass_fail_ungraded chỉ cho môn chấm đạt/không đạt, không tính GPA."
        span_aliases:
          grade_10_to_letter: [quy đổi điểm chữ, đổi sang điểm chữ, điểm chữ gì]
          pass_fail_ungraded: [học phần đạt không phân mức, học phần chỉ yêu cầu đạt, không tính vào điểm trung bình]
          letter_to_grade_4: [quy đổi sang thang 4, đổi sang thang 4, điểm hệ 4]
          academic_classification: [xếp loại học lực, loại học lực]
          conduct_classification: [xếp loại rèn luyện, loại rèn luyện]
          pass_threshold: [qua môn, qua học phần, học phần đạt, học phần chưa đạt, đạt hay không đạt, có đạt không, rớt môn, trượt môn, điểm tối thiểu]
      score_or_grade:
        type: [string, number]
        verification_role: result_input
        description: "Giá trị đầu vào theo operation: điểm học phần hệ 10, điểm chữ, GPA hệ 4 hoặc tổng điểm rèn luyện hệ 100. Giữ cả thang điểm người dùng nêu, không tự quy đổi."
      course_scope:
        type: string
        verification_role: result_input
        enum: [foundation, remaining, graded, pass_fail_ungraded]
        description: graded=môn tính GPA, chưa xác định foundation/remaining; không tự suy phạm vi còn thiếu. pass_fail_ungraded=môn không tính GPA.
        span_aliases:
          foundation: [học phần nền tảng, học phần chung, học phần giáo dục đại cương]
          remaining: [học phần còn lại, các học phần còn lại, môn còn lại, các môn còn lại]
          graded: [môn tính GPA, học phần tính GPA, tính vào điểm trung bình học tập]
          pass_fail_ungraded: [học phần đạt không phân mức, học phần chỉ yêu cầu đạt, không tính vào điểm trung bình]
    table_selector:
      slot: operation
      values:
        grade_10_to_letter:
          table_types: [scoring]
          table_subtypes: [grade_scale]
        pass_fail_ungraded:
          table_types: [scoring]
          table_subtypes: [pass_fail_ungraded]
        pass_threshold:
          table_types: [scoring]
          table_subtypes: [grade_scale, pass_fail_ungraded]
        letter_to_grade_4:
          table_types: [scoring]
          table_subtypes: [letter_to_grade4]
        academic_classification:
          table_types: [scoring]
          table_subtypes: [academic_classification]
        conduct_classification:
          table_types: [conduct]
          table_subtypes: [conduct_classification]
    scope_selector:
      slot: course_scope
      # Scope changes course-grade/pass tables, not letter-to-4 or GPA/conduct tables.
      applies_to_operations: [grade_10_to_letter, pass_threshold, pass_fail_ungraded]
      values:
        foundation:
          table_id_suffixes: [grade_scale_foundation, grade_scale_general]
        remaining:
          table_id_suffixes: [grade_scale_remaining, grade_scale_general]
        graded:
          table_subtypes: [grade_scale]
        pass_fail_ungraded:
          table_id_suffixes: [pass_fail_ungraded]
    strategy: structured_lookup
    response_intent: score_lookup_query
    target_chunk_types: [structured_lookup]

  student_service:
    data_category: directory_table
    presentation_type: contact_card
    description: Tra đơn vị thực hiện một việc trong danh bạ dịch vụ và liên hệ của đơn vị đó, không cần biết tên đơn vị. Yêu cầu xem xét lại một kết quả hay quyết định đã có (khiếu nại, phúc khảo), các bước, điều kiện, thời hạn hoặc người giải quyết theo quy chế dùng RAG.
    intents: [direct_value, contact]
    default_intent: contact
    required_slots:
      direct_value: [requested_field]
      contact: [requested_field]
    slot_schema:
      service:
        type: string
        verification_role: directory_entity
        description: Dịch vụ cần hỗ trợ, không phải tên đơn vị.
        clarification_label: việc bạn cần hỗ trợ
      requested_field:
        type: string
        verification_role: reading_intent
        enum: [unit, phone, email, office, website, all]
        description: >-
          unit=tên đơn vị phụ trách; phone=điện thoại kèm số máy nội bộ;
          office=địa chỉ hoặc vị trí làm việc;
          all=thông tin liên hệ tổng hợp. Hỏi ai/đơn vị nào phụ trách hoặc hỗ trợ
          một việc → unit; hỏi làm một việc 'ở phòng nào', 'đơn vị nào' hay 'gặp
          ai' khi chưa biết tên đơn vị cũng là unit. Hỏi nơi làm việc, tòa nhà/tầng/số phòng, hoặc một đơn
          vị đã nêu tên 'ở đâu' → office, không cần nêu số phòng. Hỏi cả đơn vị
          và vị trí → [unit, office] hoặc all. Phân biệt theo mục đích câu hỏi,
          không chỉ theo từ 'phòng'.
          Chọn theo loại đáp án cần trả: tên đơn vị hay vị trí vật lý;
          nếu mục đích vẫn mơ hồ sau history hợp lệ thì clarify, không dùng all để né chọn field.
        clarification_label: loại thông tin bạn cần
        span_aliases:
          unit: [đơn vị, bộ phận]
          phone: [số điện thoại, điện thoại, sđt, phone]
          email: [email, thư điện tử]
          office: [địa chỉ, phòng làm việc]
          website: [website, trang web]
          all: [thông tin liên hệ]
    strategy: student_service_lookup
    response_intent: office_query
    target_chunk_types: [office_directory]

  office:
    data_category: directory_table
    presentation_type: contact_card
    description: "Tra liên hệ, địa chỉ hoặc dịch vụ của đơn vị đã nêu tên trong danh bạ phòng ban/đơn vị dịch vụ. Đơn vị học thuật trong danh bạ khoa dùng faculty; chỉ biết việc cần hỗ trợ dùng student_service. Trách nhiệm pháp quy, các bước thủ tục hoặc biểu mẫu dùng RAG."
    intents: [contact]
    default_intent: contact
    required_slots:
      contact: [office, requested_field]
    slot_schema:
      office:
        type: string
        verification_role: directory_entity
        description: Tên đơn vị/phòng ban đầu vào, không phải địa chỉ, tầng hoặc số phòng.
        clarification_label: tên đơn vị hoặc phòng ban
        planner_reading_trusted: true
      requested_field:
        type: string
        verification_role: reading_intent
        enum: [phone, email, office, website, services, all]
        description: Trường đầu ra; phone=điện thoại kèm số máy nội bộ, office=địa chỉ/vị trí, services=danh sách dịch vụ của đơn vị, all=thông tin liên hệ tổng hợp.
        default_reading: all
        span_aliases:
          phone: [số điện thoại, điện thoại, sđt, phone]
          email: [email, thư điện tử]
          office: [địa chỉ, phòng làm việc]
          website: [website, trang web]
          services: [dịch vụ, hỗ trợ gì]
          all: [thông tin liên hệ, liên hệ]
    strategy: office_lookup
    response_intent: office_query
    target_chunk_types: [office_directory]

  faculty:
    data_category: directory_table
    presentation_type: contact_card
    description: Tra email, số điện thoại kèm số nội bộ, website hoặc địa chỉ của đơn vị học thuật có hồ sơ trong danh bạ khoa, gồm Khoa/Tổ; không dùng cho danh sách ngành hoặc trách nhiệm pháp quy.
    intents: [contact]
    default_intent: contact
    required_slots:
      contact: [faculty, requested_field]
    slot_schema:
      faculty:
        type: string
        verification_role: directory_entity
        description: Tên khoa đã nêu; nếu chỉ biết ngành và hỏi liên hệ khoa phụ trách thì dùng program.
        clarification_label: tên khoa
        planner_reading_trusted: true
      requested_field:
        type: string
        verification_role: reading_intent
        enum: [phone, email, office, website, all]
        description: Trường liên hệ của khoa; phone=điện thoại kèm số máy nội bộ, office=địa chỉ/vị trí, all=thông tin liên hệ tổng hợp.
        default_reading: all
        span_aliases:
          phone: [số điện thoại, điện thoại, sđt, phone]
          email: [email, thư điện tử]
          office: [địa chỉ, văn phòng]
          website: [website, trang web]
          all: [thông tin liên hệ, liên hệ]
    strategy: faculty_lookup
    response_intent: faculty_query
    target_chunk_types: [faculty_program_directory]

  program:
    data_category: directory_table
    presentation_type: table
    description: Tra danh sách/sự có mặt của ngành, khoa phụ trách, liên hệ khoa và cơ hội nghề nghiệp ghi trong sổ tay của khóa; ngành kèm email khoa là một task. Không xác nhận tuyển sinh hiện tại, điểm chuẩn hoặc thị trường việc làm ngoài sổ tay.
    intents: [direct_value, list_items, exists]
    required_slots:
      direct_value: [program_or_faculty, requested_field]
      list_items: [scope]
      exists: [program_or_faculty]
    slot_schema:
      program_or_faculty:
        type: string
        verification_role: directory_entity
        description: Tên ngành cần tìm khoa/liên hệ, hoặc tên khoa cần liệt kê ngành; không tự đoán khoa từ ngành.
        clarification_label: tên ngành hoặc khoa
        planner_reading_trusted: true
      requested_field:
        type: string
        verification_role: reading_intent
        enum: [faculty, programs, exists, career, email, phone, website, office, all]
        description: faculty=khoa phụ trách ngành; programs=danh sách ngành; career=cơ hội nghề nghiệp, ra trường làm gì; exists=kiểm tra tồn tại; email/phone/website/office/all=liên hệ khoa phụ trách ngành qua relationship, office là địa chỉ. Không tạo task phụ thuộc để tra khoa chưa biết tên.
        default_reading: faculty
      scope:
        type: string
        verification_role: reading_intent
        enum: [school, faculty]
        description: "Phạm vi danh sách ngành: school=toàn trường; faculty=theo khoa đã nêu, không phải field khoa phụ trách ngành."
        default_reading: school
        grounding_intents: [list_items]
        span_aliases:
          school: [các ngành của trường, những ngành của trường, toàn trường, trường có những ngành]
          faculty: [khoa]
    strategy: program_lookup
    response_intent: faculty_query
    target_chunk_types: [program_directory]

  formula:
    presentation_type: table
    description: "Tra công thức và định nghĩa biến/thang điểm/làm tròn có trong nguồn: điểm học bổng từ điểm học tập và rèn luyện=scholarship_score; GPA có trọng số=gpa_weighted_average. Mức tiền, xếp loại hoặc khoảng điểm học bổng dùng scholarship_classification; điều kiện áp dụng, quyền hưởng và ngoại lệ dùng RAG. Không phải calculator số học tổng quát."
    intents: [formula]
    required_slots:
      formula: [formula_type]
    slot_schema:
      formula_type:
        type: string
        verification_role: reading_intent
        enum: [scholarship_score, gpa_weighted_average]
        clarification_label: công thức bạn muốn tra
    strategy: formula_lookup
    response_intent: formula_query
    target_chunk_types: [structured_lookup]

rag_intents:
  policy: [regulation]
  procedure: [regulation]
  consequence_or_exception: [regulation]
  open_question: [regulation, office_directory, program_directory]
  mixed: [regulation, office_directory]

# Only reviewed catalog keys participate. No regulation table has a business join.
relationships:
  program:
    target: faculty
    source_key: faculty_name
    target_keys: [unit_name, faculty_name, aliases]
    cardinality: one
    requested_fields: [email, phone, website, office, all]
  student_service:
    target: office
    source_key: unit_name
    target_keys: [unit_name, aliases]
    cardinality: one
    requested_fields: [phone, email, website, office, all]
  office:
    target: student_service
    source_key: service_ids
    target_keys: [service_id]
    cardinality: many
    requested_fields: [services, all]
