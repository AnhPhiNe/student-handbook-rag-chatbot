    input_slots: {score_or_grade: 5.1}
  - query: "GPA học kỳ 3,3 thì xếp loại học lực gì?"
    category: scoring
    slice: single.structured
    selected_cohort: K48-K49
    table: [academic_classification, 1, academic_classification]
    input_slots: {score_or_grade: 3.3}
  - query: "ren luyen ky nay dc 57d, vay la loai trung binh hay kha"
    category: conduct
    slice: single.structured
    selected_cohort: K50
    stress: true
    stress_type: informal_spelling
    table: [conduct_classification, 3, conduct_classification]
    input_slots: {score_or_grade: 57}
  - query: "IELTS bao nhiêu thì được tính tương đương bậc 4?"
    category: foreign_language
    slice: single.structured
    selected_cohort: K51
    foreign: [IELTS, equivalent_level_4]
  - query: "Em thi Linguaskill thì cần bao nhiêu điểm để đạt chuẩn bậc 3?"
    category: foreign_language
