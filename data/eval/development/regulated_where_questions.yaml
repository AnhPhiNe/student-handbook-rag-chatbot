  - {id: q13, cohort: K51, route: includes_rag, query: "Cần xác nhận điểm rèn luyện để làm hồ sơ thì liên hệ phòng nào?", gold_parent: K51_QuyCheDanhGiaRenLuyen_Chuong5_Dieu16, must_include: [["CTCT", "Công tác chính trị"]]}
