- phieu: V4-011
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô, đợt hè vừa rồi em có dành thời gian ôn thi chứng chỉ tiếng Anh TOEFL ITP tại trung tâm bên ngoài và mới nhận bảng điểm hôm qua. Kết quả bài thi của em đạt 470 điểm. Em đang lo không biết mức điểm này đã đủ điều kiện để công nhận chuẩn đầu ra ngoại ngữ tương đương bậc 3 của trường mình chưa, hay phải thi lại để lấy điểm cao hơn ạ? Thầy cô giải đáp giúp em với."
  dap_an_nhap: "Theo bảng tham chiếu quy đổi chứng chỉ ngoại ngữ, chứng chỉ TOEFL ITP đạt mức điểm từ 450 – 499 được công nhận tương đương bậc 3. Do đó, kết quả 470 điểm của bạn đủ điều kiện để được công nhận tương đương bậc 3."
  y_bat_buoc:
    - "Chứng chỉ TOEFL ITP"
    - "Khoảng điểm tương đương bậc 3: 450 – 499"
    - "Mức điểm 470 đạt tương đương bậc 3"
  nguon:
    - "Đ5: Quy định tổ chức dạy học và công nhận đạt chuẩn đầu ra ngoại ngữ cho sinh viên tốt nghiệp các ngành đào tạo trình độ đại học của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Phụ lục"
  hanh_vi: tra_loi
