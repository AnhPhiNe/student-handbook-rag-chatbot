- phieu: V4-142
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ cho em hỏi, em muốn được tư vấn và hỗ trợ về phương pháp nghiên cứu khoa học giáo dục thì liên hệ đơn vị nào và ở đâu ạ? Tiện cho em xin luôn số điện thoại của Tổ Khoa học cơ bản với ạ."
  dap_an_nhap: "- Để được hỗ trợ về phương pháp NCKH Giáo dục, bạn liên hệ Viện Nghiên cứu Giáo dục tại địa chỉ: 115 Hai Bà Trưng, phường Sài Gòn, TP. HCM; điện thoại: (028) 38224813; email: vienncgd@hcmue.edu.vn.\n- Về số điện thoại của Tổ Khoa học cơ bản: Sổ tay sinh viên không cung cấp số điện thoại của đơn vị này, chỉ có email (longan.khcb@hcmue.edu.vn) và văn phòng làm việc tại Khu Hiệu bộ, Số 934, Quốc lộ 1A, phường Khánh Hậu, tỉnh Tây Ninh."
  y_bat_buoc:
    - "Viện Nghiên cứu Giáo dục"
    - "115 Hai Bà Trưng, phường Sài Gòn, TP. HCM"
    - "(028) 38224813"
    - "vienncgd@hcmue.edu.vn"
    - "từ chối hoặc nêu rõ sổ tay không có số điện thoại của Tổ Khoa học cơ bản"
  nguon:
    - "Đ1: Danh bạ trong Sổ tay sinh viên K51"
    - "Đ2: Danh bạ trong Sổ tay sinh viên K51"
  hanh_vi: tra_loi_va_tu_choi
  ghi_chu: ""

- phieu: V4-145
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu ạ, em muốn tìm kênh thông tin để phản ánh và được giải quyết mấy nhu cầu hỗ trợ sv thì liên hệ ai và sđt bao nhiêu ạ? Với lại theo quy định thì Sổ tay sinh viên do phòng nào chủ trì xây dựng vậy ạ? Sẵn cho em hỏi luôn là thủ tục đăng ký đề tài nckh ban đầu cần hồ sơ gì, nộp cho ai và vào tháng mấy ạ?"
  dap_an_nhap: "- Để được giải quyết các nhu cầu hỗ trợ sinh viên qua các kênh thông tin, bạn liên hệ Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp qua SĐT: (028) 3835 2020 (hoặc email: csaed@hcmue.edu.vn).\n- Về xây dựng Sổ tay sinh viên: Phòng CTCT và HSSV phối hợp với các đơn vị liên quan xây dựng sổ tay sinh viên trình Hiệu trưởng phê duyệt ban hành.\n- Về thủ tục đăng ký đề tài NCKH: Vào tháng 9 – 10 hằng năm, sinh viên và giảng viên hướng dẫn đăng ký đề tài kèm theo thuyết minh đề tài nghiên cứu (theo mẫu 2 - SV NCKH) nộp về Khoa; mỗi đề tài chỉ do một người hướng dẫn và tối đa không quá 05 SV tham gia thực hiện, trong đó phải xác định một SV chịu trách nhiệm chính."
  y_bat_buoc:
    - "Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp"
    - "(028) 3835 2020"
    - "Phòng CTCT và HSSV"
    - "trình Hiệu trưởng phê duyệt ban hành (hoặc Hiệu trưởng phê duyệt)"
    - "Tháng 9 – 10 hằng năm (hoặc Tháng 9 – 10)"
    - "mẫu 2 - SV NCKH (hoặc thuyết minh đề tài nghiên cứu)"
    - "Khoa (hoặc nộp về Khoa)"
  nguon:
    - "Đ3: Danh bạ trong Sổ tay sinh viên K48-K49"
    - "Đ4: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
    - "Đ5: Quy định về việc tổ chức hoạt động nghiên cứu khoa học của sinh viên, Điều 7"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-146
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho e hoi he chinh quy tg hoc chuan la 04 nam thi tg hoc tap toi da la may nam a, con chinh sach ho tro chi phi hoc tap 2025 - 2026 thi ap dung cho doi tuong sv nao the a, voi he vua lam vua hoc neu thoi gian chuan la 05 nam thi toi da duoc hoc may nam"
  dap_an_nhap: "- Đối với hình thức đào tạo chính quy có thời gian học tập chuẩn 04 năm học, thời gian học tập tối đa là 06 năm học.\n- Đối tượng được hưởng chính sách hỗ trợ chi phí học tập năm học 2025 – 2026 là sinh viên hệ chính quy là người dân tộc thiểu số và thiểu số rất ít người thuộc hộ nghèo, hộ cận nghèo.\n- Đối với hình thức đào tạo vừa làm vừa học có thời gian học tập chuẩn 05 năm học, thời gian học tập tối đa là 7,5 năm học."
  y_bat_buoc:
    - "06 năm học (hoặc 6 năm)"
    - "sinh viên hệ chính quy"
    - "người dân tộc thiểu số và thiểu số rất ít người (hoặc dân tộc thiểu số và thiểu số rất ít người)"
    - "thuộc hộ nghèo, hộ cận nghèo (hoặc hộ nghèo, hộ cận nghèo)"
    - "7,5 năm học"
  nguon:
    - "Đ6: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3"
    - "Đ7: Thông báo về việc thực hiện chính sách hỗ trợ chi phí học tập đối với sinh viên hệ chính quy là người dân tộc thiểu số và thiểu số rất ít người thuộc hộ nghèo, hộ cận nghèo, năm học 2025 – 2026"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-147
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô ạ, em là sinh viên năm nhất mới vào trường, đợt này em thấy trường mình tổ chức nhiều hoạt động sự kiện hay quá nên em rất muốn đăng ký tham gia làm cộng tác viên hỗ trợ tổ chức các sự kiện trong trường để tích lũy thêm kỹ năng mềm và mở rộng quan hệ bạn bè. Thầy cô cho em hỏi muốn tham gia nhóm cộng tác viên sự kiện như vậy thì liên hệ đơn vị nào và văn phòng ở đâu ạ? Nhân tiện bạn cùng phòng em là người dân tộc thiểu số có hoàn cảnh khó khăn, em muốn hỏi trường có thông báo quy định về chính sách hỗ trợ chi phí học tập đối với sinh viên hệ chính quy là người dân tộc thiểu số, thiểu số rất ít người thuộc hộ nghèo, cận nghèo năm học 2025 - 2026 như thế nào ạ? Cuối cùng là về điểm số, kỳ này em học 3 môn gồm 1 môn 3 tín chỉ được điểm A (4,0), 1 môn 2 tín chỉ được điểm B+ (3,5) và 1 môn 3 tín chỉ được điểm B (3,0), thầy cô chỉ em công thức tính điểm trung bình chung học kỳ và tính giúp xem điểm của em ra bao nhiêu với ạ."
  dap_an_nhap: "- Để tham gia nhóm cộng tác viên sinh viên hỗ trợ tổ chức các sự kiện trong trường, bạn liên hệ Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp tại địa chỉ: Nhà A, tầng 1, P.101, số 280 An Dương Vương, phường Chợ Quán, TP. HCM (Điện thoại: (028) 38352020; Email: csaed@hcmue.edu.vn).\n- Về chính sách hỗ trợ chi phí học tập năm học 2025 – 2026: Trường đã thông báo đối tượng và thủ tục đăng ký hưởng chính sách hỗ trợ chi phí học tập đối với sinh viên hệ chính quy là người dân tộc thiểu số và thiểu số rất ít người thuộc hộ nghèo, hộ cận nghèo căn cứ theo Quyết định số 66/2013/QĐ-TTg, Thông tư liên tịch số 35/2014/TTLT-BGDĐT-BTC và Nghị định số 57/2017/NĐ-CP.\n- Theo Điều 11, công thức tính điểm trung bình chung học kỳ là: A = Σ(ai × ni) / Σ(ni) và làm tròn đến 2 chữ số thập phân (trong đó ai là điểm của học phần thứ i, ni là số tín chỉ của học phần thứ i). Áp dụng với điểm của bạn: A = (4,0 × 3 + 3,5 × 2 + 3,0 × 3) / (3 + 2 + 3) = (12,0 + 7,0 + 9,0) / 8 = 28 / 8 = 3,50."
  y_bat_buoc:
    - "Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp"
    - "Nhà A, tầng 1, P.101, số 280 An Dương Vương, phường Chợ Quán, TP. HCM"
    - "(028) 38352020"
    - "sinh viên hệ chính quy là người dân tộc thiểu số và thiểu số rất ít người thuộc hộ nghèo, hộ cận nghèo"
    - "A = Σ(ai × ni) / Σ(ni)"
    - "3,50 (hoặc 3.5)"
  nguon:
    - "Đ8: Danh bạ trong Sổ tay sinh viên K51"
    - "Đ7: Thông báo về việc thực hiện chính sách hỗ trợ chi phí học tập đối với sinh viên hệ chính quy là người dân tộc thiểu số và thiểu số rất ít người thuộc hộ nghèo, hộ cận nghèo, năm học 2025 – 2026"
    - "Đ9: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-148
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "nganh giao duc tieu hoc thuoc khoa nao quan ly vay ad, voi sv khuyet tat thuoc ho ngheo can lam ho so gi nop o dau va han nop bao lau de huong tro cap hoc bong do dung hoc tap a, con hbkkht loai gioi thi diem hoc tap 3.20 den 3.59 voi ren luyen tu 80 tro len thi diem hoc bong can dat trong khoang nao"
  dap_an_nhap: "- Ngành Giáo dục Tiểu học thuộc Khoa Giáo dục Tiểu học.\n- Về thủ tục hưởng chế độ chính sách học bổng và hỗ trợ phương tiện, đồ dùng học tập đối với sinh viên khuyết tật thuộc hộ nghèo, hộ cận nghèo:\n  + Hồ sơ gồm: Đơn đề nghị (theo mẫu); Bản sao (có chứng thực) giấy kết luận của hội đồng xét duyệt trợ cấp xã hội cấp xã (phường, thị trấn) chứng nhận sinh viên thuộc diện hưởng trợ cấp xã hội hằng tháng đối với người khuyết tật; Bản sao (có chứng thực) giấy chứng nhận người khuyết tật do cơ quan có thẩm quyền cấp; Bản sao (có chứng thực) giấy chứng nhận là hộ nghèo hoặc hộ cận nghèo do UBND xã (phường, thị trấn) cấp.\n  + Địa điểm nhận hồ sơ: Phòng CTCT và HSSV, Phòng A 110, cơ sở 280 An Dương Vương, Phường 4, Quận 5.\n  + Thời hạn nộp: trong vòng 30 ngày tính từ đầu học kỳ của năm học (Học kỳ I: từ đầu tháng 9 đến đầu tháng 10; Học kỳ II: từ trung tuần tháng 2 đến trung tuần tháng 3; riêng sinh viên năm nhất tính từ ngày làm thủ tục nhập học chính thức).\n- Về học bổng khuyến khích học tập loại Giỏi: khi điểm học tập từ 3.20 – 3.59 và điểm rèn luyện >= 80, khoảng điểm học bổng cần đạt là từ 3.20 đến 3.672."
  y_bat_buoc:
    - "Khoa Giáo dục Tiểu học"
    - "Đơn đề nghị (theo mẫu)"
    - "giấy kết luận của hội đồng xét duyệt trợ cấp xã hội cấp xã (phường, thị trấn)"
    - "giấy chứng nhận người khuyết tật"
    - "giấy chứng nhận là hộ nghèo hoặc hộ cận nghèo (hoặc giấy chứng nhận hộ nghèo, hộ cận nghèo)"
    - "Phòng CTCT và HSSV, Phòng A 110, cơ sở 280 An Dương Vương, Phường 4, Quận 5"
    - "trong vòng 30 ngày tính từ đầu học kỳ (hoặc đầu tháng 9 đến đầu tháng 10 / trung tuần tháng 2 đến trung tuần tháng 3)"
    - "3.20 đến 3.672"
  nguon:
    - "Đ10: Danh bạ trong Sổ tay sinh viên K48-K49"
    - "Đ11: Thông báo về việc thực hiện chế độ chính sách về học bổng và hỗ trợ phương tiện, đồ dùng học tập đối với sinh viên khuyết tật thuộc hộ nghèo, hộ cận nghèo học hệ chính quy"
    - "Đ12: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 28"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-149
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào phòng công tác sinh viên ạ. Em là sinh viên K50, kỳ vừa rồi em phấn đấu nhiều nên điểm học tập và điểm rèn luyện của em đều đạt loại Khá. Tuy nhiên đầu kỳ em có sơ suất nhỏ bị nhắc nhở, nên em hơi lo không biết theo tiêu chuẩn xét học bổng khuyến khích học tập thì sinh viên phải đáp ứng điều kiện về kỷ luật như thế nào, bị kỷ luật từ mức nào thì không được xét học bổng ạ? Thêm nữa là em đang có một bài báo khoa học chuẩn bị đăng trên tạp chí uy tín của ngành, em muốn hỏi theo khung đánh giá điểm rèn luyện phần ý thức tham gia học tập thì việc tham gia hoạt động NCKH có bài báo đăng tạp chí uy tín như vậy được cộng bao nhiêu điểm ạ? Với lại đứa bạn thân của em đang muốn tìm hiểu về ngành Sư phạm tiếng Nga, thầy cô cho em hỏi ngành Sư phạm tiếng Nga thuộc quản lý của khoa nào trong trường mình ạ?"
  dap_an_nhap: "- Về điều kiện kỷ luật để xét HBKKHT: Theo Điều 27, sinh viên phải không bị kỷ luật từ mức khiển trách trở lên trong học kỳ xét học bổng (cùng với điều kiện kết quả học tập và rèn luyện từ loại Khá trở lên).\n- Theo khung điểm đánh giá kết quả rèn luyện (Phần I. Đánh giá về ý thức tham gia học tập), sinh viên tham gia hoạt động NCKH có bài báo khoa học, tham luận được đăng tải trên các tạp chí, tập san uy tín được công nhận được tính 5 điểm/nghiên cứu.\n- Ngành Sư phạm tiếng Nga thuộc Khoa Tiếng Nga."
  y_bat_buoc:
    - "không bị kỷ luật từ mức khiển trách trở lên"
    - "5 điểm/nghiên cứu (hoặc 5 điểm)"
    - "Khoa Tiếng Nga"
  nguon:
    - "Đ13: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
    - "Đ14: Khung điểm đánh giá kết quả rèn luyện sinh viên (Phụ lục 1, Quyết định số 2000/QĐ-ĐHSP ngày 15/7/2024), Phần I"
    - "Đ15: Danh bạ trong Sổ tay sinh viên K50"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-150
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ cho em hỏi, để đạt học bổng loại Giỏi thì khi điểm học tập từ 3,20 đến 3,59 và điểm rèn luyện từ 80 trở lên thì điểm học bổng phải đạt từ bao nhiêu đến bao nhiêu ạ? Trường mình có quy định thế nào về việc giao tiếp qua điện thoại và thư điện tử công vụ của viên chức ạ? Và các khoa đào tạo có những trách nhiệm gì trong việc định hướng và quản lý hoạt động NCKH của sinh viên vậy ạ?"
  dap_an_nhap: "- Theo Điều 27, học bổng loại Giỏi yêu cầu điểm học tập từ 3,20 – 3,59, điểm rèn luyện >= 80 và điểm học bổng từ 3,20 đến 3,67.\n- Quy định về giao tiếp qua điện thoại và thư điện tử công vụ của viên chức (Điều 10):\n  1. Khi giao tiếp qua điện thoại, viên chức phải xưng tên, chức danh, chức vụ, cơ quan, đơn vị nơi công tác; trao đổi ngắn gọn, tập trung vào nội dung công việc; âm lượng vừa đủ nghe; không tỏ thái độ thiếu lịch sự, không gắt gỏng hay nói trống không; không ngắt điện thoại đột ngột.\n  2. Quản lý, sử dụng hộp thư điện tử công vụ theo Quy định quản lý, sử dụng hộp thư điện tử của Trường.\n- Trách nhiệm của các khoa đào tạo trong quản lý hoạt động NCKH của sinh viên (Điều 11): định hướng về chuyên môn và tạo điều kiện thuận lợi cho hoạt động NCKH của sinh viên, bao gồm: hỗ trợ tổ chức hội nghị, hội thảo khoa học; hỗ trợ tổ chức các cuộc thi học thuật của sinh viên; giới thiệu sinh viên đến các đơn vị trong và ngoài Trường để thu thập tư liệu cho NCKH; phân công giảng viên hoặc mời người hướng dẫn sinh viên NCKH; tổ chức việc đánh giá và xét chọn đề tài NCKH của sinh viên tham gia giải thưởng, cuộc thi NCKH cấp khoa/Trường."
  y_bat_buoc:
    - "từ 3,20 đến 3,67 (hoặc 3,20 - 3,67)"
    - "xưng tên, chức danh, chức vụ, cơ quan, đơn vị nơi công tác"
    - "trao đổi ngắn gọn, tập trung vào nội dung công việc (hoặc âm lượng vừa đủ nghe / không tỏ thái độ thiếu lịch sự)"
    - "theo Quy định quản lý, sử dụng hộp thư điện tử của Trường"
    - "hỗ trợ tổ chức hội nghị, hội thảo khoa học (hoặc hỗ trợ tổ chức các cuộc thi học thuật của sinh viên)"
    - "phân công giảng viên hoặc mời người hướng dẫn sinh viên NCKH"
  nguon:
    - "Đ13: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
    - "Đ16: Quy định quy tắc ứng xử của viên chức, người lao động và người học Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10"
    - "Đ17: Quy định về việc tổ chức hoạt động nghiên cứu khoa học của sinh viên, Điều 11"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ17 không quy định thủ tục hồ sơ nộp ở đâu trong bao lâu, nên đổi sang hỏi nhiệm vụ/trách nhiệm của các khoa đào tạo trong việc quản lý hoạt động NCKH của sinh viên."

- phieu: V4-168
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu ạ, quy định về quy tắc ứng xử với người học khác trong trường giữa khóa K50 và K51 có gì khác nhau không ạ, cụ thể sv hai khóa này phải tuân thủ những quy tắc ứng xử nào với nhau thế ạ?"
  dap_an_nhap: "Quy định về quy tắc ứng xử với người học khác trong Trường giữa khóa K50 và khóa K51 là hoàn toàn giống nhau (Điều 14). Sinh viên cả hai khóa đều phải tuân thủ 4 quy tắc sau:\n1. Tôn trọng sự khác biệt, quyền tự do cá nhân trên cơ sở quy định của pháp luật; đối xử bình đẳng về dân tộc, tôn giáo, giới tính, ngôn ngữ, văn hoá.\n2. Đoàn kết, động viên, giúp đỡ nhau trong học tập, nghiên cứu và rèn luyện.\n3. Khiêm tốn, thân thiện, trung thực và trách nhiệm.\n4. Sử dụng ngôn từ chuẩn mực."
  y_bat_buoc:
    - "giống nhau (hoặc hoàn toàn giống nhau / không có điểm khác nhau)"
    - "Tôn trọng sự khác biệt, quyền tự do cá nhân trên cơ sở quy định của pháp luật"
    - "đối xử bình đẳng về dân tộc, tôn giáo, giới tính, ngôn ngữ, văn hoá"
    - "Đoàn kết, động viên, giúp đỡ nhau trong học tập, nghiên cứu và rèn luyện"
    - "Khiêm tốn, thân thiện, trung thực và trách nhiệm"
    - "Sử dụng ngôn từ chuẩn mực"
  nguon:
    - "Đ18: Quy định quy tắc ứng xử của viên chức, người lao động và người học Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 14"
    - "Đ19: Quy định quy tắc ứng xử của viên chức, người lao động và người học Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 14"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-169
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô ạ. Em hiện là sinh viên khóa K49 của trường mình, đợt này em có đứa em họ vừa mới trúng tuyển vào khóa K51. Hai anh em ngồi nói chuyện về việc học tập ở đại học thì em nhớ lại hồi trước em từng thi không đạt một môn học phần bắt buộc và phải đăng ký học lại. Em không biết là lên khóa K51 thì nhà trường đã có sự điều chỉnh nào về quy chế chưa, hay vẫn giữ nguyên như khóa K48-K49 của tụi em. Thầy cô cho em hỏi là theo quy chế đào tạo tín chỉ, quy định về việc xử lý khi sinh viên không đạt một học phần bắt buộc, học phần tự chọn bắt buộc và tự chọn tự do giữa khóa K48-K49 và K51 có điểm gì khác nhau không ạ?"
  dap_an_nhap: "Quy định về việc xử lý khi sinh viên không đạt học phần theo phương thức đào tạo theo tín chỉ (Điều 4) giữa khóa K48-K49 và khóa K51 là hoàn toàn giống nhau:\n- Sinh viên không đạt một học phần bắt buộc sẽ phải đăng ký học lại học phần đó hoặc một học phần tương đương theo quy định trong CTĐT, hoặc một học phần thay thế nếu học phần đó không còn được giảng dạy.\n- Sinh viên không đạt một học phần tự chọn bắt buộc sẽ phải đăng ký học lại chính học phần đó hoặc một học phần khác thuộc cùng nhóm học phần tự chọn bắt buộc theo quy định trong CTĐT, hoặc một học phần thay thế nếu học phần đó không còn được giảng dạy.\n- Sinh viên không đạt một học phần tự chọn tự do sẽ phải đăng ký học lại học phần đó hoặc có thể chọn đăng ký học một học phần khác theo quy định trong CTĐT."
  y_bat_buoc:
    - "hoàn toàn giống nhau (hoặc không có điểm khác nhau)"
    - "học phần bắt buộc: đăng ký học lại học phần đó hoặc một học phần tương đương (hoặc học phần thay thế nếu không còn được giảng dạy)"
    - "học phần tự chọn bắt buộc: đăng ký học lại chính học phần đó hoặc một học phần khác thuộc cùng nhóm học phần tự chọn bắt buộc (hoặc học phần thay thế nếu không còn được giảng dạy)"
    - "học phần tự chọn tự do: đăng ký học lại học phần đó hoặc có thể chọn đăng ký học một học phần khác"
  nguon:
    - "Đ20: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 4"
    - "Đ21: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 4"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-170
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu, quy định về điều kiện bị cảnh báo học tập với buộc thôi học của sv chính quy giữa khóa K48-K49 và K50 có gì khác nhau không ạ, hay cả 2 khóa đều áp dụng điều kiện giống nhau vậy ạ?"
  dap_an_nhap: "Quy định về xử lý kết quả học tập đối với hình thức đào tạo chính quy (Điều 12) giữa khóa K48-K49 và khóa K50 là hoàn toàn giống nhau:\n1. Cuối mỗi học kỳ chính, sinh viên bị cảnh báo học tập nếu vi phạm một trong các điều kiện:\n- Tổng số tín chỉ không đạt trong học kỳ vượt quá 50% khối lượng đã đăng ký học trong học kỳ, hoặc tổng số tín chỉ nợ đọng từ đầu khóa học vượt quá 24;\n- Điểm trung bình học kỳ đạt dưới 0,8 đối với học kỳ đầu của khóa học, dưới 1,0 đối với các học kỳ tiếp theo;\n- Điểm trung bình tích lũy đạt dưới 1,2 đối với sinh viên trình độ năm thứ nhất, dưới 1,4 đối với sinh viên trình độ năm thứ hai, dưới 1,6 đối với sinh viên trình độ năm thứ ba, dưới 1,8 đối với sinh viên các năm tiếp theo.\n2. Sinh viên bị buộc thôi học trong các trường hợp:\n- Bị cảnh báo học tập 03 lần liên tiếp trong một khóa học;\n- Bị cảnh báo học tập đến lần thứ tư tính từ đầu khóa;\n- Thời gian học tập vượt quá giới hạn tối đa quy định tại Điều 3 của Quy chế."
  y_bat_buoc:
    - "hoàn toàn giống nhau (hoặc giống nhau)"
    - "vượt quá 50% khối lượng đã đăng ký học trong học kỳ, hoặc tổng số tín chỉ nợ đọng từ đầu khóa học vượt quá 24"
    - "dưới 0,8 đối với học kỳ đầu của khóa học, dưới 1,0 đối với các học kỳ tiếp theo"
    - "dưới 1,2 đối với sinh viên trình độ năm thứ nhất, dưới 1,4 đối với sinh viên trình độ năm thứ hai, dưới 1,6 đối với sinh viên trình độ năm thứ ba, dưới 1,8 đối với sinh viên các năm tiếp theo"
    - "Bị cảnh báo học tập 03 lần liên tiếp trong một khóa học"
    - "Bị cảnh báo học tập đến lần thứ tư tính từ đầu khóa"
    - "Thời gian học tập vượt quá giới hạn tối đa"
  nguon:
    - "Đ22: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 12"
    - "Đ23: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 12"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ22 và Đ23 không nêu cụ thể thủ tục hồ sơ nộp ở đâu trong bao lâu, nên đổi sang hỏi quy định về điều kiện bị cảnh báo học tập và buộc thôi học giữa khóa K48-K49 và K50."

- phieu: V4-173
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô, em là sinh viên ngành sư phạm thuộc khóa K49 của trường mình. Đợt này gia đình em gặp một số biến cố lớn về kinh tế và sức khỏe nên em đang rất lo lắng về trách nhiệm bồi hoàn kinh phí hỗ trợ tiền đóng học phí và chi phí sinh hoạt nếu chẳng may sau này không thể công tác trong ngành giáo dục theo đúng thời hạn cam kết. Em cũng có đứa em ruột đang học sư phạm khóa K51 nên muốn tìm hiểu kỹ cho cả hai anh em. Thầy cô cho em hỏi là trường hợp sinh viên sư phạm phải bồi hoàn kinh phí nhưng thuộc diện khó khăn, chính sách hoặc gặp rủi ro sức khỏe thì các trường hợp ngoại lệ được xét miễn, giảm hoặc xóa kinh phí bồi hoàn giữa khóa K48-K49 và K51 được quy định khác nhau như thế nào ạ?"
  dap_an_nhap: "Quy định về trường hợp ngoại lệ được miễn, giảm hoặc xóa kinh phí bồi hoàn giữa khóa K48-K49 và K51 tại Điều 9 có sự khác biệt như sau:\n- Đối với khóa K48-K49 (Đ24): Nếu sinh viên sư phạm thuộc đối tượng chính sách, khó khăn thì căn cứ vào điều kiện cụ thể, đặc thù của sinh viên sư phạm, Ủy ban nhân dân cấp tỉnh quyết định phương thức thu hồi, chính sách miễn, giảm hoặc xóa kinh phí bồi hoàn.\n- Đối với khóa K51 (Đ25): Quy định chi tiết các trường hợp cụ thể hơn:\n  + Sinh viên sư phạm nếu thuộc đối tượng được cơ quan có thẩm quyền xác nhận bị suy giảm khả năng lao động từ 61% trở lên hoặc từ trần sẽ được xóa kinh phí bồi hoàn;\n  + Nếu thuộc đối tượng hưởng chính sách miễn hoặc giảm học phí theo quy định của Chính phủ sẽ được miễn hoặc giảm mức bồi hoàn kinh phí hỗ trợ tiền đóng học phí tương ứng;\n  + Căn cứ vào điều kiện cụ thể của sinh viên sư phạm, Ủy ban nhân dân cấp tỉnh nơi sinh viên thường trú quyết định miễn, giảm hoặc xóa kinh phí bồi hoàn cho sinh viên sư phạm thuộc đối tượng chính sách."
  y_bat_buoc:
    - "K48-K49: đối tượng chính sách, khó khăn thì căn cứ vào điều kiện cụ thể, đặc thù của sinh viên sư phạm, Ủy ban nhân dân cấp tỉnh quyết định phương thức thu hồi, chính sách miễn, giảm hoặc xóa kinh phí bồi hoàn"
    - "K51: suy giảm khả năng lao động từ 61% trở lên hoặc từ trần sẽ được xóa kinh phí bồi hoàn"
    - "K51: thuộc đối tượng hưởng chính sách miễn hoặc giảm học phí theo quy định của Chính phủ sẽ được miễn hoặc giảm mức bồi hoàn kinh phí hỗ trợ tiền đóng học phí tương ứng"
    - "K51: Ủy ban nhân dân cấp tỉnh nơi sinh viên thường trú quyết định miễn, giảm hoặc xóa kinh phí bồi hoàn cho sinh viên sư phạm thuộc đối tượng chính sách"
  nguon:
    - "Đ24: Nghị định quy định về chính sách hỗ trợ tiền đóng học phí, chi phí sinh hoạt đối với sinh viên sư phạm, Điều 9"
    - "Đ25: Nghị định quy định về chính sách hỗ trợ tiền đóng học phí, chi phí sinh hoạt đối với sinh viên sư phạm, Điều 9"
  hanh_vi: tra_loi
  ghi_chu: ""
