# Real names and abbreviations students use for a unit; the catalog build
# attaches them as aliases. Service wording comes from the handbook itself:
# guessed keyword aliases and services the handbook does not list are not
# added here (the directory selector reads the handbook's service text).
unit_aliases:
  Phòng Đào tạo: [PĐT, PDT, học vụ]
  Phòng Công nghệ Thông tin: [CNTT, phòng IT]
  Phòng Công tác chính trị và Học sinh, sinh viên: [CTCT&HSSV, CTCT-HSSV, CTCT/HSSV, CTCT HSSV, CTSV, HSSV, Phòng Công tác sinh viên]
  Phòng Kế hoạch - Tài chính: [KHTC, phòng tài chính]
  Phòng Khảo thí và Đảm bảo chất lượng: [KT&ĐBCL, KT DBCL, phòng khảo thí]
  Ký túc xá: [KTX, nội trú]
  Trạm Y tế: [TYT, phòng y tế, y tế trường]
  Khoa Toán - Tin học: [Toán]
  Khoa Vật lý: [Lý, Vật lý]
  Khoa Vật lí: [Lí, Vật lí]
  Khoa Hóa học: [Hóa, Hóa học]
  Khoa Sinh học: [Sinh, Sinh học]
  Khoa Ngữ văn: [Văn]
  Khoa Tiếng Anh: [Tiếng Anh, Anh văn]
  Khoa Tiếng Trung: [Khoa Tiếng Trung Quốc]
  Khoa Lịch sử: [Sử, Lịch sử]
  Khoa Địa lý: [Địa, Địa lý]
  Khoa Địa lí: [Địa, Địa lí]
  Khoa Tâm lý học: [Tâm lý]
  Khoa Tâm lí học: [Tâm lí, Tâm lý]
  Khoa Giáo dục Mầm non: [Mầm non, GDMN]
  Khoa Giáo dục Đặc biệt: [Đặc biệt, GDĐB]
  Khoa Giáo dục Thể chất: [Thể chất, GDTC]
  Khoa Giáo dục Quốc phòng: [Quốc phòng, GDQP]
  Khoa Công nghệ Thông tin: [CNTT, IT]
  Khoa Khoa học Tự nhiên: [KHTN, Tự nhiên]
  Khoa Khoa học Xã hội: [KHXH, Xã hội]
