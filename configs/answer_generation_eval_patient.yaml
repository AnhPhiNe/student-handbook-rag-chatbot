# Evaluation only (2026-10-04): the release composer with a longer timeout for
# runs with several questions at once. Model and prompt are unchanged.
input:
  formula_rules: data/processed/tables/formula_rules.json
  student_service_directory: data/processed/directories/student_service_directory.json
  student_office_profiles: data/processed/directories/student_office_profiles.json
  student_faculty_profiles: data/processed/directories/student_faculty_profiles.json
  structured_tables_registry: data/processed/tables/structured_tables_registry.json
  parent_docstore: data/processed/chunks/all_docstore_items.json
  program_directory: data/processed/directories/program_directory.json

# Composer release candidate: DeepSeek flash with low reasoning (2026-10-03).
# Eight targeted replays met the required facts; the ambiguous 5.2/10 query
# returned D+ consistently in 3/3 tries versus 1/3 with none on identical prompts.
# Broader answer regression is still pending. Historical off/low measurements
# with prompt v3.30 are preserved in docs/DESIGN_DECISIONS.md.
llm:
  # DeepSeek-V4.1-Flash-1017 on DeepInfra only (owner, 2026-10-18), with no
  # second provider. "deepseek" names the client (DeepSeekClient), which sends
  # DeepSeek's thinking parameters to any OpenAI-compatible base_url; DeepInfra
  # takes them (checked on V4.1-Flash: low thinks, none does not; the 1017
  # model carries the same "can-disable-reasoning" tag in DeepInfra's list).
  provider: deepseek
  base_url: https://api.deepinfra.com/v1/openai
  model_name: deepseek-ai/DeepSeek-V4.1-Flash-1017
  reasoning_effort: none
  api_keys_env_var: DEEPINFRA_API_KEY
  temperature: 0.0
  # Omit max_tokens from composer requests; no application output ceiling.
  max_output_tokens: null
  max_retries: 2
  retry_base_delay_seconds: 2
  retry_max_delay_seconds: 20
  request_timeout_seconds: 120
  max_context_chars: 160000
  # A local guard only; the provider enforces its own limits.
  key_pool:
    rpm_limit_per_key: 300
    cooldown_on_rate_limit_seconds: 30
    wait_when_all_keys_limited: false

# Picks the directory records (service, office, faculty, program) a student
# names when no name matches exactly; see src/retrieval/core/directory_selector.py.
directory_selector:
  provider: deepseek
  model_name: deepseek-flash
  reasoning_effort: none
  api_keys_env_var: DEEPSEEK_API_KEY
  # The same weights on DeepInfra when the DeepSeek API cannot answer or
  # DEEPSEEK_API_KEY is empty. See src/generation/fallback_client.py.
  fallback:
    base_url: https://api.deepinfra.com/v1/openai
    model_name: deepseek-ai/DeepSeek-V4.1-Flash
    api_keys_env_var: DEEPINFRA_API_KEY
  max_output_tokens: 200
  max_retries: 1
  request_timeout_seconds: 15
  # DeepSeek limits concurrency, not a request rate; this is only a local
  # guard. A limited key fails fast and the student is asked instead.
  key_pool:
    rpm_limit_per_key: 300
  # When the answer above finds nothing, the same prompt is asked once more
  # with thinking on, which maps everyday wording ("in bảng điểm") onto the
  # catalog's. Thinking counts toward max_output_tokens: 128 to ~3,200 tokens
  # (1-13 s) were measured, and a think that uses them all leaves no answer.
  thinking_retry:
    reasoning_effort: low
    max_output_tokens: 4096
    request_timeout_seconds: 30

citations:
  public_max_sources: 10

guardrails:
  skip_llm_on_low_confidence: true
