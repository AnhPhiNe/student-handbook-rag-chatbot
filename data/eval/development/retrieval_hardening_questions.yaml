    expected_directory: true
    must_include: ["phonghtqt@hcmue.edu.vn", "dịch thuật", "học bổng", "giao lưu"]
    source_catalog: data/processed/directories/student_office_profiles.json
  - id: hardening_13
    cohort: K51
    query: "Em chưa biết cách tra cứu và mượn sách, cần được hướng dẫn thì liên hệ đơn vị nào và email nào?"
    expected_directory: true
    must_include: ["Thư viện", "thuvien@hcmue.edu.vn"]
    source_catalog: data/processed/directories/student_service_directory.json
  - id: hardening_14
    cohort: K50
    query: "Chứng chỉ Cambridge B1 Preliminary tương đương bậc nào theo bảng của Trường?"
    expected_lookup: foreign_language
    gold_parent: K50_QuyDinhChuanDauRaNgoaiNgu_KhongCoChuong_Dieu8
    must_include: ["bậc 3"]
  - id: hardening_15
    cohort: K50
    query: "Chứng chỉ Cambridge B2 First tương đương bậc nào theo bảng của Trường?"
    expected_lookup: foreign_language
    gold_parent: K50_QuyDinhChuanDauRaNgoaiNgu_KhongCoChuong_Dieu8
    must_include: ["bậc 4"]
  - id: hardening_16
    cohort: K50
    query: "Điểm học tập của em là 3,1 và điểm rèn luyện là 80, tính điểm học bổng giúp em với."
    expected_lookup: formula
    gold_parent: K50_QuyCheCongTacSinhVien_Chuong5_Dieu27
