- phieu: V4-055
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ chào thầy cô, em là tân sinh viên mới vào trường được vài tuần, đợt này thấy trường tổ chức nhiều hoạt động tuyên truyền với hỗ trợ sinh viên quá nên em cũng muốn tìm hiểu thêm để sau này có gì cần giúp đỡ thì biết đường liên hệ. Cho em hỏi theo quy định của trường mình thì công tác sinh viên bao gồm những hoạt động trọng tâm nào và khi thực hiện thì phải đảm bảo những nguyên tắc gì ạ?"
  dap_an_nhap: "Công tác sinh viên là một trong những công tác trọng tâm của Trường, bao gồm tổng thể các hoạt động giáo dục, tuyên truyền; quản lý; hỗ trợ và dịch vụ đối với sinh viên nhằm đảm bảo các mục tiêu của giáo dục đại học.\nKhi thực hiện công tác sinh viên phải bảo đảm:\n- Thực hiện đúng đường lối của Đảng, chính sách, pháp luật của Nhà nước và các quy chế, quy định của Bộ Giáo dục và Đào tạo.\n- Bảo đảm khách quan, công bằng, công khai, minh bạch trong các vấn đề có liên quan đến sinh viên."
  y_bat_buoc:
    - "Bao gồm tổng thể các hoạt động giáo dục, tuyên truyền; quản lý; hỗ trợ và dịch vụ đối với sinh viên"
    - "nhằm đảm bảo các mục tiêu của giáo dục đại học"
    - "Thực hiện đúng đường lối của Đảng, chính sách, pháp luật của Nhà nước và các quy chế, quy định của Bộ Giáo dục và Đào tạo"
    - "Bảo đảm khách quan, công bằng, công khai, minh bạch trong các vấn đề có liên quan đến sinh viên"
  nguon:
    - "Đ1: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-056
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi các khoa có những công việc gì liên quan đến ban cán sự lớp và cố vấn học tập của sinh viên vậy ạ?"
  dap_an_nhap: "Liên quan đến ban cán sự lớp và cố vấn học tập, các khoa có trách nhiệm:\n- Chỉ định tạm thời hoặc bầu ban cán sự (lớp trưởng và các lớp phó) lớp sinh viên và lớp học phần.\n- Giới thiệu giảng viên phụ trách CVHT để giúp sinh viên đăng ký môn học."
  y_bat_buoc:
    - "Chỉ định tạm thời hoặc bầu ban cán sự (lớp trưởng và các lớp phó) lớp sinh viên và lớp học phần"
    - "Giới thiệu giảng viên phụ trách CVHT để giúp sinh viên đăng ký môn học"
  nguon:
    - "Đ2: Một số công việc của các khoa liên quan đến sinh viên"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-057
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, hoạt động của thầy cô cvht được đánh giá vào thời gian nào và ai là người đánh giá vậy ạ?"
  dap_an_nhap: "Kết thúc năm học vào tháng 7 hằng năm, Trưởng khoa và Giám đốc phân hiệu căn cứ vào kết quả thực hiện nhiệm vụ của CVHT, đánh giá hoạt động của CVHT và báo cáo về Phòng CTCT&HSSV. Kết quả đánh giá này là căn cứ để đánh giá, xếp loại chất lượng viên chức."
  y_bat_buoc:
    - "Kết thúc năm học vào tháng 7 hằng năm"
    - "Trưởng khoa và Giám đốc phân hiệu"
    - "báo cáo về Phòng CTCT&HSSV"
    - "căn cứ để đánh giá, xếp loại chất lượng viên chức"
  nguon:
    - "Đ3: Quy định công tác cố vấn học tập cho sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 8"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-058
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, Phòng Khảo thí và Đảm bảo chất lượng có nhiệm vụ gì liên quan đến công tác sinh viên với cvht vậy ạ?"
  dap_an_nhap: "Phòng Khảo thí và Đảm bảo chất lượng có các nhiệm vụ sau:\n1. Phối hợp Phòng CTCT&HSSV trong việc đánh giá công tác sinh viên, công tác CVHT định kỳ.\n2. Phối hợp các khoa và phân hiệu định kỳ tổ chức thu thập ý kiến sinh viên nhằm nâng cao chất lượng đào tạo và phục vụ của Trường."
  y_bat_buoc:
    - "Phối hợp Phòng CTCT&HSSV trong việc đánh giá công tác sinh viên, công tác CVHT định kỳ"
    - "Phối hợp các khoa và phân hiệu định kỳ tổ chức thu thập ý kiến sinh viên nhằm nâng cao chất lượng đào tạo và phục vụ của Trường"
  nguon:
    - "Đ4: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 15"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-059
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Hội đồng đánh giá kết quả rèn luyện sinh viên cấp Khoa do ai thành lập và gồm những thành phần nào ạ?"
  dap_an_nhap: "Hội đồng đánh giá kết quả rèn luyện cấp Khoa do Trưởng khoa thành lập. Thành phần Hội đồng gồm:\n- Chủ tịch Hội đồng: Trưởng khoa hoặc Phó Trưởng khoa được Trưởng khoa ủy quyền.\n- Các ủy viên: Văn phòng khoa hoặc bộ phận quản lý sinh viên; CVHT; đại diện Đoàn khoa, Liên chi Hội sinh viên."
  y_bat_buoc:
    - "Thẩm quyền thành lập: Trưởng khoa"
    - "Chủ tịch Hội đồng: Trưởng khoa hoặc Phó Trưởng khoa được Trưởng khoa ủy quyền"
    - "Các ủy viên: Văn phòng khoa hoặc bộ phận quản lý sinh viên; CVHT; đại diện Đoàn khoa, Liên chi Hội sinh viên"
  nguon:
    - "Đ5: Quy chế đánh giá kết quả rèn luyện của sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 12"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-060
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, quy tắc ứng xử của trường mình yêu cầu thầy cô phải ứng xử thế nào với người học trong giảng dạy và hướng dẫn nckh ạ?"
  dap_an_nhap: "Theo quy định, đối với người học, viên chức và người lao động của Trường phải:\n- Tạo môi trường học tập an toàn, thân thiện và cởi mở; tạo điều kiện tối đa cho người học phát huy hết các khả năng học tập và rèn luyện.\n- Trách nhiệm, tận tâm, sáng tạo trong giảng dạy và hướng dẫn NCKH; khách quan, công bằng và cẩn trọng trong kiểm tra, đánh giá.\n- Gương mẫu và đúng mực trong giao tiếp; tôn trọng và luôn sẵn sàng lắng nghe, chia sẻ, giúp đỡ người học."
  y_bat_buoc:
    - "Trách nhiệm, tận tâm, sáng tạo trong giảng dạy và hướng dẫn NCKH"
    - "khách quan, công bằng và cẩn trọng trong kiểm tra, đánh giá"
  nguon:
    - "Đ6: Quy định quy tắc ứng xử của viên chức, người lao động và người học Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 8"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-061
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "tham gia hoat dong tinh nguyen vi cong dong cap truong thi duoc cong bao nhieu diem ren luyen vay a"
  dap_an_nhap: "Theo khung điểm rèn luyện (Phần IV.b), tham gia các hoạt động tình nguyện vì cộng đồng cấp Trường (tương đương) trở lên được cộng 4 điểm/hoạt động."
  y_bat_buoc:
    - "4 điểm/hoạt động"
    - "Cấp Trường (tương đương) trở lên"
  nguon:
    - "Đ7: Phiếu đánh giá kết quả rèn luyện sinh viên (Phụ lục 1), Phần IV"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-062
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Sinh viên ở ngoại trú thì có những quyền gì theo quy định của nhà trường ạ?"
  dap_an_nhap: "Theo quy định, sinh viên ngoại trú có các quyền sau:\n1. Được hưởng các quyền công dân cư trú trên địa bàn theo quy định của pháp luật, được Trường và các bên liên quan hỗ trợ và giúp đỡ trong việc đăng ký ngoại trú.\n2. Được tạo điều kiện tham gia các hoạt động văn hóa, văn nghệ, thể dục thể thao, xây dựng đời sống văn hóa ở khu dân cư do địa phương tổ chức."
  y_bat_buoc:
    - "Được hưởng các quyền công dân cư trú trên địa bàn theo quy định của pháp luật"
    - "được Trường và các bên liên quan hỗ trợ và giúp đỡ trong việc đăng ký ngoại trú"
    - "Được tạo điều kiện tham gia các hoạt động văn hóa, văn nghệ, thể dục thể thao, xây dựng đời sống văn hóa ở khu dân cư do địa phương tổ chức"
  nguon:
    - "Đ8: Quy định ngoại trú đối với sinh viên đào tạo trình độ đại học, cao đẳng ngành Giáo dục Mầm non hình thức chính quy của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 5"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-063
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Mục đích của việc ban hành quy định ngoại trú đối với sinh viên của trường là gì vậy ạ?"
  dap_an_nhap: "Mục đích của quy định ngoại trú đối với sinh viên gồm:\n1. Đẩy mạnh công tác phối hợp giữa Trường với chính quyền địa phương trong việc quản lý và hỗ trợ sinh viên được sinh hoạt, học tập, rèn luyện và lao động trong môi trường lành mạnh, thuận lợi cho sự phát triển của sinh viên.\n2. Tạo điều kiện cho sinh viên tham gia xây dựng đời sống văn hóa, nền nếp, kỷ cương, phòng chống tội phạm, tệ nạn xã hội."
  y_bat_buoc:
    - "Đẩy mạnh công tác phối hợp giữa Trường với chính quyền địa phương trong việc quản lý và hỗ trợ sinh viên"
    - "sinh hoạt, học tập, rèn luyện và lao động trong môi trường lành mạnh, thuận lợi cho sự phát triển của sinh viên"
    - "Tạo điều kiện cho sinh viên tham gia xây dựng đời sống văn hóa, nền nếp, kỷ cương, phòng chống tội phạm, tệ nạn xã hội"
  nguon:
    - "Đ9: Quy định ngoại trú đối với sinh viên đào tạo trình độ đại học, cao đẳng ngành Giáo dục Mầm non hình thức chính quy của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-065
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, nếu không tham gia bhyt hoặc không đánh giá đrl đúng hạn thì bị trừ bao nhiêu điểm rèn luyện vậy ạ?"
  dap_an_nhap: "Theo khung điểm rèn luyện (Phần II):\n- Không tham gia bảo hiểm y tế theo quy định: bị trừ 5 điểm.\n- Đánh giá kết quả rèn luyện chậm tiến độ, sai quy định, không trung thực: bị trừ 3 điểm.\n- Trường hợp không đánh giá kết quả rèn luyện sinh viên: bị xếp loại Rèn luyện Kém."
  y_bat_buoc:
    - "Không tham gia bảo hiểm y tế theo quy định: -5 điểm"
    - "Đánh giá chậm tiến độ, sai quy định, không trung thực: -3 điểm"
    - "Không đánh giá kết quả rèn luyện sinh viên: Rèn luyện Kém"
  nguon:
    - "Đ10: Khung điểm đánh giá kết quả rèn luyện sinh viên (Phụ lục 1, Quyết định số 2000/QĐ-ĐHSP ngày 15/7/2024), Phần II"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ10 không có nội dung thủ tục, chuyển sang hỏi quy định về mức trừ điểm và xếp loại rèn luyện khi vi phạm thời hạn đánh giá và tham gia BHYT."

- phieu: V4-066
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Hồ sơ đánh giá rèn luyện của lớp sinh viên gửi lên Hội đồng cấp Khoa bao gồm những giấy tờ gì ạ?"
  dap_an_nhap: "Lớp sinh viên lập hồ sơ đánh giá rèn luyện và gửi lên Hội đồng cấp Khoa gồm:\n- Biên bản họp xét đánh giá rèn luyện sinh viên của lớp (ký xác nhận vào biên bản gồm: CVHT, đại diện BCS, BCH chi đoàn, BCH chi hội sinh viên).\n- Bảng kết quả đánh giá rèn luyện sinh viên của lớp có xác nhận của CVHT.\n- Minh chứng các hoạt động được chấm điểm rèn luyện.\n- Đơn xin không đánh giá rèn luyện (nếu có)."
  y_bat_buoc:
    - "Biên bản họp xét đánh giá rèn luyện sinh viên của lớp (ký xác nhận vào biên bản gồm: CVHT, đại diện BCS, BCH chi đoàn, BCH chi hội sinh viên)"
    - "Bảng kết quả đánh giá rèn luyện sinh viên của lớp có xác nhận của CVHT"
    - "Minh chứng các hoạt động được chấm điểm rèn luyện"
    - "Đơn xin không đánh giá rèn luyện (nếu có)"
  nguon:
    - "Đ11: Quy chế đánh giá kết quả rèn luyện của sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-067
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi hồ sơ đánh giá rèn luyện sinh viên cấp Trường bao gồm những văn bản, giấy tờ nào ạ?"
  dap_an_nhap: "Hồ sơ đánh giá rèn luyện sinh viên cấp Trường bao gồm:\n1. Biên bản họp Hội đồng đánh giá rèn luyện cấp Trường (Thư ký và Chủ tịch Hội đồng ký biên bản).\n2. Hồ sơ đánh giá kết quả rèn luyện của các đơn vị quản lý sinh viên (biên bản và bảng kết quả đánh giá rèn luyện sinh viên đã được Hội đồng cấp cơ sở thông qua).\n3. Quyết định công nhận kết quả rèn luyện sinh viên; Quyết định tạm nghỉ học, buộc thôi học đối với sinh viên đạt kết quả rèn luyện yếu, kém; các quyết định khác liên quan đến đánh giá kết quả rèn luyện (nếu có) và bảng kết quả đánh giá rèn luyện sinh viên hệ chính quy toàn Trường."
  y_bat_buoc:
    - "Biên bản họp Hội đồng đánh giá rèn luyện cấp Trường (Thư ký và Chủ tịch Hội đồng ký biên bản)"
    - "Hồ sơ đánh giá kết quả rèn luyện của các đơn vị quản lý sinh viên (biên bản và bảng kết quả đánh giá rèn luyện sinh viên đã được Hội đồng cấp cơ sở thông qua)"
    - "Quyết định công nhận kết quả rèn luyện sinh viên; Quyết định tạm nghỉ học, buộc thôi học đối với sinh viên đạt kết quả rèn luyện yếu, kém; các quyết định khác liên quan đến đánh giá kết quả rèn luyện (nếu có) và bảng kết quả đánh giá rèn luyện sinh viên hệ chính quy toàn Trường"
  nguon:
    - "Đ12: Hướng dẫn lập hồ sơ đánh giá kết quả rèn luyện sinh viên (Phụ lục 2), Mục III"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-068
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hoi sinh vien co quyen truc tiep kien nghi hoac khieu nai voi khoa va truong ve quyen loi cua minh khong"
  dap_an_nhap: "Có. Theo quy định, sinh viên được trực tiếp hoặc thông qua tổ chức Đoàn, Hội, CVHT kiến nghị với Trường các giải pháp góp phần xây dựng Trường; được đề đạt nguyện vọng và khiếu nại với khoa, Trường để giải quyết các vấn đề có liên quan đến quyền, lợi ích chính đáng của sinh viên."
  y_bat_buoc:
    - "Được trực tiếp hoặc thông qua tổ chức Đoàn, Hội, CVHT kiến nghị với Trường các giải pháp góp phần xây dựng Trường"
    - "được đề đạt nguyện vọng và khiếu nại với khoa, Trường để giải quyết các vấn đề có liên quan đến quyền, lợi ích chính đáng của sinh viên"
  nguon:
    - "Đ13: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 8"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ13 không có nội dung thủ tục, chuyển sang hỏi quy định về quyền kiến nghị và khiếu nại của sinh viên."

- phieu: V4-070
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Nếu em muốn nộp hồ sơ xin ở KTX hoặc làm thủ tục xin cấp lại thẻ sinh viên thì liên hệ đơn vị nào trong trường ạ?"
  dap_an_nhap: "Bạn liên hệ Phòng Công tác chính trị và Học sinh, sinh viên (Phòng CTCT và HSSV). Đơn vị này có trách nhiệm:\n- Tiếp nhận và xử lý các loại đơn, hồ sơ, công văn… liên quan đến công tác sinh viên. Xác nhận, xét hồ sơ sinh viên xin ở KTX, cấp giấy chứng nhận và các giấy tờ khác cho sinh viên thuộc thẩm quyền được Hiệu trưởng phân cấp.\n- Quản lý hành chính hồ sơ sinh viên và phụ trách việc cấp mới, cấp lại thẻ sinh viên."
  y_bat_buoc:
    - "Phòng Công tác chính trị và Học sinh, sinh viên"
    - "Xác nhận, xét hồ sơ sinh viên xin ở KTX, cấp giấy chứng nhận và các giấy tờ khác cho sinh viên thuộc thẩm quyền được Hiệu trưởng phân cấp"
    - "phụ trách việc cấp mới, cấp lại thẻ sinh viên"
  nguon:
    - "Đ14: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 14"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ14 chỉ nêu đơn vị có thẩm quyền tiếp nhận hồ sơ xét KTX và cấp lại thẻ sinh viên chứ không có quy trình thủ tục chi tiết."

- phieu: V4-071
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi theo quy định thì sinh viên có quyền được nghỉ học tạm thời hoặc học cùng lúc hai chương trình không ạ?"
  dap_an_nhap: "Có. Theo quy định, sinh viên được quyền nghỉ học tạm thời, học theo tiến độ chậm, tiến độ nhanh, học cùng lúc hai chương trình, chuyển ngành, chuyển trường theo quy định của quy chế về đào tạo của Bộ Giáo dục và Đào tạo; đồng thời được nghỉ hè, nghỉ Tết, nghỉ lễ theo quy định."
  y_bat_buoc:
    - "Nghỉ học tạm thời, học theo tiến độ chậm, tiến độ nhanh, học cùng lúc hai chương trình, chuyển ngành, chuyển trường"
    - "theo quy định của quy chế về đào tạo của Bộ Giáo dục và Đào tạo"
    - "nghỉ hè, nghỉ Tết, nghỉ lễ theo quy định"
  nguon:
    - "Đ15: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 8"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ15 không có nội dung thủ tục, chuyển sang hỏi quy định về quyền nghỉ học tạm thời và học cùng lúc hai chương trình của sinh viên."

- phieu: V4-073
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Nếu em đăng ký tham gia hoạt động của trường hoặc của khoa mà không tham gia thì bị trừ bao nhiêu điểm rèn luyện ạ?"
  dap_an_nhap: "Theo khung điểm rèn luyện (Phần II), sinh viên đăng ký tham gia hoạt động mà không tham gia sẽ bị trừ điểm như sau:\n- Cấp Khoa: trừ 3 điểm/lần.\n- Cấp Trường: trừ 4 điểm/lần."
  y_bat_buoc:
    - "Cấp Khoa: - 3 điểm/lần"
    - "Cấp Trường: - 4 điểm/lần"
  nguon:
    - "Đ16: Phiếu đánh giá kết quả rèn luyện sinh viên (Phụ lục 1), Phần II"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ16 không có nội dung thủ tục, chuyển sang hỏi quy định về mức trừ điểm rèn luyện khi đăng ký mà không tham gia hoạt động."

- phieu: V4-079
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Trường hợp sinh viên bị kỷ luật hoặc có môn thi lần 1 bị điểm dưới trung bình thì có được xét khen thưởng danh hiệu cuối năm không ạ?"
  dap_an_nhap: "Không. Quy chế quy định rõ: Không xét khen thưởng đối với sinh viên bị kỷ luật hoặc có điểm thi kết thúc học phần ở lần thi thứ nhất trong học kỳ hoặc năm học đó dưới mức trung bình."
  y_bat_buoc:
    - "Không xét khen thưởng đối với sinh viên bị kỷ luật"
    - "hoặc có điểm thi kết thúc học phần ở lần thi thứ nhất trong học kỳ hoặc năm học đó dưới mức trung bình"
  nguon:
    - "Đ17: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 32"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-081
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào thầy cô, em là sinh viên năm nhất mới nhập học, đợt này em có tham gia hỗ trợ một số công việc bàn giấy ở văn phòng khoa nên có cơ hội tiếp xúc và quan sát cách làm việc của các thầy cô, cán bộ trong trường. Em thấy môi trường làm việc của trường rất chuyên nghiệp và em cũng tò mò muốn tìm hiểu thêm về các quy chuẩn ứng xử nội bộ để sau này đi làm ở các cơ quan giáo dục thì biết cách cư xử cho đúng. Thầy cô cho em hỏi theo quy tắc ứng xử của trường mình thì khi viên chức góp ý hay phê bình cấp trên và đồng nghiệp thì phải tuân thủ nguyên tắc gì và tuyệt đối không được làm điều gì ạ?"
  dap_an_nhap: "Theo quy định tại Điều 7 Quy tắc ứng xử của Trường:\n- Đối với cấp trên: Viên chức đóng góp ý kiến với tinh thần xây dựng, nhằm khắc phục kịp thời những tồn tại, hạn chế và đổi mới công tác chỉ đạo, điều hành; không được lợi dụng việc góp ý, phê bình làm ảnh hưởng đến uy tín, danh dự của cấp trên.\n- Đối với đồng nghiệp: Phải chân thành, thân thiện trong quan hệ; không được lợi dụng việc góp ý, phê bình làm ảnh hưởng đến uy tín, danh dự của đồng nghiệp."
  y_bat_buoc:
    - "đóng góp ý kiến với cấp trên với tinh thần xây dựng"
    - "không được lợi dụng việc góp ý, phê bình làm ảnh hưởng đến uy tín, danh dự của cấp trên"
    - "chân thành, thân thiện trong quan hệ với đồng nghiệp"
    - "không được lợi dụng việc góp ý, phê bình làm ảnh hưởng đến uy tín, danh dự của đồng nghiệp"
  nguon:
    - "Đ18: Quy định quy tắc ứng xử của viên chức, người lao động và người học Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 7"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ18 không có nội dung về hệ quả vi phạm hay trường hợp ngoại lệ, chuyển sang hỏi quy định về nguyên tắc và điều cấm khi góp ý, phê bình cấp trên và đồng nghiệp."

- phieu: V4-082
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Sinh viên nếu có kết quả rèn luyện bị xếp loại yếu hoặc kém thì sẽ phải chịu quyết định xử lý như thế nào ạ?"
  dap_an_nhap: "Theo quy định tại hồ sơ đánh giá rèn luyện sinh viên cấp Trường, đối với sinh viên đạt kết quả rèn luyện yếu, kém sẽ có Quyết định tạm nghỉ học hoặc Quyết định buộc thôi học."
  y_bat_buoc:
    - "Quyết định tạm nghỉ học, buộc thôi học đối với sinh viên đạt kết quả rèn luyện yếu, kém"
  nguon:
    - "Đ19: Hướng dẫn lập hồ sơ đánh giá kết quả rèn luyện sinh viên (Phụ lục 2), Mục III"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-085
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Quy định về việc tổ chức hoạt động thông tin khoa học và công nghệ của sinh viên như thế nào vậy ạ?"
  dap_an_nhap: "Trường, Khoa tổ chức hoạt động thu thập, xử lý, lưu giữ, phổ biến thông tin KH&CN của SV, bao gồm:\n1. Xuất bản các tập san, thông báo khoa học, kỷ yếu đề tài NCKH của SV;\n2. Quản lý, lưu giữ các đề tài NCKH của SV trong Thư viện của Trường;\n3. Đăng tải kết quả NCKH của SV trên Trang thông tin điện tử của Trường và các phương tiện thông tin đại chúng khác."
  y_bat_buoc:
    - "Xuất bản các tập san, thông báo khoa học, kỷ yếu đề tài NCKH của SV"
    - "Quản lý, lưu giữ các đề tài NCKH của SV trong Thư viện của Trường"
    - "Đăng tải kết quả NCKH của SV trên Trang thông tin điện tử của Trường và các phương tiện thông tin đại chúng khác"
  nguon:
    - "Đ20: Quy định về việc tổ chức hoạt động nghiên cứu khoa học của sinh viên, Điều 9"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-086
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "quy dinh ve trach nhiem cua phong cong nghe thong tin trong cong tac ngoai tru nhu the nao vay ad"
  dap_an_nhap: "Trách nhiệm của Phòng Công nghệ Thông tin trong công tác ngoại trú gồm:\n1. Đảm bảo hệ thống máy chủ ổn định để sinh viên cập nhật các thông tin ngoại trú trên Cổng thông tin điện tử của Trường.\n2. Phối hợp với Phòng CTCT&HSSV và các bên liên quan trong việc xây dựng dữ liệu, xử lý các vấn đề phát sinh trong việc cập nhật thông tin ngoại trú của sinh viên."
  y_bat_buoc:
    - "Đảm bảo hệ thống máy chủ ổn định để sinh viên cập nhật các thông tin ngoại trú trên Cổng thông tin điện tử của Trường"
    - "Phối hợp với Phòng CTCT&HSSV và các bên liên quan trong việc xây dựng dữ liệu, xử lý các vấn đề phát sinh trong việc cập nhật thông tin ngoại trú của sinh viên"
  nguon:
    - "Đ21: Quy định ngoại trú đối với sinh viên đào tạo trình độ đại học, cao đẳng ngành Giáo dục Mầm non hình thức chính quy của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-087
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Quy định về trách nhiệm của Phòng Công nghệ Thông tin trong việc quản lý sinh viên ngoại trú thế nào ạ?"
  dap_an_nhap: "Theo quy định tại Điều 10, trách nhiệm của Phòng Công nghệ Thông tin gồm:\n1. Đảm bảo hệ thống máy chủ ổn định để sinh viên cập nhật các thông tin ngoại trú trên Cổng thông tin điện tử của Trường.\n2. Phối hợp với Phòng CTCT&HSSV và các bên liên quan trong việc xây dựng dữ liệu, xử lý các vấn đề phát sinh trong việc cập nhật thông tin ngoại trú của sinh viên."
  y_bat_buoc:
    - "Đảm bảo hệ thống máy chủ ổn định để sinh viên cập nhật các thông tin ngoại trú trên Cổng thông tin điện tử của Trường"
    - "Phối hợp với Phòng CTCT&HSSV và các bên liên quan trong việc xây dựng dữ liệu, xử lý các vấn đề phát sinh trong việc cập nhật thông tin ngoại trú của sinh viên"
  nguon:
    - "Đ22: Quy định ngoại trú đối với sinh viên đào tạo trình độ đại học, cao đẳng ngành Giáo dục Mầm non hình thức chính quy của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-088
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hỏi xíu, thông báo thực hiện chính sách miễn, giảm học phí cho sv năm học 2022 - 2023 của trường căn cứ vào văn bản nào vậy ạ?"
  dap_an_nhap: "Thông báo về việc thực hiện chính sách miễn, giảm học phí cho sinh viên hệ chính quy năm học 2022 – 2023 của Trường căn cứ vào Nghị định số 81/2021/NĐ-CP ngày 27 tháng 8 năm 2021 của Chính phủ quy định về cơ chế thu, quản lý học phí đối với cơ sở giáo dục thuộc hệ thống giáo dục quốc dân và chính sách miễn, giảm học phí, hỗ trợ chi phí học tập; giá dịch vụ trong lĩnh vực giáo dục, đào tạo."
  y_bat_buoc:
    - "Nghị định số 81/2021/NĐ-CP ngày 27 tháng 8 năm 2021 của Chính phủ"
  nguon:
    - "Đ23: Thông báo về việc thực hiện chính sách miễn, giảm học phí cho sinh viên hệ chính quy năm học 2022 – 2023"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ23 chỉ có phần mở đầu nêu căn cứ pháp lý của thông báo, không có nội dung chính sách cụ thể, nên chuyển sang hỏi văn bản căn cứ của thông báo."

- phieu: V4-089
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Quy định về các loại học bổng dành cho sinh viên của trường như thế nào vậy ạ?"
  dap_an_nhap: "Quy định về học bổng của Trường gồm các loại sau:\n1. Học bổng khuyến khích học tập:\n- Chế độ HBKKHT thực hiện theo quy định hiện hành của Bộ Giáo dục và Đào tạo và của Trường.\n- Chỉ được cấp cho sinh viên hệ chính quy đang học tập tại Trường; người học liên thông không được xét cấp.\n2. Học bổng chính sách: Được cấp theo hợp đồng giữa Trường và cơ quan cử sinh viên theo học diện cử tuyển (nếu có).\n3. Học bổng tài trợ:\n- Do các tổ chức và cá nhân trao theo những điều kiện và quy trình riêng.\n- Do Phòng CTCT&HSSV hoặc phối hợp với các đơn vị khác tiếp nhận và thông báo đến toàn thể sinh viên khi có thông tin về học bổng."
  y_bat_buoc:
    - "Học bổng khuyến khích học tập: chỉ được cấp cho sinh viên hệ chính quy đang học tập tại Trường; người học liên thông không được xét cấp"
    - "Học bổng chính sách: cấp theo hợp đồng giữa Trường và cơ quan cử sinh viên theo học diện cử tuyển (nếu có)"
    - "Học bổng tài trợ: do các tổ chức và cá nhân trao theo những điều kiện và quy trình riêng"
    - "Phòng CTCT&HSSV hoặc phối hợp với các đơn vị khác tiếp nhận và thông báo"
  nguon:
    - "Đ24: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 26"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-090
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Quy định về nghĩa vụ của sinh viên ngoại trú như thế nào vậy ạ?"
  dap_an_nhap: "Theo Điều 6 Quy định ngoại trú, sinh viên ngoại trú có các nghĩa vụ sau:\n1. Thực hiện nghĩa vụ công dân theo quy định của pháp luật; chấp hành các quy định về bảo đảm an ninh, trật tự, an toàn xã hội; tích cực tham gia các hoạt động văn hóa, văn nghệ, thể dục thể thao, phòng, chống ma túy; phòng, chống tội phạm, tệ nạn xã hội, bảo vệ môi trường nơi cư trú và các hoạt động khác do địa phương tổ chức.\n2. Khi có sự thay đổi về nơi cư trú, sinh viên có nghĩa vụ cập nhật địa chỉ nơi cư trú (thông qua Cổng thông tin điện tử sinh viên của Trường trong thời hạn tối đa là 20 ngày, kể từ ngày thay đổi nơi cư trú."
  y_bat_buoc:
    - "Thực hiện nghĩa vụ công dân theo quy định của pháp luật; chấp hành các quy định về bảo đảm an ninh, trật tự, an toàn xã hội"
    - "tích cực tham gia các hoạt động văn hóa, văn nghệ, thể dục thể thao, phòng, chống ma túy; phòng, chống tội phạm, tệ nạn xã hội, bảo vệ môi trường nơi cư trú"
    - "cập nhật địa chỉ nơi cư trú (thông qua Cổng thông tin điện tử sinh viên của Trường trong thời hạn tối đa là 20 ngày, kể từ ngày thay đổi nơi cư trú"
  nguon:
    - "Đ25: Quy định ngoại trú đối với sinh viên đào tạo trình độ đại học, cao đẳng ngành Giáo dục Mầm non hình thức chính quy của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 6"
