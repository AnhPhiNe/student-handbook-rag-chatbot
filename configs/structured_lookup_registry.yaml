version: 4

tools:
  foreign_language:
    data_category: regulation_table
    presentation_type: table
    selection_mode: table_first
    description: "Quy đổi chứng chỉ/điểm ngoại ngữ đã nêu sang bậc tương đương hoặc liệt kê bảng quy đổi; không xác lập chuẩn đầu ra bắt buộc."
    intents: [direct_value, list_items]
    default_intent: direct_value
    required_slots:
      direct_value: []
      list_items: []
    slot_schema:
      certificate_or_language:
        type: string
        examples: [IELTS, TOEFL, JLPT, HSK, TOPIK]
        span_aliases:
          IELTS: [IELTS]
          TOEFL: [TOEFL, TOEFL iBT, TOEFL ITP]
          TOEIC: [TOEIC, TOEIC 4 kỹ năng, TOEIC 4 ky nang]
          Cambridge: [Cambridge, Linguaskill]
          JLPT: [JLPT, Japanese Language Proficiency Test]
          HSK: [HSK, Hanyu Shuiping Kaoshi]
          TOPIK: [TOPIK, TOPIK II]
          TCF_DELF: [TCF, DELF, TCF DELF]
      score_or_level:
        type: [string, number]
        examples: [5.5, N3, HSK4, TOPIK3]
        span_aliases:
          N1: [N1]
          N2: [N2]
          N3: [N3]
          N4: [N4]
          N5: [N5]
      listening_score: {type: [string, number]}
      reading_score: {type: [string, number]}
      speaking_score: {type: [string, number]}
      writing_score: {type: [string, number]}
    strategy: foreign_language_lookup
    response_intent: foreign_language_lookup_query
    target_chunk_types: [structured_lookup]

  study_duration:
    data_category: regulation_table
    presentation_type: table
    selection_mode: table_first
    description: Tra thời gian học chuẩn/tối đa theo hệ đào tạo và loại chương trình.
    intents: [direct_value, list_items]
    default_intent: direct_value
    required_slots:
      direct_value: []
      list_items: []
    slot_schema:
      training_mode:
        type: string
        enum: [chinh_quy, vua_lam_vua_hoc]
        span_aliases:
          chinh_quy: [chính quy]
          vua_lam_vua_hoc: [vừa làm vừa học, VLVH]
      program_type:
        type: string
        canonical_values: [first_degree, college_bridge, secondary_bridge, second_degree]
        span_aliases:
          first_degree: [cấp bằng thứ nhất, bằng thứ nhất, cử nhân, first degree]
          college_bridge: [liên thông từ cao đẳng, cao đẳng, college bridge]
          secondary_bridge: [liên thông từ trung cấp, trung cấp, secondary bridge]
          second_degree: [bằng đại học thứ hai, văn bằng hai, second degree]
    strategy: study_duration_lookup
    response_intent: study_duration_lookup_query
    target_chunk_types: [structured_lookup]

  scholarship_classification:
    data_category: regulation_table
    presentation_type: table
    selection_mode: table_first
    description: "Tra điều kiện, xếp loại hoặc mức tiền HBKKHT. Công thức điểm dùng formula; quy đổi GPA/rèn luyện dùng scoring."
    intents: [direct_value, list_items]
    default_intent: direct_value
    required_slots:
      direct_value: []
      list_items: []
    slot_schema:
      score_or_label:
        type: [string, number]
        description: Điểm hoặc tên mức xếp loại được hỏi.
    strategy: scholarship_classification_lookup
    response_intent: scholarship_classification_lookup_query
    target_chunk_types: [structured_lookup]

  scoring:
    data_category: regulation_table
    presentation_type: table
    selection_mode: table_first
    description: Tra và quy đổi thang điểm học phần, xếp loại học lực hoặc phân loại tổng điểm rèn luyện; không tra ngưỡng điểm để đạt từng loại học bổng.
    intents: [direct_value, list_items]
    default_intent: direct_value
    required_slots:
      direct_value: []
      list_items: []
    slot_schema:
      operation:
        type: string
        enum: [grade_10_to_letter, pass_fail_ungraded, letter_to_grade_4, academic_classification, conduct_classification, pass_threshold]
      score_or_grade: {type: [string, number]}
    table_selector:
      slot: operation
      values:
        grade_10_to_letter:
          table_types: [scoring]
          table_subtypes: [grade_scale]
        pass_fail_ungraded:
          table_types: [scoring]
          table_subtypes: [pass_fail_ungraded]
        pass_threshold:
          table_types: [scoring]
          table_subtypes: [grade_scale, pass_fail_ungraded]
        letter_to_grade_4:
          table_types: [scoring]
          table_subtypes: [letter_to_grade4]
        academic_classification:
          table_types: [scoring]
          table_subtypes: [academic_classification]
        conduct_classification:
          table_types: [conduct]
          table_subtypes: [conduct_classification]
    strategy: structured_lookup
    response_intent: score_lookup_query
    target_chunk_types: [structured_lookup]

  student_service:
    data_category: directory_table
    presentation_type: contact_card
    description: Tìm đơn vị/liên hệ xử lý một dịch vụ vận hành cụ thể; trách nhiệm theo quy chế, chính sách hoặc thủ tục dùng RAG.
    intents: [direct_value, contact]
    default_intent: contact
    required_slots:
      direct_value: [service, requested_field]
      contact: [service, requested_field]
    slot_schema:
      service:
        type: string
        description: Dịch vụ cần hỗ trợ, không phải tên đơn vị.
      requested_field:
        type: string
        enum: [unit, phone, email, office, website, all]
        span_aliases:
          unit: [đơn vị, don vi, bộ phận, bo phan]
          phone: [số điện thoại, so dien thoai, điện thoại, dien thoai, phone]
          email: [email, thư điện tử, thu dien tu]
          office: [địa chỉ, dia chi, phòng làm việc, phong lam viec]
          website: [website, trang web]
          all: [thông tin liên hệ, thong tin lien he]
    strategy: student_service_lookup
    response_intent: office_query
    target_chunk_types: [office_directory]
    matching:
      min_confidence: 0.62
      ambiguity_margin: 0.08

  office:
    data_category: directory_table
    presentation_type: contact_card
    description: "Tra danh bạ và dịch vụ tổng quát. Trách nhiệm theo quy chế, quy định, thủ tục hoặc biểu mẫu dùng RAG."
    intents: [contact]
    default_intent: contact
    required_slots:
      contact: [office, requested_field]
    slot_schema:
      office: {type: string}
      requested_field:
        type: string
        enum: [phone, email, office, website, services, all]
        span_aliases:
          phone: [số điện thoại, so dien thoai, điện thoại, dien thoai, phone]
          email: [email, thư điện tử, thu dien tu]
          office: [địa chỉ, dia chi, phòng làm việc, phong lam viec]
          website: [website, trang web]
          services: [dịch vụ, dich vu, hỗ trợ gì, ho tro gi]
          all: [thông tin liên hệ, thong tin lien he, liên hệ, lien he]
    strategy: office_lookup
    response_intent: office_query
    target_chunk_types: [office_directory]
    matching:
      min_confidence: 0.72
      ambiguity_margin: 0.08

  faculty:
    data_category: directory_table
    presentation_type: contact_card
    description: Tra email, số điện thoại, website hoặc địa chỉ của một Khoa cụ thể; không dùng cho câu hỏi danh sách ngành.
    intents: [contact]
    default_intent: contact
    required_slots:
      contact: [faculty, requested_field]
    slot_schema:
      faculty: {type: string}
      requested_field:
        type: string
        enum: [phone, email, office, website, all]
        span_aliases:
          phone: [số điện thoại, so dien thoai, điện thoại, dien thoai, phone]
          email: [email, thư điện tử, thu dien tu]
          office: [địa chỉ, dia chi, văn phòng, van phong]
          website: [website, trang web]
          all: [thông tin liên hệ, thong tin lien he, liên hệ, lien he]
    strategy: faculty_lookup
    response_intent: faculty_query
    target_chunk_types: [faculty_program_directory]
    matching:
      min_confidence: 0.72
      ambiguity_margin: 0.08

  program:
    data_category: directory_table
    presentation_type: table
    description: Tra ngành đào tạo, khoa phụ trách, danh sách ngành, mô tả chương trình và đầu ra/cơ hội nghề nghiệp.
    intents: [direct_value, list_items, exists]
    required_slots:
      direct_value: [program_or_faculty, requested_field]
      list_items: [scope]
      exists: [program_or_faculty]
    slot_schema:
      program_or_faculty: {type: string}
      requested_field:
        type: string
        enum: [faculty, programs, exists, all]
      scope:
        type: string
        enum: [school, faculty]
        grounding_intents: [list_items]
        span_aliases:
          school: [các ngành của trường, cac nganh cua truong, những ngành của trường, nhung nganh cua truong, toàn trường, toan truong, trường có những ngành, truong co nhung nganh]
          faculty: [khoa]
    strategy: program_lookup
    response_intent: faculty_query
    target_chunk_types: [program_directory]

  formula:
    presentation_type: table
    description: "Cách tính/quan hệ toán học: điểm học bổng từ điểm học tập và rèn luyện=scholarship_score; GPA có trọng số=gpa_weighted_average. Không dùng cho mức tiền, điều kiện hay xếp loại học bổng."
    intents: [formula]
    required_slots:
      formula: [formula_type]
    slot_schema:
      formula_type:
        type: string
        enum: [scholarship_score, gpa_weighted_average]
    strategy: formula_lookup
    response_intent: formula_query
    target_chunk_types: [structured_lookup]

rag_intents:
  policy: [regulation]
  procedure: [regulation]
  consequence_or_exception: [regulation]
  open_question: [regulation, office_directory, program_directory]
  mixed: [regulation, office_directory]
