# Planner probes for QueryPlan.social (prompt v63, normalizer v36), 2026-10-19.
# Written before any run. Not answer gold and not a hold-out. This is the only
# live check of the change: by the owner's budget decision no official suite
# was rerun.
#
# expected: accepted outcomes of the normalized plan:
#   greeting | thanks | about_bot  -> social reply, no tasks
#   ood                            -> out_of_domain, no tasks
#   tasks                          -> a normal plan with at least one task
#
# Results (gpt-6-luna medium, prompt v63, normalizer v36, one run, 2026-10-19):
# 17/20. All 15 clear cases pass: 9 social, 3 mixed planned normally (rag,
# structured, structured), 3 out of domain. Borderline: so16 about_bot, so17
# ood (pass); so18 "bạn giỏi quá" -> about_bot (a fitting reply the expected
# list left out); so19 "tạm biệt nhé" -> one RAG task (no farewell kind
# exists, so a goodbye searches the handbook); so20 "ok" -> clarify.
# About 10,220 input and 80-270 output tokens per call; about $0.022 for the
# 20 calls at $0.10/$0.50 per million tokens, cache discount not counted.
version: 1
cases:
  # Whole social queries.
  - {id: so01, cohort: K51, query: "Xin chào", expected: [greeting]}
  - {id: so02, cohort: K50, query: "chào bạn", expected: [greeting]}
  - {id: so03, cohort: K49, query: "hello", expected: [greeting]}
  - {id: so04, cohort: K51, query: "Chào buổi sáng ạ", expected: [greeting]}
  - {id: so05, cohort: K51, query: "Cảm ơn bạn nhé", expected: [thanks]}
  - {id: so06, cohort: K50, query: "thanks nha", expected: [thanks]}
  - {id: so07, cohort: K51, query: "cám ơn nhiều ạ, mình hiểu rồi", expected: [thanks]}
  - {id: so08, cohort: K51, query: "Bạn là ai vậy?", expected: [about_bot]}
  - {id: so09, cohort: K50, query: "Bạn trả lời dựa trên nguồn nào?", expected: [about_bot]}
  # A greeting or thanks together with a real question plans normally.
  - {id: so10, cohort: K51, query: "Chào bạn, cho em hỏi học bổng khuyến khích học tập xét thế nào?", expected: [tasks]}
  - {id: so11, cohort: K50, query: "Cảm ơn nha, vậy 85 điểm rèn luyện thì xếp loại gì?", expected: [tasks]}
  - {id: so12, cohort: K51, query: "Hi, email Phòng Đào tạo là gì vậy?", expected: [tasks]}
  # Clearly outside the handbook stays out of domain.
  - {id: so13, cohort: K51, query: "Thời tiết hôm nay thế nào?", expected: [ood]}
  - {id: so14, cohort: K51, query: "Viết giúp mình một bài thơ về mùa thu", expected: [ood]}
  - {id: so15, cohort: K50, query: "Giá vàng hôm nay bao nhiêu?", expected: [ood]}
  # Borderline: more than one reading is acceptable.
  - {id: so16, cohort: K51, query: "Bạn giúp được gì?", expected: [about_bot]}
  - {id: so17, cohort: K51, query: "hôm nay buồn quá", expected: [ood, greeting]}
  - {id: so18, cohort: K51, query: "bạn giỏi quá", expected: [thanks, ood]}
  - {id: so19, cohort: K50, query: "tạm biệt nhé", expected: [thanks, greeting, ood]}
  - {id: so20, cohort: K51, query: "ok", expected: [thanks, greeting, ood]}
