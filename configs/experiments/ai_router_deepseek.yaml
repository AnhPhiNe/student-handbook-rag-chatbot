# Planner A/B experiment: DeepSeek V4.1 Flash against the Groq Qwen baseline.
# Select with STUDENT_RAG_ROUTER_CONFIG=configs/experiments/ai_router_deepseek.yaml
# and pick the thinking level with STUDENT_RAG_ROUTER_REASONING_EFFORT (none | low).
provider: deepseek
model_name: deepseek-flash
reasoning_effort: none
# DeepSeek has no native JSON Schema mode: json_object embeds the schema in the
# prompt, and normalize_query_plan validates the result as it does for Groq.
response_format: json_object
temperature: 0.0
# Experiment only: omit max_tokens in the DeepSeek API request. The provider
# applies its own default, NOT an unlimited output budget. The numeric token
# settings below remain local estimates and apply only when this flag is false.
omit_max_tokens: true
max_output_tokens: 768
output_tokens_per_task: 640
hard_max_output_tokens: 2048
# Keep the timeout fixed for the token-policy comparison; timeouts remain possible.
request_timeout_seconds: 20
max_retries: 1
cache_enabled: false
cache_path: data/cache/deepseek_router_cache.json

key_pool:
  # DeepSeek limits concurrent requests per account, not tokens per key.
  rpm_limit_per_key: 600
  rpd_limit_per_key: null
  tpm_limit_per_key: null
  tpd_limit_per_key: null
  cooldown_seconds: 30
  state_path: data/cache/deepseek_router_key_state.json
  wait_when_limited: false
