  dap_an_nhap: "Ngành Công nghệ Thông tin thuộc Khoa Công nghệ – Thông tin quản lý. Thông tin liên hệ của khoa như sau:\n- Số điện thoại liên lạc: (028) 38352020 (số nội bộ: 209, 210)\n- Email: khoacntt@hcmue.edu.vn\n- Website: khoacntt.hcmue.edu.vn\n- Văn phòng làm việc: Nhà B, tầng 5, P.506, P.507, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM."
