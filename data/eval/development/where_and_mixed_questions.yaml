# "Where / whom" questions and questions needing a table and a rule together.
#
# Purpose: check a narrow registry change. The student_service and office
# descriptions said "thủ tục ... dùng RAG", so "nộp hồ sơ ... ở đâu" went to the
# service catalog in only 22 of 42 runs of table_adjacent_questions.yaml
# (2026-09-29). The change says that asking which unit or where to do something
# uses the catalog, and "thủ tục" means what a procedure involves.
#
# Development data, not a hold-out: written 2026-09-29 by the AI assistant from
# the K51 service and office catalogs and the handbook text, before any run of
# the changed registry; not independently reviewed. official_v3 was not read.
#
# Groups:
#   n  where / whom (answer suite): route directory; must_include is a contact
#      from the catalog. n11-n14 name the unit (office lookup). n15 also asks
#      what the dossier holds, so it also needs the handbook text.
#   p  table plus rule (planner only, not answered): the table alone does not
#      hold the whole answer. expect_rag: a RAG task must be present for the
#      answer to be complete. These check overlaps #3 (scholarship) and #4
#      (foreign language) before anything is changed for them.
#
# Each question is planned 3 times; the n group is also answered 3 times.
version: 1
cases:
  - {id: n01, cohort: K51, route: directory, query: "Muốn xin giấy chứng nhận điểm để làm hồ sơ học bổng thì lên phòng nào?", must_include: ["phongkhaothi@hcmue.edu.vn"]}
