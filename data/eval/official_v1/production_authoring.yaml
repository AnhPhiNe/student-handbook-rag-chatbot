  - "B và C+ lần lượt được mấy điểm hệ 4?"
  - "Học bổng mức giỏi tính theo hệ số nào?"
  - "Địa chỉ email Khoa Ngữ văn của trường là gì?"
  - "Ngành Công tác xã hội thuộc khoa quản lý nào?"
  - "Công thức tính GPA có tính tới tín chỉ ra sao?"
  - "TOEIC bốn kỹ năng bậc 3 với bậc 4 yêu cầu điểm từng kỹ năng ra sao?"
