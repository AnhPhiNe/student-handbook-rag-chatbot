- phieu: V4-193
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em là sinh viên sư phạm K49, đợt này em đang tìm hiểu các quy định liên quan đến tiền hỗ trợ học phí và chi phí sinh hoạt. Em nghe bảo sau khi tốt nghiệp thì hằng năm mình phải làm báo cáo việc làm gửi về cho cơ quan chức năng thì mới không bị thu hồi tiền hỗ trợ, mà em chưa rõ cụ thể thời hạn là ngày nào trong năm và gửi cho ai. Đối với sinh viên K48-K49 thì quy định báo cáo việc làm sau tốt nghiệp này như thế nào ạ?"
    - vai: tro_ly
      noi_dung: "Đối với K48-K49, sau khi có quyết định công nhận tốt nghiệp, định kỳ trước ngày 31 tháng 12 hằng năm của năm tiếp theo cho đến năm đủ thời gian không phải thực hiện nghĩa vụ bồi hoàn, sinh viên phải báo cáo tình hình việc làm của bản thân (Mẫu số 02 tại Phụ lục kèm Nghị định) tới cơ quan thu hồi kinh phí bồi hoàn để thông báo xóa hoặc thu hồi khoản kinh phí hỗ trợ."
    - vai: sinh_vien
      noi_dung: "Dạ em hiểu rồi, thế còn khóa K51 thì sao ạ?"
  dap_an_nhap: "Đối với khóa K51, sau khi có quyết định công nhận tốt nghiệp, định kỳ trước ngày 31 tháng 12 hằng năm của năm tiếp theo cho đến năm đủ thời gian không phải thực hiện nghĩa vụ bồi hoàn kinh phí hỗ trợ quy định tại điểm a khoản 2 Điều 6 Nghị định 116, sinh viên phải báo cáo tình hình việc làm của bản thân theo Mẫu số 02 Phụ lục ban hành kèm theo Nghị định 116 tới cơ quan theo dõi, hướng dẫn, ra thông báo thu hồi kinh phí nơi sinh viên thường trú hoặc cơ quan giao nhiệm vụ, đặt hàng (đối với sinh viên thuộc đối tượng giao nhiệm vụ, đặt hàng) để thông báo xóa hoặc thu hồi khoản kinh phí hỗ trợ."
  y_bat_buoc:
