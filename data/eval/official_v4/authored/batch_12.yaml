  dap_an_nhap: "Sổ tay sinh viên không có thông tin về danh tính giảng viên phụ trách từng lớp học phần cụ thể cũng như số điện thoại cá nhân của giảng viên. Bạn vui lòng xem thông tin trên thời khóa biểu ở cổng thông tin sinh viên hoặc liên hệ ban cán sự lớp để xin kênh liên lạc phù hợp."
