# Gold adjustments made before any system run (AUTHORING_LOG.md).
# The authored YAML stays as Gemini wrote it; these entries replace the named
# fields when v4 is converted to the runner's case format. Questions are not
# changed here, except where the cohort migration below requires it (a cohort
# label, a school year, or an earlier assistant turn that quoted the K48
# handbook); each such change is a `replace` pair with its reason.
#
# A case entry may hold `y_bat_buoc` (the required facts, replaced whole) and
# `replace` (exact [old, new] pairs applied to the turns, the required facts and
# the ground truth; every `old` must occur).

# Cohort migration (2026-10-13). The K48-K49 cohort was built from the K48
# handbook (2022 – 2023); the K49 handbook (2023 – 2024) replaces it and K48 is
# no longer served. Every case drawn for K48-K49 now targets K49: the ticket
# cohort and compare cohort, then, in the turns, the required facts and the
# ground truth, the label "K48-K49" and afterwards "K48" become "K49". A cited
# article moves to the K49 parent with the same id (an `id_prefixes` prefix
# becomes K49_) unless `parents` names another one. Every gold was re-checked against
# the K49 PDF; those whose facts changed are under `cases` with the reason.
cohort_migration:
  from: K48-K49
  to: K49
  id_prefixes: [K48_49_, K48-K49_]
  labels:
    - [K48-K49, K49]
    - [K48, K49]
  parents:
    # K48 printed a "Phiếu" whose part N was parent Phan N; K49 prints the
    # K50-style frame, whose Phan1 is the title, so part N is Phan N+1.
    K48-K49_PhieuDanhGiaRenLuyen_Phan1: K49_KhungDiemDanhGiaRenLuyen_Phan2
    K48-K49_PhieuDanhGiaRenLuyen_Phan2: K49_KhungDiemDanhGiaRenLuyen_Phan3
    K48-K49_PhieuDanhGiaRenLuyen_Phan3: K49_KhungDiemDanhGiaRenLuyen_Phan4
    K48-K49_PhieuDanhGiaRenLuyen_Phan4: K49_KhungDiemDanhGiaRenLuyen_Phan5
    K48-K49_PhieuDanhGiaRenLuyen_Phan5: K49_KhungDiemDanhGiaRenLuyen_Phan6
    # K48 printed the 2014 adviser rules; K49 prints Quyết định 3738/2022, where
    # the adviser's tasks and class meetings are Điều 4 (Trách nhiệm).
    K48_49_QuyDinhCongTacCoVanHocTap_Chuong2_Dieu3: K49_QuyDinhCongTacCoVanHocTap_Chuong2_Dieu4
    K48_49_QuyDinhCongTacCoVanHocTap_Chuong3_Dieu6: K49_QuyDinhCongTacCoVanHocTap_Chuong2_Dieu4

cases:
  V4-104:
    reason: >-
      The K51 handbook lists two branch faculties with nearly the same name:
      "Khoa Khoa học – Tự nhiên" (Long An branch) and "Khoa Khoa học Tự nhiên"
      (Gia Lai branch). The question names neither branch, so the gold's
      Gia Lai address alone is too narrow. The system's runtime directories
      leave out both branches (main campus only), so the expected answer is
      that the main-campus directory has no such faculty.
    y_bat_buoc:
      - >-
        Địa chỉ văn phòng khoa: chấp nhận nói rằng danh bạ cơ sở chính không có
        khoa này (hoặc khoa này thuộc phân hiệu), hỏi lại sinh viên học ở phân hiệu
        nào, hoặc nêu địa chỉ Gia Lai (Văn phòng Khoa – Nhà K, Số 126 Lê Thánh Tôn,
        phường Diên Hồng, tỉnh Gia Lai) hay Long An (Khu Hiệu bộ, Số 934, Quốc lộ
        1A, phường Khánh Hậu, tỉnh Tây Ninh). Sai nếu đưa địa chỉ của một khoa khác
        ở cơ sở chính như thể đó là khoa được hỏi
      - "Bước 1: CVHT thông báo cho lớp trưởng về quy trình, thời gian chấm ĐRL"
      - "Bước 2: Sinh viên tự đánh giá kèm minh chứng gửi BCS lớp"
      - "Bước 3: BCS lớp, BCH Chi đoàn, BCH Chi hội, CVHT chấm lại điểm"
      - "Bước 4: Họp lớp thông qua (trên 50% ý kiến đồng ý, có biên bản), nộp hồ sơ lên Hội đồng cấp cơ sở"
      - "Bước 5: Hội đồng cấp cơ sở (khoa, phân hiệu) họp xét, báo cáo Trưởng đơn vị thông qua, trình lên Hội đồng cấp Trường"
      - "Bước 6: Hội đồng cấp Trường họp xét trình Hiệu trưởng quyết định công nhận"
      - "Bước 7: Công bố công khai trước 20 ngày trước khi ban hành quyết định chính thức và cập nhật phần mềm"

  V4-172:
    reason: >-
      The gold answers from Điều 4 of the conduct rules, which binds staff
      (viên chức, người lao động), and presents it as the students' rule. The
      same document has a students' dress rule, Điều 12 (Quy định về trang
      phục, người học), identical in K50 and K51. The no-smoking rule appears
      only in Điều 4 but covers the whole campus.
    y_bat_buoc:
      - "quy định giữa K50 và K51 là giống nhau (hoặc không có sự khác biệt)"
      - >-
        Trang phục: chấp nhận Điều 12 cho người học (gọn gàng, lịch sự, kín đáo,
        phù hợp thuần phong mỹ tục; đeo thẻ sinh viên) hoặc Điều 4 cho viên chức,
        người lao động (gọn gàng, lịch sự, đi giày hoặc dép có quai hậu; đeo thẻ,
        biển tên), hoặc cả hai
      - "không hút thuốc lá (kể cả thuốc lá điện tử) trong khuôn viên Trường"

  V4-211:
    reason: >-
      The student asks only whether staff may use public property for private
      work. The gold also requires the rest of the same clause (not acting in
      the institution's name, building a green workplace), which the question
      does not ask for; a correct "no" answer would fail on them.
    y_bat_buoc:
      - "không được sử dụng tài sản, trang thiết bị, phương tiện công để làm việc riêng"

  V4-082:
    reason: >-
      The gold answers from the list of school-level conduct files (Phụ lục 2,
      mục III), which names "Quyết định tạm nghỉ học, buộc thôi học" without
