- phieu: V4-076
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Trong công tác quản lý sinh viên thì công tác hành chính gồm những nội dung cụ thể nào vậy ạ?"
  dap_an_nhap: "Công tác hành chính trong quản lý sinh viên bao gồm: tổ chức tiếp nhận thí sinh trúng tuyển, sắp xếp, bố trí sinh viên vào các lớp; chỉ định Ban cán sự lớp (lớp trưởng, lớp phó) lâm thời, làm thẻ sinh viên; thống kê, tổng hợp dữ liệu và quản lý, lưu trữ hồ sơ liên quan đến sinh viên; giải quyết các công việc hành chính có liên quan đến sinh viên.[cite: 2]"
  y_bat_buoc:
    - "tiếp nhận thí sinh trúng tuyển, sắp xếp, bố trí sinh viên vào các lớp[cite: 2]"
    - "chỉ định Ban cán sự lớp (lớp trưởng, lớp phó) lâm thời, làm thẻ sinh viên[cite: 2]"
    - "thống kê, tổng hợp dữ liệu và quản lý, lưu trữ hồ sơ liên quan đến sinh viên[cite: 2]"
    - "giải quyết các công việc hành chính có liên quan đến sinh viên[cite: 2]"
  nguon:
    - "Đ25: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 5[cite: 2]"
  hanh_vi: tra_loi
  ghi_chu: "Đoạn Đ25 không nêu hệ quả vi phạm hay trường hợp ngoại lệ, chuyển sang hỏi nội dung quy định (nội dung công tác hành chính trong quản lý sinh viên)."
