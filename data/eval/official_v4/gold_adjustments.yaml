      regulation): weak or poor in two consecutive semesters.
    y_bat_buoc:
      - "Xếp loại rèn luyện yếu, kém hai học kỳ liên tiếp: phải tạm ngừng học (tạm dừng tiến độ học tập) ít nhất một học kỳ ở học kỳ tiếp theo"
      - "Yếu, kém hai học kỳ liên tiếp lần thứ hai: bị buộc thôi học"

