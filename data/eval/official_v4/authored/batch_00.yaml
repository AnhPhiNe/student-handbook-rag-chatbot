- phieu: V4-196
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu, theo quy định bên K50 thì kế hoạch hoạt động NCKH của sinh viên bao gồm những nội dung nào z ad?"
    - vai: tro_ly
      noi_dung: "Theo Điều 6, kế hoạch hoạt động NCKH của sinh viên K50 gồm các nội dung:\na) Xác định danh mục đề tài, giao đề tài, triển khai thực hiện đề tài và tổ chức đánh giá đề tài NCKH của sinh viên theo quy định chung của Bộ Giáo dục và Đào tạo và của Trường;\nb) Tổ chức hội nghị NCKH của sinh viên và các hình thức hoạt động khoa học và công nghệ khác của sinh viên;\nc) Tham gia “Giải thưởng khoa học và công nghệ dành cho sinh viên trong cơ sở giáo dục đại học” và các giải thưởng khác dành cho sinh viên;\nd) Tổ chức triển khai ứng dụng tiến bộ khoa học và công nghệ vào thực tiễn trong các lĩnh vực giáo dục và đào tạo, kinh tế – xã hội, an ninh, quốc phòng;\nđ) Tổ chức hoạt động thông tin khoa học và công nghệ của sinh viên."
    - vai: sinh_vien
      noi_dung: "Dạ vậy còn bên K51 thì sao ad?"
  dap_an_nhap: "Đối với khóa K51, quy định về nội dung kế hoạch hoạt động NCKH của sinh viên cũng hoàn toàn tương tự khóa K50 (theo Điều 6), bao gồm:\na) Xác định danh mục đề tài, giao đề tài, triển khai thực hiện đề tài và tổ chức đánh giá đề tài NCKH của sinh viên theo quy định chung của Bộ Giáo dục và Đào tạo và của Trường;\nb) Tổ chức hội nghị NCKH của sinh viên và các hình thức hoạt động khoa học và công nghệ khác của sinh viên;\nc) Tham gia “Giải thưởng khoa học và công nghệ dành cho sinh viên trong cơ sở giáo dục đại học” và các giải thưởng khác dành cho sinh viên;\nd) Tổ chức triển khai ứng dụng tiến bộ khoa học và công nghệ vào thực tiễn trong các lĩnh vực giáo dục và đào tạo, kinh tế – xã hội, an ninh, quốc phòng;\nđ) Tổ chức hoạt động thông tin khoa học và công nghệ của sinh viên."
  y_bat_buoc:
    - "Nội dung kế hoạch NCKH của sinh viên K51 quy định giống K50"
    - "Xác định danh mục đề tài, giao đề tài, triển khai thực hiện đề tài và tổ chức đánh giá đề tài NCKH của sinh viên theo quy định chung của Bộ Giáo dục và Đào tạo và của Trường"
    - "Tổ chức hội nghị NCKH của sinh viên và các hình thức hoạt động khoa học và công nghệ khác của sinh viên"
    - "Tham gia “Giải thưởng khoa học và công nghệ dành cho sinh viên trong cơ sở giáo dục đại học” và các giải thưởng khác dành cho sinh viên"
    - "Tổ chức triển khai ứng dụng tiến bộ khoa học và công nghệ vào thực tiễn trong các lĩnh vực giáo dục và đào tạo, kinh tế – xã hội, an ninh, quốc phòng"
    - "Tổ chức hoạt động thông tin khoa học và công nghệ của sinh viên"
  nguon:
