- phieu: V4-018
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào phòng đào tạo, em tốt nghiệp cao đẳng xong thì trúng tuyển liên thông lên đại học hệ chính quy của trường mình. Do hoàn cảnh gia đình kỳ này em phải đi làm thêm nhiều nên tính giãn tiến độ ra một chút để đỡ áp lực. Em có biết thời gian đào tạo chuẩn của chương trình liên thông từ cao đẳng lên đại học là 1,5 năm, nhưng không rõ trường cho phép sinh viên học tối đa bao nhiêu năm để em liệu sắp xếp kế hoạch học tập ạ?"
  dap_an_nhap: "Theo quy chế đào tạo đối với hình thức chính quy, chương trình đào tạo liên thông từ trình độ cao đẳng lên trình độ đại học có thời gian học tập chuẩn là 1,5 năm học và thời gian học tập tối đa là 3 năm học."
  y_bat_buoc:
    - "Thời gian học tập chuẩn: 1,5 năm học"
    - "Thời gian học tập tối đa: 3 năm học"
    - "Đào tạo liên thông từ trình độ cao đẳng lên trình độ đại học (chính quy)"
  nguon:
