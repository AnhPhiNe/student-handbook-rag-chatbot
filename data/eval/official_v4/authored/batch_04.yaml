- phieu: V4-013
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho e hoi e hoc he chinh quy biet thoi gian hoc chuan la 4 nam roi, the thoi gian hoc tap toi da la may nam ak"
  dap_an_nhap: "Thời gian học tập tối đa đối với hình thức đào tạo chính quy là 06 năm học (thời gian học tập chuẩn toàn khóa là 04 năm học)[cite: 1]."
  y_bat_buoc:
    - "06 năm học"
    - "Chính quy"
  nguon:
    - "Đ1: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3[cite: 1]"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-016
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Chào thầy cô ạ, em trước đây tốt nghiệp trung cấp mầm non rồi đi dạy ở trường tư thục được vài năm, đợt này em vừa trúng tuyển vào học liên thông từ trung cấp lên đại học hệ chính quy của trường mình. Do em vừa đi học vừa phải đi làm thêm vào buổi tối, lại đang chăm sóc mẹ già ở quê hay đau ốm nên em rất lo lắng không biết có thể theo kịp chương trình đúng hạn hay không. Em tìm hiểu thì được biết thời gian đào tạo chuẩn của chương trình liên thông từ trung cấp lên đại học này là 2,5 năm rồi, nhưng em muốn hỏi là trong trường hợp hoàn cảnh khó khăn cần kéo dài thời gian học thì nhà trường quy định thời gian học tập tối đa cho chương trình này là bao nhiêu năm ạ?"
  dap_an_nhap: "Đối với chương trình đào tạo liên thông từ trình độ trung cấp lên trình độ đại học (hình thức chính quy), thời gian học tập chuẩn là 2,5 năm học và thời gian học tập tối đa là 5 năm học[cite: 1]."
  y_bat_buoc:
    - "5 năm học"
    - "Đào tạo liên thông từ trình độ trung cấp lên trình độ đại học"
  nguon:
    - "Đ2: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3[cite: 1]"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-017
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ cho em hỏi, em học theo hình thức vừa làm vừa học, em biết thời gian học chuẩn là 05 năm rồi thì thời gian học tập tối đa được cho phép là mấy năm ạ?"
  dap_an_nhap: "Đối với hình thức đào tạo vừa làm vừa học, thời gian học tập chuẩn là 05 năm học và thời gian học tập tối đa là 7,5 năm học[cite: 1]."
  y_bat_buoc:
    - "7,5 năm học"
    - "Vừa làm vừa học"
  nguon:
    - "Đ1: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3[cite: 1]"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-151
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô, em có mấy câu hỏi sau nhờ thầy cô giải đáp giúp em ạ:\n1. Sinh viên muốn xin thôi học thì cần đáp ứng những điều kiện gì?\n2. Cho em xin số điện thoại liên hệ của Khoa Tiếng Nga với ạ.\n3. Nếu sinh viên đại học bị xếp loại rèn luyện yếu hoặc kém trong 2 học kỳ liên tiếp thì bị xử lý ra sao?\n4. Nhà trường quy định về quyền khiếu nại khen thưởng, kỷ luật của sinh viên như thế nào ạ?\n5. Chương trình đào tạo đại học cấp bằng thứ nhất hệ chính quy có thời gian chuẩn là 4 năm thì thời gian học tối đa là mấy năm ạ?"
  dap_an_nhap: "1. Sinh viên được phép thôi học nếu có đơn xin thôi học với lý do rõ ràng, hợp lệ và bồi hoàn đầy đủ kinh phí đào tạo[cite: 1].\n2. Số điện thoại liên lạc của Khoa Tiếng Nga là (028) 38352020 (số nội bộ: 129, 130)[cite: 1].\n3. Sinh viên trình độ đại học bị xếp loại rèn luyện yếu, kém trong hai học kỳ liên tiếp thì phải tạm ngừng học ít nhất một học kỳ ở học kỳ tiếp theo (nếu bị xếp loại rèn luyện yếu, kém hai học kỳ liên tiếp lần thứ hai thì sẽ bị buộc thôi học)[cite: 1].\n4. Về quyền khiếu nại: Cá nhân và tập thể sinh viên nếu xét thấy các hình thức khen thưởng và kỷ luật không thỏa đáng có quyền khiếu nại lên Hiệu trưởng hoặc nếu Hiệu trưởng đã xem xét lại mà chưa thỏa đáng có thể khiếu nại lên cấp có thẩm quyền theo quy định của pháp luật về khiếu nại, tố cáo[cite: 1].\n5. Đối với chương trình đào tạo đại học cấp bằng thứ nhất (hình thức chính quy), thời gian học tập chuẩn là 4 năm học và thời gian học tập tối đa là 8 năm học[cite: 1]."
  y_bat_buoc:
    - "đơn xin thôi học với lý do rõ ràng, hợp lệ"
    - "bồi hoàn đầy đủ kinh phí đào tạo"
    - "(028) 38352020"
    - "129"
    - "130"
    - "tạm ngừng học ít nhất một học kỳ ở học kỳ tiếp theo"
    - "khiếu nại lên Hiệu trưởng"
    - "khiếu nại lên cấp có thẩm quyền theo quy định của pháp luật về khiếu nại, tố cáo"
    - "8 năm học"
  nguon:
    - "Đ3: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 31[cite: 1]"
    - "Đ4: Danh bạ trong Sổ tay sinh viên K50, Mục 11 Khoa Tiếng Nga[cite: 1]"
    - "Đ5: Quy chế đánh giá kết quả rèn luyện của sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 14[cite: 1]"
    - "Đ6: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 38[cite: 1]"
    - "Đ2: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3[cite: 1]"
  hanh_vi: tra_loi
  ghi_chu: "Yêu cầu 3: Đoạn Đ5 không có thủ tục, chuyển sang hỏi hệ quả khi sinh viên trình độ đại học bị xếp loại rèn luyện yếu, kém hai học kỳ liên tiếp."

- phieu: V4-152
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào thầy cô, em có mấy thắc mắc mong được giải đáp giúp em ạ:\n1. Sinh viên đang trong thời gian bị kỷ luật ngừng học hoặc phải học lại thì có được hưởng chính sách miễn, giảm học phí không?\n2. Sinh viên chính quy bị buộc thôi học trong các trường hợp nào ạ?\n3. Em học chính quy, biết thời gian chuẩn là 04 năm học rồi thì thời gian học tập tối đa là bao nhiêu năm?\n4. Công thức tính điểm xét học bổng khuyến khích học tập là gì, nếu điểm học tập của em là 3.6 và điểm rèn luyện là 90 thì điểm học bổng tính ra bao nhiêu?\n5. Đối với học bổng loại Xuất sắc thì mức học bổng được tính theo hệ số mấy nhân với định mức học phí một tín chỉ ạ?"
  dap_an_nhap: "1. Không áp dụng chính sách miễn, giảm học phí đối với trường hợp sinh viên trong thời gian bị kỷ luật ngừng học hoặc buộc thôi học, học lại, học bổ sung (cũng như sinh viên đang hưởng lương và sinh hoạt phí đi học)[cite: 1].\n2. Sinh viên đào tạo chính quy bị buộc thôi học trong các trường hợp sau: Bị cảnh báo học tập 03 lần liên tiếp trong một khóa học; Bị cảnh báo học tập đến lần thứ tư tính từ đầu khóa; hoặc Thời gian học tập vượt quá giới hạn tối đa quy định tại Điều 3[cite: 1].\n3. Đối với hình thức đào tạo chính quy, thời gian học tập chuẩn toàn khóa là 04 năm học và thời gian học tập tối đa là 06 năm học[cite: 1].\n4. Điểm học bổng được tính theo công thức: Điểm học bổng = (Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100 (trong đó Điểm rèn luyện / 25 là quy đổi về thang điểm 4)[cite: 1]. Với điểm học tập là 3.6 và điểm rèn luyện là 90: Điểm học bổng = (3.6 x 80 + 90 / 25 x 20) / 100 = (288 + 3.6 x 20) / 100 = 3,60[cite: 1].\n5. Mức học bổng loại Xuất sắc được tính theo công thức: Số tín chỉ x định mức học phí 01 tín chỉ x 1,5 (hệ số nhân là 1,5)[cite: 1]."
  y_bat_buoc:
    - "Không áp dụng chính sách miễn, giảm học phí đối với trường hợp"
    - "kỷ luật ngừng học"
    - "học lại"
    - "Bị cảnh báo học tập 03 lần liên tiếp trong một khóa học"
    - "Bị cảnh báo học tập đến lần thứ tư tính từ đầu khóa"
    - "Thời gian học tập vượt quá giới hạn tối đa"
    - "06 năm học"
    - "(Điểm học tập x 80 + Điểm rèn luyện / 25 x 20) / 100"
    - "3,6"
    - "1,5"
  nguon:
    - "Đ7: Thông báo về việc thực hiện chính sách miễn, giảm học phí cho sinh viên hệ chính quy năm học 2025 – 2026, Mục III. Quy định khác[cite: 1]"
    - "Đ8: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 12[cite: 1]"
    - "Đ1: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3[cite: 1]"
    - "Đ9: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27[cite: 1]"
  hanh_vi: tra_loi
  ghi_chu: "Yêu cầu 2: Đoạn Đ8 không có thủ tục cụ thể, chuyển sang hỏi các trường hợp sinh viên bị buộc thôi học."

- phieu: V4-154
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Kính chào quý thầy cô Phòng Đào tạo và Công tác sinh viên ạ. Em là sinh viên K51, vừa rồi gia đình em ở quê có chuyện buồn và em cũng phải nằm viện mất cả tuần do sốt xuất huyết nên việc học kỳ vừa qua bị gián đoạn và gặp nhiều trục trặc quá. Em có mấy chuyện cần hỏi nhờ thầy cô hướng dẫn giúp em:\nThứ nhất là về môn học đại cương thuộc nhóm nền tảng chung, vừa rồi thi xong em được tổng kết 4,5 điểm thang điểm 10, em biết mức điểm này là Đạt rồi nhưng không biết quy đổi sang thang điểm chữ thì tương ứng với chữ gì ạ?\nThứ hai, em có đứa bạn thân cùng phòng trọ học bên Khoa Giáo dục Đặc biệt đợt này đang nhờ em liên hệ hỏi việc học tập giùm vì bạn ấy đang về quê điều trị bệnh, thầy cô cho em xin số điện thoại liên lạc của Khoa Giáo dục Đặc biệt với ạ.\nThứ ba, anh trai em đang tính đăng ký học đại học theo hình thức vừa làm vừa học của trường mình, anh ấy biết thời gian học chuẩn là 05 năm học nhưng do tính chất công việc hay phải đi công tác xa nên anh muốn biết thời gian học tập tối đa cho hình thức này là bao nhiêu năm để tính toán lộ trình.\nThứ tư là sang kỳ tới em sợ một số học phần chuyên ngành ít bạn đăng ký, thầy cô cho em hỏi nếu lớp học phần có số lượng sinh viên đăng ký ít hơn quy định tối thiểu thì trường xử lý thế nào và sinh viên chúng em cần phải làm gì?\nCuối cùng là em và một vài bạn trong nhóm đang muốn rèn luyện nghiệp vụ sư phạm trước, chúng em muốn tìm chỗ để tập giảng, kiến tập và thực hành giảng dạy tại các phòng học thông minh, phòng học ảo của trường thì chúng em nên liên hệ đơn vị nào, địa chỉ ở đâu và liên lạc qua số điện thoại nào ạ?\nEm xin chân thành cảm ơn thầy cô!"
  dap_an_nhap: "1. Đối với các học phần giáo dục đại cương hay còn gọi là học phần chung thuộc nhóm học phần nền tảng, thang điểm 10 từ 4,0 - 4,7 (loại Đạt) được quy đổi sang thang điểm chữ là D[cite: 1]. Điểm 4,5 của bạn quy đổi thành điểm D[cite: 1].\n2. Số điện thoại liên lạc của Khoa Giáo dục Đặc biệt là (028) 38352020, số máy nội bộ: 163, 164[cite: 1].\n3. Đối với hình thức đào tạo vừa làm vừa học, thời gian học tập chuẩn toàn khóa là 05 năm học và thời gian học tập tối đa là 7,5 năm học[cite: 1].\n4. Nếu số sinh viên đăng ký ít hơn quy định, lớp học phần sẽ không được tổ chức và sinh viên phải đăng ký chuyển sang học ở những lớp học phần khác mà Trường có tổ chức cho đủ số tín chỉ tối thiểu quy định trong học kỳ[cite: 1].\n5. Để tham gia các hoạt động tập giảng, kiến tập và thực tập giảng tại các phòng học trực tuyến, phòng học ảo và phòng học thông minh, bạn liên hệ: Trung tâm Phát triển kỹ năng sư phạm[cite: 1]; Địa chỉ: Nhà A, tầng 2, P.201, số 280 An Dương Vương, phường Chợ Quán, TP. HCM[cite: 1]; Điện thoại: (028) 38397868[cite: 1]; Email: trungtamptknsp@hcmue.edu.vn[cite: 1]."
  y_bat_buoc:
    - "D"
    - "4,0 - 4,7"
    - "(028) 38352020"
    - "163"
    - "164"
    - "7,5 năm học"
    - "lớp học phần sẽ không được tổ chức"
    - "đăng ký chuyển sang học ở những lớp học phần khác"
    - "Trung tâm Phát triển kỹ năng sư phạm"
    - "Nhà A, tầng 2, P.201, số 280 An Dương Vương, phường Chợ Quán, TP. HCM"
    - "(028) 38397868"
    - "trungtamptknsp@hcmue.edu.vn"
  nguon:
    - "Đ10: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10[cite: 1]"
    - "Đ11: Danh bạ trong Sổ tay sinh viên K51, Mục 18 Khoa Giáo dục Đặc biệt[cite: 1]"
    - "Đ1: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3[cite: 1]"
    - "Đ12: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 8[cite: 1]"
    - "Đ13: Danh bạ trong Sổ tay sinh viên K51[cite: 1]"
  hanh_vi: tra_loi
  ghi_chu: "Yêu cầu 4: Đoạn Đ12 không có thủ tục hành chính, chuyển sang hỏi việc sinh viên phải làm khi lớp học phần không đủ số lượng sinh viên tối thiểu để tổ chức."

- phieu: V4-155
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào thầy cô, em có mấy câu hỏi sau nhờ thầy cô giải đáp giúp em ạ:\n1. Nhà trường quy định về các trường hợp dừng cấp kinh phí hỗ trợ chi phí học tập đối với sinh viên dân tộc thiểu số thuộc hộ nghèo và hộ cận nghèo như thế nào?\n2. Quy định về việc liên kết đào tạo của trường mình như thế nào ạ?\n3. Trình tự và thủ tục xét khen thưởng đối với cá nhân và tập thể lớp có thành tích xuất sắc diễn ra như thế nào?\n4. Nếu điểm rèn luyện học kỳ của em đạt 85 điểm thì được xếp loại rèn luyện gì ạ?"
  dap_an_nhap: "1. Quy định về dừng cấp kinh phí hỗ trợ chi phí học tập đối với sinh viên dân tộc thiểu số thuộc hộ nghèo, hộ cận nghèo:\n- Sinh viên nếu học đồng thời ở nhiều khoa trong cùng một trường hoặc học ở nhiều trường khác nhau thì chỉ được hưởng hỗ trợ một lần[cite: 1];\n- Sinh viên bỏ học hoặc bị kỷ luật buộc thôi học thì không được nhận kinh phí hỗ trợ chi phí học tập kể từ thời điểm quyết định kỷ luật có hiệu lực[cite: 1];\n- Sinh viên bị đình chỉ học tập (có thời hạn) thì không được nhận kinh phí hỗ trợ chi phí học tập trong thời gian bị đình chỉ[cite: 1];\n- Sinh viên thuộc diện được hỗ trợ mà cùng một lúc được hưởng nhiều chính sách hỗ trợ có cùng tính chất thì chỉ được hưởng một chế độ ưu đãi cao nhất[cite: 1].\n2. Về liên kết đào tạo: Liên kết đào tạo chỉ thực hiện đối với hình thức đào tạo vừa làm vừa học theo quy định tại khoản 22 Điều 1 Luật sửa đổi, bổ sung một số điều của Luật Giáo dục đại học và được tổ chức thực hiện theo quy định về liên kết đào tạo của Trường Đại học Sư phạm Thành phố Hồ Chí Minh[cite: 1].\n3. Trình tự và thủ tục xét khen thưởng cá nhân và tập thể lớp xuất sắc:\n- Vào đầu năm học, Phòng CTCT và HSSV tổ chức cho sinh viên, các lớp sinh viên đăng ký danh hiệu thi đua cá nhân và tập thể lớp sinh viên[cite: 1];\n- Cuối năm học, Phòng CTCT và HSSV phối hợp với các khoa tiến hành thống kê danh sách sinh viên xuất sắc và tập thể lớp sinh viên có tỉ lệ giỏi, xuất sắc cao để xét khen thưởng[cite: 1];\n- Thủ tục xét: Căn cứ vào thành tích đạt được trong học tập và rèn luyện của sinh viên, Phòng CTCT và HSSV lập danh sách và đề nghị Hội đồng Khen thưởng và Kỷ luật sinh viên xét và đề nghị Hiệu trưởng công nhận danh hiệu đối với cá nhân; đối với tập thể lớp sinh viên, khi xét các danh hiệu thi đua Hội đồng Khen thưởng và Kỷ luật căn cứ vào Điểm b, khoản 2, Điều 33 xét và đề nghị Hiệu trưởng công nhận danh hiệu đối với những tập thể đạt tiêu chuẩn[cite: 1].\n4. Điểm rèn luyện đạt 85 điểm thuộc khung từ 80 đến dưới 90 điểm, được xếp loại Tốt[cite: 1]."
  y_bat_buoc:
    - "chỉ được hưởng hỗ trợ một lần"
    - "kể từ thời điểm quyết định kỷ luật có hiệu lực"
    - "trong thời gian bị đình chỉ"
    - "chế độ ưu đãi cao nhất"
    - "hình thức đào tạo vừa làm vừa học"
    - "Phòng CTCT và HSSV"
    - "đăng ký danh hiệu thi đua"
    - "Hội đồng Khen thưởng và Kỷ luật sinh viên"
    - "Hiệu trưởng"
    - "Từ 80 đến dưới 90 điểm"
    - "Tốt"
  nguon:
    - "Đ14: Thông báo về việc thực hiện chính sách hỗ trợ chi phí học tập đối với sinh viên là người dân tộc thiểu số thuộc hộ nghèo và hộ cận nghèo hệ chính quy học tại Trường, Mục IV. Quy định về dừng cấp kinh phí hỗ trợ chi phí học tập[cite: 1]"
    - "Đ15: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 6[cite: 1]"
    - "Đ16: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 34[cite: 1]"
    - "Đ17: Quy chế đánh giá kết quả rèn luyện của sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 9[cite: 1]"
  hanh_vi: tra_loi
