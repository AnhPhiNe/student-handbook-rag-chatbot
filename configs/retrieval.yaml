embedding:
  model_name: BAAI/bge-m3
  dimension: 1024
  normalize_embeddings: true

retrieval:
  # Parents handed to the composer.
  default_top_k: 5
  # Child chunks taken from dense search and from BM25, kept after RRF fusion
  # and all sent to the reranker. On official_v1 (RRF only) 24 holds a gold
  # child for 155/155 queries, 16 for 154/155; 40 adds nothing.
  candidate_children: 24

runtime:
  qdrant_timeout_seconds: 60
  parent_cache_max_entries: 2048

cohere_reranker:
  enabled: true
  model: rerank-v4.0-fast
  max_tokens_per_doc: 4096
  # Measured on official_v1 with 24 candidates: p50 0.73 s, p90 0.90 s, max 4.0 s.
  timeout_seconds: 8
  key_pool:
    # Cohere trial Rerank keys currently allow 10 requests/minute. Override
    # STUDENT_RAG_COHERE_RPM_LIMIT_PER_KEY for a production-key allowance.
    rpm_limit_per_key: 10
    cooldown_seconds: 65
