      noi_dung: "Bạn có thể hướng dẫn mình cách lắp ráp một bộ máy tính để bàn để học đồ họa được không?"
  dap_an_nhap: "Tôi chỉ hỗ trợ giải đáp các thắc mắc về quy định học tập, chính sách và dịch vụ sinh viên tại Trường Đại học Sư phạm TP.HCM. Rất tiếc tôi không thể hỗ trợ hướng dẫn lắp ráp thiết bị phần cứng máy tính."
  y_bat_buoc:
    - "từ chối lịch sự do câu hỏi ngoài phạm vi hỗ trợ của sổ tay sinh viên"
  nguon: []
  hanh_vi: tu_choi
  ghi_chu: ""
- phieu: V4-243
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Quy định về hồ sơ đánh giá rèn luyện sinh viên cấp cơ sở gồm những gì vậy ạ? Với lại gần trường có quán cơm tấm nào ngon không bạn?"
  dap_an_nhap: "Theo quy định, hồ sơ đánh giá rèn luyện sinh viên cấp cơ sở gồm có:
1. Bộ hồ sơ đánh giá rèn luyện của các lớp thuộc khoa, phân hiệu quản lý (lưu tại khoa, phân hiệu);[cite: 2]
2. Biên bản họp Hội đồng đánh giá kết quả rèn luyện cấp cơ sở (Thư ký và Chủ tịch Hội đồng cấp cơ sở ký biên bản) (lưu tại khoa, phân hiệu và gửi Hội đồng cấp Trường 01 bản);[cite: 2]
3. Bảng kết quả đánh giá rèn luyện của sinh viên đã được Hội đồng cấp cơ sở thông qua (lưu tại khoa và gửi Hội đồng cấp Trường 01 bản).[cite: 2]
Còn về việc gợi ý quán ăn ngoài trường, nội dung này nằm ngoài phạm vi hỗ trợ của sổ tay sinh viên nên tôi không thể giải đáp."
  y_bat_buoc:
    - "Bộ hồ sơ đánh giá rèn luyện của các lớp thuộc khoa, phân hiệu quản lý (lưu tại khoa, phân hiệu)[cite: 2]"
    - "Biên bản họp Hội đồng đánh giá kết quả rèn luyện cấp cơ sở (Thư ký và Chủ tịch Hội đồng cấp cơ sở ký biên bản) (lưu tại khoa, phân hiệu và gửi Hội đồng cấp Trường 01 bản)[cite: 2]"
    - "Bảng kết quả đánh giá rèn luyện của sinh viên đã được Hội đồng cấp cơ sở thông qua (lưu tại khoa và gửi Hội đồng cấp Trường 01 bản)[cite: 2]"
    - "từ chối trả lời câu hỏi về quán ăn ngoài trường"
  nguon:
    - "Đ11: Hướng dẫn lập hồ sơ đánh giá kết quả rèn luyện sinh viên (Phụ lục 2), Mục II. Hồ sơ đánh giá rèn luyện sinh viên cấp cơ sở[cite: 2]"
  hanh_vi: tra_loi_va_tu_choi
  ghi_chu: ""
- phieu: V4-244
  hoi_thoai:
