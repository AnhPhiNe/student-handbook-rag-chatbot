      noi_dung: "Học kỳ này kết quả học tập của em xếp loại Khá, vậy để được xét học bổng khuyến khích học tập loại Khá thì điểm rèn luyện của em cần đạt từ loại nào trở lên ạ?"
  dap_an_nhap: "Để được xét học bổng khuyến khích học tập loại Khá khi có kết quả học tập loại Khá, kết quả rèn luyện của bạn phải đạt từ loại Khá trở lên (đồng thời không bị kỷ luật từ mức khiển trách trở lên và tích lũy đủ số tín chỉ theo quy định)."
