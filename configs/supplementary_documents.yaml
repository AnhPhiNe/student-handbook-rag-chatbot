# Handbook texts without articles, indexed alongside the regulations.
#
# The article parser (src/preprocessing/structure_parser.py) indexes
# regulations Điều by Điều. The documents below have no articles: notices,
# guides, procedures, link pages, the conduct score framework and the forms.
# src/chunking/supplementary_parents.py reads their pages from the PDF.
#
#   id      stable part of the parent id (<cohort>_<id>_Phan<n>)
#   title   the document title as printed in the handbook's table of contents
#   kind    notice | guide | procedure | links | score_framework | forms
#   pages   first and last PDF page
#   skip_pages  pages holding only a flow chart or images
#   tables  ruled tables inside the pages: render "rows" (header row, one line
#           per cell) or "score_framework" (parts I-V, one line per scored item)
