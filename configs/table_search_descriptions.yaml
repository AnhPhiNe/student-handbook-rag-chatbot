  - key: '["K50","K50_QuyDinhChuanDauRaNgoaiNgu_KhongCoChuong_Dieu8","K50_foreign_language_equivalency_dieu8"]'
    content: >-
      Tra phụ lục bảng tham chiếu văn bằng hoặc chứng chỉ ngoại ngữ tương đương
      bậc 3 và bậc 4 Khung năng lực ngoại ngữ 6 bậc dùng cho Việt Nam,
      từ nguồn sổ tay K50.
      Bảng có TOEFL iBT/ITP, IELTS, Cambridge/Linguaskill, TOEIC 4 kỹ năng
      Nghe, Đọc, Nói, Viết với điểm từng kỹ năng; TCF/DELF tiếng Pháp,
      HSK tiếng Trung Quốc, JLPT tiếng Nhật, ТРКИ tiếng Nga và TOPIK II tiếng Hàn Quốc.
      Phạm vi áp dụng từ khóa tuyển sinh năm 2022 trở về sau theo Điều 1,
      trong phạm vi ngành và các ngoại lệ mà điều đó quy định.
      Bảng tra mức tương đương, không tự xác lập TOEIC là chứng chỉ bắt buộc
      hoặc kết luận đủ điều kiện tốt nghiệp khi thiếu quy định liên quan.
