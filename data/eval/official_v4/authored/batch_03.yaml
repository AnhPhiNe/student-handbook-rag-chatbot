  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hoi bang toeic 4 ky nang de dat tuong duong bac 3 thi diem nghe doc voi noi viet tung phan can bao nhieu a? dot nay e thi ve dc nghe 320 doc 310 noi 130 viet 130 thi co dat bac 3 ko"
  dap_an_nhap: "Để đạt chuẩn tương đương bậc 3 với chứng chỉ TOEIC (4 kỹ năng), điểm từng phần yêu cầu như sau: Nghe: 275 – 399; Đọc: 275 – 384; Nói: 120 – 159; Viết: 120 – 149. Mức điểm bạn đạt được (Nghe 320, Đọc 310, Nói 130, Viết 130) đều nằm trong các khoảng điểm yêu cầu nên đạt tương đương bậc 3."
