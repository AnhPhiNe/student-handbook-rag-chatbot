- phieu: V4-196
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Quy định về trách nhiệm của các khoa đào tạo trong công tác quản lý sinh viên ngoại trú đối với khóa K50 như thế nào vậy ạ?"
    - vai: tro_ly
      noi_dung: "Đối với khóa K50, các khoa đào tạo có 3 trách nhiệm: (1) Phối hợp các bên liên quan thực hiện công tác quản lý sinh viên ngoại trú, triển khai đăng ký ngoại trú và cập nhật thông tin thay đổi nơi tạm trú đúng hạn; (2) Phối hợp tổ chức triển khai kế hoạch quản lý sinh viên ngoại trú hằng năm của Trường; (3) Phối hợp với Phòng CTCT&HSSV và chính quyền địa phương giải quyết những vấn đề phát sinh."
    - vai: sinh_vien
      noi_dung: "Còn đối với khóa K51 thì sao ạ?"
  dap_an_nhap: "Đối với khóa K51, quy định về trách nhiệm của các khoa đào tạo trong công tác quản lý sinh viên ngoại trú hoàn toàn giống khóa K50, cụ thể bao gồm:\n1. Phối hợp các bên liên quan thực hiện nội dung công tác quản lý sinh viên ngoại trú, triển khai các nội dung liên quan về đăng ký ngoại trú của sinh viên, cập nhật thông tin thay đổi nơi tạm trú theo đúng thời hạn quy định.\n2. Phối hợp các bên liên quan tổ chức triển khai thực hiện kế hoạch công tác quản lý sinh viên ngoại trú hằng năm của Trường.\n3. Phối hợp với Phòng CTCT&HSSV và chính quyền địa phương giải quyết những vấn đề phát sinh trong công tác quản lý sinh viên ngoại trú."
  y_bat_buoc:
    - "Khóa K51 có quy định giống khóa K50"
    - "Phối hợp các bên liên quan thực hiện nội dung công tác quản lý sinh viên ngoại trú, triển khai các nội dung liên quan về đăng ký ngoại trú của sinh viên, cập nhật thông tin thay đổi nơi tạm trú theo đúng thời hạn quy định"
    - "Phối hợp các bên liên quan tổ chức triển khai thực hiện kế hoạch công tác quản lý sinh viên ngoại trú hằng năm của Trường"
    - "Phối hợp với Phòng CTCT&HSSV và chính quyền địa phương giải quyết những vấn đề phát sinh trong công tác quản lý sinh viên ngoại trú"
  nguon:
    - "Đ21: Quy định ngoại trú đối với sinh viên đào tạo trình độ đại học, cao đẳng ngành Giáo dục Mầm non hình thức chính quy của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
    - "Đ22: Quy định ngoại trú đối với sinh viên đào tạo trình độ đại học, cao đẳng ngành Giáo dục Mầm non hình thức chính quy của Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
