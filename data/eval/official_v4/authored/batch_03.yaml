- phieu: V4-014
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Chương trình đào tạo liên thông đại học cho người đã có một bằng đại học hệ vừa làm vừa học có thời gian chuẩn là 2,5 năm thì thời gian học tập tối đa là bao nhiêu năm vậy ạ?"
  dap_an_nhap: "Đối với hình thức đào tạo vừa làm vừa học, chương trình đào tạo liên thông trình độ đại học đối với người đã có một bằng đại học có thời gian học tập chuẩn là 2,5 năm học và thời gian học tập tối đa là 5 năm học."
