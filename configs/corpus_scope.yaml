# Corpus scope (owner decision, 2026-10-04): the search index covers what applies
# to regular (chính quy) university students of the main campus. Anything listed
# here gets no search chunk (no embedding, no BM25 entry); the handbook text and
# the parent documents are not edited, so citations stay verbatim. Rules name
# articles, clauses and points explicitly; there are no keyword rules at runtime.
# Kept on purpose: scope statements naming several groups (Điều 1-2), clauses that
# give a chính quy student a right concerning another form of study (Quy chế đào
# tạo Điều 15 khoản 5, Điều 17 khoản 3), clauses written jointly for đại học and
# cao đẳng (Quy chế công tác sinh viên Điều 30 khoản 3b, Điều 31 khoản 4), and
# Quy tắc ứng xử Điều 5 (office hours) and Điều 8 (conduct toward students).
