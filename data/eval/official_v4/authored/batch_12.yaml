  dap_an_nhap: "Sổ tay sinh viên không có thông tin về định mức thu học phí cụ thể cho từng tín chỉ theo từng năm học cũng như mốc thời hạn đóng học phí. Bạn vui lòng xem thông báo thu học phí trên cổng thông tin sinh viên hoặc liên hệ Phòng Kế hoạch - Tài chính để được hỗ trợ."
