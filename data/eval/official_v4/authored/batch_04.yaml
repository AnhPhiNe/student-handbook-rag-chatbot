- phieu: V4-156
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào thầy cô, em có mấy vấn đề thắc mắc nhờ thầy cô hỗ trợ giúp em với ạ:\n1. Sinh viên sư phạm cần nộp đơn đề nghị hưởng hỗ trợ tiền đóng học phí, chi phí sinh hoạt trong thời hạn bao lâu kể từ ngày nhận thông báo trúng tuyển và phải nộp mấy bộ hồ sơ cho cả khóa học?\n2. Em đang muốn tìm chỗ trọ an toàn và tìm việc làm thêm phù hợp thì ở trường mình em nên liên hệ đơn vị nào để được hỗ trợ ạ?\n3. Kỳ này em học 2 môn: môn thứ nhất 3 tín chỉ đạt điểm B (3,0) và môn thứ hai 2 tín chỉ đạt điểm A (4,0), nhờ thầy cô hướng dẫn công thức tính và tính giúp em điểm trung bình chung học kỳ là bao nhiêu ạ?\n4. Khi Hội đồng Khen thưởng và Kỷ luật sinh viên họp xem xét kỷ luật, nếu cố vấn học tập và đại diện lớp được mời tham dự thì có quyền biểu quyết mức kỷ luật không ạ?"
  dap_an_nhap: "1. Trong thời hạn 30 ngày kể từ ngày nhận được thông báo trúng tuyển, sinh viên sư phạm nộp Đơn đề nghị hưởng và cam kết bồi hoàn học phí, chi phí sinh hoạt đến cơ sở đào tạo giáo viên; sinh viên chỉ nộp 01 bộ hồ sơ cho 01 lần đầu đề nghị hỗ trợ trong cả thời gian học tại cơ sở đào tạo giáo viên[cite: 1].\n2. Để được hỗ trợ khảo sát, giới thiệu chỗ trọ và giới thiệu việc làm thêm, bạn liên hệ: Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp[cite: 1]; Điện thoại: (028) 3835 2020[cite: 1]; Email: csaed@hcmue.edu.vn[cite: 1].\n3. Điểm trung bình chung học kỳ được tính theo công thức: A = Σ(ai × ni) / Σ(ni), làm tròn đến 2 chữ số thập phân (trong đó ai là điểm thang 4 của học phần thứ i, ni là số tín chỉ của học phần thứ i)[cite: 1]. Với kết quả học tập của bạn: A = (3,0 x 3 + 4,0 x 2) / (3 + 2) = (9,0 + 8,0) / 5 = 17 / 5 = 3,40[cite: 1].\n4. Cố vấn học tập và đại diện lớp sinh viên (lớp trưởng hoặc bí thư chi đoàn) khi được mời tham dự Hội đồng Khen thưởng và Kỷ luật sinh viên được tham gia phát biểu ý kiến, đề xuất mức khen thưởng hoặc kỷ luật nhưng không được biểu quyết[cite: 1]."
  y_bat_buoc:
    - "30 ngày kể từ ngày nhận được thông báo trúng tuyển"
    - "Đơn đề nghị hưởng và cam kết bồi hoàn học phí, chi phí sinh hoạt"
    - "01 bộ hồ sơ cho 01 lần đầu"
    - "Trung tâm Hỗ trợ sinh viên và Phát triển khởi nghiệp"
    - "(028) 3835 2020"
    - "csaed@hcmue.edu.vn"
    - "A = Σ(ai × ni) / Σ(ni)"
    - "3,40"
    - "không được biểu quyết"
