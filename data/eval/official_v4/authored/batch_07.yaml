[cite: 1]- phieu: V4-094
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "ad oi cho e hoi diem trung binh chung hoc ky duoc tinh theo cong thuc nao the a, voi neu ma hoc cham tien do so voi thoi gian hoc tap chuan thi se bi xep vao dau a"
  dap_an_nhap: "1. Điểm trung bình chung học kỳ được tính theo công thức: A = Σ(ai × ni) / Σ(ni) và làm tròn đến 2 chữ số thập phân[cite: 1]. Trong đó: A là điểm trung bình chung học kỳ; ai là điểm của học phần thứ i (theo thang điểm 4); ni là số tín chỉ của học phần thứ i; n là tổng số học phần[cite: 1].\n2. Trường hợp sinh viên học chậm tiến độ so với thời gian học tập chuẩn sẽ được xếp vào lớp có cùng CTĐT khi khoa, phân hiệu, Phòng Đào tạo, Phòng CTCT&HSSV đồng ý để được CVHT và chấm điểm rèn luyện theo quy định[cite: 1]."
  y_bat_buoc:
    - "Công thức tính điểm trung bình chung: A = Σ(ai × ni) / Σ(ni)"
    - "Làm tròn đến 2 chữ số thập phân"
    - "A là điểm trung bình chung học kỳ, ai là điểm học phần thứ i, ni là số tín chỉ học phần thứ i, n là tổng số học phần"
    - "Sinh viên học chậm tiến độ so với thời gian học tập chuẩn được xếp vào lớp có cùng CTĐT"
    - "Phải được khoa, phân hiệu, Phòng Đào tạo, Phòng CTCT&HSSV đồng ý để được CVHT và chấm điểm rèn luyện theo quy định"
  nguon:
    - "Đ1: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
    - "Đ2: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 24"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-101
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em chào thầy cô ạ. Tình hình là em đang là sinh viên mới vào trường nên còn nhiều điều chưa nắm rõ về cơ cấu các khoa cũng như các chế độ chính sách. Em có một người bạn vừa thi đậu vào trường nhưng học hệ liên thông, bạn ấy đang thắc mắc về học bổng. Thầy cô cho em hỏi là ngành Hoá học thì trực thuộc khoa nào quản lý ạ? Và trường hợp người học liên thông thì có được xét cấp học bổng khuyến khích học tập như hệ chính quy không hay không được xét ạ?"
  dap_an_nhap: "1. Ngành Hoá học thuộc Khoa Hóa học[cite: 1].\n2. Về học bổng khuyến khích học tập (HBKKHT): Học bổng khuyến khích học tập chỉ được cấp cho sinh viên hệ chính quy đang học tập tại Trường; người học liên thông không được xét cấp[cite: 1]."
  y_bat_buoc:
    - "Ngành Hoá học thuộc Khoa Hóa học"
    - "HBKKHT chỉ được cấp cho sinh viên hệ chính quy đang học tập tại Trường"
    - "Người học liên thông không được xét cấp HBKKHT"
  nguon:
    - "Đ3: Danh bạ trong Sổ tay sinh viên K51"
    - "Đ4: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 26"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-102
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em chào thầy cô, em đang tìm hiểu kỹ các quy định về học tập và rèn luyện trong suốt khóa học để chuẩn bị lộ trình tốt nhất cho bản thân. Em có đọc quy định xét học bổng khuyến khích học tập và biết là đối với học kỳ cuối theo thiết kế chương trình chuẩn, các khóa tuyển sinh từ năm 2021 về trước chỉ cần tích lũy từ 06 tín chỉ trở lên. Vậy đối với các khóa tuyển sinh từ năm 2022 về sau thì ở học kỳ cuối đó phải tích lũy ít nhất bao nhiêu tín chỉ để được xét học bổng ạ? Thêm nữa, em thấy trường có bố trí cố vấn học tập cho các lớp, em muốn hỏi theo quy định thì mục đích của công tác cố vấn học tập là gì ạ?"
  dap_an_nhap: "1. Đối với học kỳ cuối theo thiết kế chương trình chuẩn, sinh viên thuộc các khóa tuyển sinh từ năm 2022 về sau phải tích lũy từ 11 tín chỉ trở lên để xét học bổng khuyến khích học tập[cite: 1].\n2. Mục đích công tác cố vấn học tập theo quy định gồm[cite: 1]:\n- Giúp sinh viên nắm rõ CTĐT, xây dựng kế hoạch học tập phù hợp[cite: 1].\n- Phối hợp các phòng chức năng và giúp các Trưởng khoa hoặc Giám đốc phân hiệu quản lý lớp sinh viên, giải quyết các vấn đề về đào tạo, các dịch vụ sinh viên và các vấn đề khác trong toàn khóa học[cite: 1].\n- Giúp sinh viên phát triển kỹ năng mềm, kỹ năng phát triển nghề nghiệp; và là cầu nối giữa sinh viên, khoa, phân hiệu và Trường[cite: 1]."
  y_bat_buoc:
    - "Khóa tuyển sinh từ năm 2022 về sau tích lũy từ 11 tín chỉ trở lên (ít nhất 11 tín chỉ) ở học kỳ cuối theo thiết kế chương trình chuẩn"
    - "Giúp sinh viên nắm rõ CTĐT, xây dựng kế hoạch học tập phù hợp"
    - "Phối hợp các phòng chức năng và giúp các Trưởng khoa hoặc Giám đốc phân hiệu quản lý lớp sinh viên, giải quyết các vấn đề về đào tạo, các dịch vụ sinh viên và các vấn đề khác trong toàn khóa học"
    - "Giúp sinh viên phát triển kỹ năng mềm, kỹ năng phát triển nghề nghiệp"
    - "Là cầu nối giữa sinh viên, khoa, phân hiệu và Trường"
  nguon:
    - "Đ5: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
    - "Đ6: Quy định công tác cố vấn học tập cho sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 2"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-103
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "cho em hoi xiu a, em muon duoc huong dan cach su dung thu vien de tra cuu va muon tai lieu thi lien he o dau, sdt voi mail the nao a? voi neu khong tham gia bao hiem y te theo quy dinh thi bi tru may diem drl vay a?"
  dap_an_nhap: "1. Để được hướng dẫn sử dụng thư viện, bạn liên hệ Thư viện của Trường[cite: 1]:\n- Địa chỉ: Tòa nhà Thư viện – Nhà làm việc Giáo sư, tầng 1 – 7, số 280 An Dương Vương, phường Chợ Quán, TP. HCM[cite: 1].\n- Điện thoại: (028) 35261042; (028) 38308905; (028) 38352020[cite: 1].\n- Email: thuvien@hcmue.edu.vn[cite: 1].\n2. Nếu không tham gia bảo hiểm y tế theo quy định, sinh viên sẽ bị trừ 5 điểm rèn luyện (-5 điểm) tại mục đánh giá ý thức chấp hành nội quy, quy chế, quy định trong trường[cite: 1]."
  y_bat_buoc:
    - "Đơn vị: Thư viện"
    - "Địa chỉ: Tòa nhà Thư viện – Nhà làm việc Giáo sư, tầng 1 – 7, số 280 An Dương Vương, phường Chợ Quán, TP. HCM"
    - "Điện thoại: (028) 35261042; (028) 38308905; (028) 38352020"
    - "Email: thuvien@hcmue.edu.vn"
    - "Không tham gia bảo hiểm y tế theo quy định bị trừ 5 điểm (-5 điểm) rèn luyện"
  nguon:
    - "Đ7: Danh bạ trong Sổ tay sinh viên K51"
    - "Đ8: Khung điểm đánh giá kết quả rèn luyện sinh viên (Phụ lục 1, Quyết định số 2000/QĐ-ĐHSP ngày 15/7/2024), Phần II"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-104
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "mn cho em hoi xiu, dia chi vp cua Khoa Khoa hoc Tu nhien o dau the a? tien cho em hoi quy trinh danh gia drl cua truong minh quy dinh the nao vay a?"
  dap_an_nhap: "1. Địa chỉ văn phòng Khoa Khoa học Tự nhiên: Văn phòng Khoa – Nhà K, Số 126 Lê Thánh Tôn, phường Diên Hồng, tỉnh Gia Lai[cite: 1]. (Điện thoại: (026) 93877322, Email: gialai.khtn@hcmue.edu.vn)[cite: 1].\n2. Quy trình đánh giá kết quả rèn luyện sinh viên gồm các bước[cite: 1]:\n- Bước 1: CVHT thông báo đến lớp trưởng lớp sinh viên về quy trình và thời gian thực hiện việc chấm điểm rèn luyện[cite: 1].\n- Bước 2: Sinh viên tự đánh giá theo mức điểm chi tiết kèm theo các minh chứng hoạt động và gửi về BCS lớp[cite: 1].\n- Bước 3: BCS lớp, BCH Chi đoàn, BCH Chi hội, CVHT chấm lại điểm rèn luyện cho sinh viên trên cơ sở sinh viên tự đánh giá[cite: 1].\n- Bước 4: CVHT tổ chức họp lớp xem xét, thông qua mức điểm của từng sinh viên trên cơ sở minh chứng, xác nhận kết quả (phải được trên 50% ý kiến đồng ý của tập thể đơn vị lớp và có biên bản họp kèm theo)[cite: 1]. CVHT xác nhận và lớp lập hồ sơ gửi lên Hội đồng cấp cơ sở (khoa, phân hiệu) gồm: Biên bản họp xét, Bảng kết quả đánh giá có xác nhận của CVHT, minh chứng hoạt động, đơn xin không đánh giá (nếu có)[cite: 1].\n- Bước 5: Hội đồng cấp cơ sở (khoa, phân hiệu) họp xét, thống nhất, báo cáo Trưởng đơn vị thông qua và trình kết quả lên Hội đồng cấp Trường[cite: 1].\n- Bước 6: Hội đồng cấp Trường họp xét, thống nhất trình Hiệu trưởng xem xét và quyết định công nhận kết quả[cite: 1].\n- Bước 7: Kết quả đánh giá, phân loại rèn luyện được công bố công khai và thông báo cho sinh viên biết trước 20 ngày trước khi ban hành quyết định chính thức; sau đó cập nhật kết quả vào phần mềm quản lý sinh viên Trường[cite: 1]."
  y_bat_buoc:
    - "Văn phòng Khoa Khoa học Tự nhiên: Văn phòng Khoa – Nhà K, Số 126 Lê Thánh Tôn, phường Diên Hồng, tỉnh Gia Lai"
    - "Bước 1: CVHT thông báo cho lớp trưởng về quy trình, thời gian chấm ĐRL"
    - "Bước 2: Sinh viên tự đánh giá kèm minh chứng gửi BCS lớp"
    - "Bước 3: BCS lớp, BCH Chi đoàn, BCH Chi hội, CVHT chấm lại điểm"
    - "Bước 4: Họp lớp thông qua (trên 50% ý kiến đồng ý, có biên bản), nộp hồ sơ lên Hội đồng cấp cơ sở"
    - "Bước 5: Hội đồng cấp cơ sở (khoa, phân hiệu) họp xét, báo cáo Trưởng đơn vị thông qua, trình lên Hội đồng cấp Trường"
    - "Bước 6: Hội đồng cấp Trường họp xét trình Hiệu trưởng quyết định công nhận"
    - "Bước 7: Công bố công khai trước 20 ngày trước khi ban hành quyết định chính thức và cập nhật phần mềm"
  nguon:
    - "Đ9: Danh bạ trong Sổ tay sinh viên K51"
    - "Đ10: Quy chế đánh giá kết quả rèn luyện của sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 11"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-105
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Phòng Hợp tác Quốc tế hỗ trợ sinh viên những công việc gì vậy ạ? Và nếu sinh viên đại học bị xếp loại rèn luyện yếu, kém trong hai học kỳ liên tiếp thì sẽ bị xử lý thế nào?"
  dap_an_nhap: "1. Những công việc của Phòng Hợp tác Quốc tế liên quan/hỗ trợ sinh viên gồm[cite: 1]:\n- Hỗ trợ dịch thuật, tổ chức sự kiện trong và ngoài nước[cite: 1];\n- Thông báo thông tin học bổng ở các trường, doanh nghiệp đối tác nước ngoài[cite: 1];\n- Tổ chức giao lưu văn hóa – trao đổi học thuật[cite: 1].\n2. Theo quy định, sinh viên trình độ đại học bị xếp loại rèn luyện yếu, kém trong hai học kỳ liên tiếp thì phải tạm ngừng học ít nhất một học kỳ ở học kỳ tiếp theo; và nếu bị xếp loại rèn luyện yếu, kém hai học kỳ liên tiếp lần thứ hai thì sẽ bị buộc thôi học[cite: 1]."
  y_bat_buoc:
    - "Hỗ trợ dịch thuật, tổ chức sự kiện trong và ngoài nước"
    - "Thông báo thông tin học bổng ở các trường, doanh nghiệp đối tác nước ngoài"
    - "Tổ chức giao lưu văn hóa – trao đổi học thuật"
    - "Bị xếp loại rèn luyện yếu, kém trong hai học kỳ liên tiếp: phải tạm ngừng học ít nhất một học kỳ ở học kỳ tiếp theo"
    - "Bị xếp loại rèn luyện yếu, kém hai học kỳ liên tiếp lần thứ hai: bị buộc thôi học"
  nguon:
    - "Đ11: Danh bạ trong Sổ tay sinh viên K51"
    - "Đ12: Quy chế đánh giá kết quả rèn luyện của sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 14"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-107
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Dạ em muốn tìm hiểu thông tin về quy chế tuyển sinh và đào tạo trình độ thạc sĩ thì liên hệ ở đâu ạ? Với lại quy định về yêu cầu đối với hoạt động nghiên cứu khoa học của sinh viên gồm những gì thế ạ?"
  dap_an_nhap: "1. Để xem thông tin về Quy chế tuyển sinh và đào tạo trình độ thạc sĩ, bạn truy cập đường dẫn: http://tracuu.hcmue.edu.vn/Quyche_Thacsi hoặc liên hệ Phòng Sau Đại học[cite: 1]:\n- Địa chỉ: Nhà C, tầng 1, P.102, P.103, P.104, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM[cite: 1].\n- Điện thoại: (028) 38352020; (028) 38391077[cite: 1].\n- Email: phongsdh@hcmue.edu.vn[cite: 1].\n2. Yêu cầu về hoạt động nghiên cứu khoa học của sinh viên gồm 4 yêu cầu[cite: 1]:\n- Phù hợp với khả năng và nguyện vọng của sinh viên[cite: 1].\n- Phù hợp với mục tiêu, nội dung, CTĐT của Trường[cite: 1].\n- Phù hợp với định hướng hoạt động khoa học và công nghệ của Trường[cite: 1].\n- Kết quả nghiên cứu có giá trị khoa học, giá trị thực tiễn[cite: 1]."
  y_bat_buoc:
    - "Đơn vị: Phòng Sau Đại học"
    - "Đường dẫn tra cứu: http://tracuu.hcmue.edu.vn/Quyche_Thacsi"
    - "Địa chỉ: Nhà C, tầng 1, P.102, P.103, P.104, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM"
    - "Điện thoại: (028) 38352020; (028) 38391077"
    - "Email: phongsdh@hcmue.edu.vn"
    - "Phù hợp với khả năng và nguyện vọng của sinh viên"
    - "Phù hợp với mục tiêu, nội dung, CTĐT của Trường"
    - "Phù hợp với định hướng hoạt động khoa học và công nghệ của Trường"
    - "Kết quả nghiên cứu có giá trị khoa học, giá trị thực tiễn"
  nguon:
    - "Đ13: Danh bạ trong Sổ tay sinh viên K50"
    - "Đ14: Quy định về việc tổ chức hoạt động nghiên cứu khoa học của sinh viên, Điều 3"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-127
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Em được biết khi xét học bổng khuyến khích học tập thì các tín chỉ trả nợ, cải thiện hoặc tương đương sẽ không được tính. Vậy ở một học kỳ thông thường em cần tích lũy tối thiểu bao nhiêu tín chỉ theo kế hoạch và yêu cầu kết quả các tín chỉ đó ra sao? Tiện thể cho em hỏi văn phòng Khoa Sinh học nằm ở đâu ạ?"
  dap_an_nhap: "1. Về khối lượng học tập thông thường để xét HBKKHT: Tổng số tín chỉ sinh viên tích lũy trong một học kỳ phải lớn hơn hoặc bằng 15 tín chỉ theo kế hoạch trong CTĐT của khóa học, và tất cả các tín chỉ đều phải đạt (không bao gồm các tín chỉ trả nợ, cải thiện, tương đương…)[cite: 1].\n2. Văn phòng làm việc của Khoa Sinh học: Nhà B, tầng 5, P.501, P.502, số 280 An Dương Vương, Phường 4, Quận 5, TP. HCM[cite: 1]. (Điện thoại: (028) 38352020, số máy nội bộ: 113, 114; Email: khoasinhhoc@hcmue.edu.vn)[cite: 1]."
  y_bat_buoc:
