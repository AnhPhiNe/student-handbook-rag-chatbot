  - {query: "Viết cho em một bài quảng cáo bán điện thoại nhé.", behavior: out_of_domain, facts: ["Nêu phạm vi hỗ trợ thông tin sinh viên; không biến câu trả lời thành bài quảng cáo."]}
  - {query: "Em quên mật khẩu ngân hàng, cho em lấy lại qua đây được không?", behavior: out_of_domain, facts: ["Không thể khôi phục tài khoản ngân hàng; không yêu cầu mật khẩu hay OTP, hướng dẫn liên hệ kênh ngân hàng chính thức."]}
policy_groups:
  - source: QuyCheDaoTao_Chuong1_Dieu4
    topic: diem
    cases:
      - ["Em trượt môn bắt buộc, đăng ký môn khác bù được chứ?", "Phải học lại môn đó hoặc học phần tương đương theo CTĐT, hoặc học phần thay thế nếu môn không còn được giảng dạy; không tự chọn bất kỳ môn nào để bù.", "học phần bắt buộc"]
      - ["Môn tự chọn bắt buộc em không qua, có cách nào học môn khác thay không?", "Có thể học lại hoặc chọn học phần khác trong cùng nhóm học phần tự chọn bắt buộc theo quy định.", "cùng nhóm học phần"]
      - ["Em muốn bỏ môn tự chọn tự do đã rớt để học môn khác, được không?", "Được đăng ký học lại hoặc đổi sang học phần tự chọn tự do khác theo quy định.", "tự chọn tự do"]
      - ["Vừa làm vừa học là niên chế hay tín chỉ vậy?", "Đào tạo theo tín chỉ.", "đào tạo theo tín chỉ"]
      - ["Môn bắt buộc còn nợ nhưng trường ngừng dạy rồi, em có được tự chọn môn thay thế không?", "Áp dụng học phần thay thế theo quy định của trường; không kết luận sinh viên được tự ý chọn bất kỳ môn nào.", "học phần thay thế"]
  - source: QuyCheDaoTao_Chuong2_Dieu9
    topic: khac
    cases:
      - ["Mới vào trường kỳ đầu ai xếp lịch học cho em?", "Học kỳ đầu học theo thời khóa biểu trường ấn định.", "Trường ấn định"]
      - ["Sang kỳ hai em phải tự đăng ký môn trên hệ thống hả?", "Từ học kỳ thứ hai sinh viên chính quy tự đăng ký học phần trên hệ thống theo kế hoạch.", "học kỳ thứ hai"]
      - ["Trường phải báo đợt đăng ký môn trước ít nhất mấy ngày?", "Lịch đăng ký học phần được công bố chậm nhất một tuần trước khi bắt đầu mở hệ thống.", "01 tuần"]
      - ["Em hệ vừa làm vừa học, có được ghép học một số môn với chính quy không?", "Có thể đăng ký một số học phần tổ chức chính quy nhưng phải phù hợp quy định tại khoản 1; không phải quyền đăng ký mọi môn vô điều kiện.", "một số học phần được tổ chức"]
      - ["Em hết hạn rút môn mà cứ nghỉ luôn thì môn đó có biến mất khỏi đăng ký không?", "Danh sách lớp vẫn giữ nguyên; không đi học bị xem như tự ý bỏ học, không tự xóa môn.", "tự ý bỏ học"]
  - source: QuyCheDaoTao_Chuong3_Dieu12
    topic: diem
    cases:
      - ["Em chính quy nợ hơn 24 tín chỉ thì có bị cảnh báo không?", "Có, tổng tín chỉ nợ đọng từ đầu khóa vượt quá 24 là một điều kiện cảnh báo học tập.", "vượt quá 24"]
      - ["Kỳ đầu chính quy GPA học kỳ dưới 0,8 có sao không?", "Điểm trung bình học kỳ dưới 0,8 ở học kỳ đầu là một điều kiện cảnh báo học tập.", "dưới 0,8"]
      - ["Bị thôi học do kết quả học tập thì em còn xin giấy xác nhận điểm được không?", "Kết quả đã tích lũy được bảo lưu; sinh viên có quyền yêu cầu giấy chứng nhận điểm các học phần đã tích lũy.", "giấy chứng nhận điểm"]
      - ["Chính quy học quá hạn tối đa có bị cho thôi học không?", "Vượt giới hạn thời gian học tập tối đa là trường hợp buộc thôi học.", "giới hạn tối đa"]
      - ["Em chính quy bị cảnh báo bốn lần nhưng không liền nhau, vậy có tránh được thôi học không?", "Không: cảnh báo đến lần thứ tư tính từ đầu khóa là một trường hợp buộc thôi học, không đòi hỏi bốn lần liên tiếp.", "lần thứ tư"]
  - source: QuyCheDaoTao_Chuong3_Dieu13
    topic: diem
    cases:
      - ["Vừa làm vừa học kiểm tra diện cảnh báo khi hết năm học phải không?", "Xét cảnh báo vào cuối mỗi năm học.", "Cuối mỗi năm học"]
      - ["Em vừa làm vừa học bị cảnh báo vì nợ nhiều môn, giờ chỉ được học trả nợ thôi à?", "Chỉ được đăng ký học phần nhằm trả nợ và cải thiện điểm khi bị cảnh báo do nợ tín chỉ theo điểm b khoản 1.", "chỉ được đăng ký"]
      - ["Vừa làm vừa học bị cảnh báo hai lần liền thì thế nào?", "Hai lần cảnh báo liên tiếp trong một khóa học là trường hợp buộc thôi học.", "02 lần liên tiếp"]
      - ["Hệ vừa làm vừa học bị thôi học còn giữ được kết quả đã học không?", "Kết quả đã tích lũy được bảo lưu; được yêu cầu giấy chứng nhận điểm.", "được bảo lưu"]
      - ["Em vừa làm vừa học bị cảnh báo ba lần rải rác, không phải liên tiếp, có bị thôi học không?", "Có: ba lần không liên tiếp trong một khóa học là trường hợp buộc thôi học.", "03 lần không liên tiếp"]
  - source: QuyCheDaoTao_Chuong3_Dieu14
    topic: diem
    cases:
      - ["Em đã học vài môn ở đại học khác, trường mình có xem xét công nhận không?", "Kết quả ở cơ sở đào tạo khác có thể được xem xét công nhận, chuyển đổi; không tự động công nhận.", "cơ sở đào tạo khác"]
      - ["Ai xem xét việc chuyển tín chỉ từ chương trình cũ của em?", "Hội đồng chuyên môn của trường xem xét công nhận và chuyển đổi tín chỉ.", "Hội đồng chuyên môn"]
      - ["Hai môn cùng tên là được miễn học luôn hả?", "Không chỉ dựa tên môn; đối sánh chuẩn đầu ra, nội dung, khối lượng học tập, cách đánh giá và điều kiện bảo đảm chất lượng.", "chuẩn đầu ra"]
      - ["Có xét chuyển đổi nguyên một nhóm học phần không?", "Có hình thức công nhận, chuyển đổi theo nhóm học phần, không chỉ từng học phần.", "nhóm học phần"]
      - ["Em ngành đào tạo giáo viên thì cũng mặc định chuyển được 50% chương trình sao?", "Mức chung không vượt quá 50%; riêng ngành đào tạo giáo viên thực hiện theo hướng dẫn Bộ GDĐT, không mặc định áp dụng mức chung.", "riêng đối với ngành đào tạo giáo viên"]
  - source: QuyCheDaoTao_Chuong3_Dieu15
    topic: tot_nghiep
    cases:
      - ["Em tích lũy đủ môn rồi là trường cho tốt nghiệp ngay phải không?", "Còn phải đạt chuẩn đầu ra và nội dung bắt buộc, GPA toàn khóa từ trung bình, không bị truy cứu trách nhiệm hình sự hoặc đang đình chỉ tại thời điểm xét.", "điều kiện"]
      - ["Đã đủ chuẩn và hoàn thành nghĩa vụ với trường thì tối đa bao lâu có quyết định tốt nghiệp?", "Trong thời hạn ba tháng từ khi đáp ứng đầy đủ điều kiện và hoàn thành nghĩa vụ với trường.", "03 tháng"]
      - ["Bằng giỏi có bị hạ nếu em học lại quá nhiều tín chỉ không?", "Hạng giỏi hoặc xuất sắc giảm một mức nếu tín chỉ phải học lại vượt quá 5% tổng tín chỉ quy định toàn chương trình.", "5%"]
      - ["Trường đăng kết quả tốt nghiệp dự kiến nhầm thông tin của em thì báo ai?", "Sinh viên rà soát và phản hồi Phòng Đào tạo trong thời gian quy định; quá hạn không được tiếp nhận giải quyết.", "Phòng Đào tạo"]
      - ["Em đã hết thời gian học, chỉ còn thiếu chuẩn ngoại ngữ, có được bổ sung sau không?", "Có thể hoàn thiện điều kiện còn thiếu và đề nghị xét tốt nghiệp trong ba năm tính từ khi thôi học theo trường hợp quy định; không suy ra được học lại toàn bộ chương trình vô hạn.", "03 năm"]
  - source: QuyCheDaoTao_Chuong4_Dieu16
    topic: nghi_hoc
    cases:
      - ["Em bảo lưu do đi nghĩa vụ thì thời gian đó có trừ vào thời hạn học không?", "Thời gian nghỉ vì được điều động vào lực lượng vũ trang không tính vào thời gian đào tạo chính thức.", "không tính vào thời gian đào tạo chính thức"]
      - ["Chưa học hết kỳ đầu mà muốn nghỉ vì việc riêng thì được không?", "Nghỉ vì lý do cá nhân phải học tối thiểu một học kỳ và không thuộc diện bị xem xét buộc thôi học hoặc kỷ luật.", "01 học kỳ"]
      - ["Em xin nghỉ vì chuyện gia đình thì thời gian bảo lưu vẫn tính vào khóa học à?", "Thời gian nghỉ vì nhu cầu cá nhân được tính vào thời gian học tập chính thức.", "vì nhu cầu cá nhân"]
      - ["Đến hạn trở lại mà em vẫn chưa học được thì cần làm gì?", "Làm đơn xin gia hạn; không trở lại khi quá thời gian tạm dừng bị xem như tự ý bỏ học.", "xin gia hạn"]
      - ["Em đã tự thôi học hẳn, giờ muốn vào học lại có giống hết bảo lưu không?", "Không đồng nhất hai việc: thôi học vì lý do cá nhân muốn quay lại phải dự tuyển đầu vào như thí sinh khác; kết quả đã tích lũy được bảo lưu/công nhận theo quy định.", "dự tuyển đầu vào"]
  - source: QuyCheDaoTao_Chuong4_Dieu17
    topic: nganh_hoc
    cases:
      - ["Mới năm nhất em xin đổi ngành được chứ?", "Không được xét chuyển ngành khi đang ở trình độ năm thứ nhất theo điều kiện quy định.", "năm thứ nhất"]
      - ["Em năm cuối rồi còn xin chuyển ngành được không?", "Không được xét chuyển ngành khi đang năm cuối khóa.", "năm cuối khóa"]
      - ["Muốn đổi ngành có phải đủ điểm đầu vào ngành muốn sang không?", "Phải đáp ứng điều kiện trúng tuyển của chương trình/ngành/trường trong cùng khóa tuyển sinh.", "điều kiện trúng tuyển"]
      - ["Em đang bị xem xét buộc thôi học, xin chuyển ngành để học tiếp được không?", "Không đáp ứng điều kiện chuyển ngành vì đang thuộc diện bị xem xét buộc thôi học.", "buộc thôi học"]
      - ["Em đủ điểm vào ngành mới rồi thì chắc chắn được chuyển chứ?", "Chưa chắc: còn điều kiện năm học, không thuộc diện thôi học, thời gian còn lại, năng lực đào tạo và sự đồng ý của các bên có thẩm quyền.", "đủ các điều kiện"]
  - source: QuyCheDaoTao_Chuong4_Dieu18
    topic: diem
    cases:
      - ["Trường hợp tác đào tạo thì sinh viên được học một số môn bên trường bạn hả?", "Có trên cơ sở nội dung hợp tác do Hiệu trưởng quyết định; không phải tùy ý học bất kỳ trường nào.", "nội dung hợp tác"]
      - ["Học theo trao đổi thì được công nhận tối đa bao nhiêu phần trăm chương trình?", "Không vượt quá 25% tổng khối lượng chương trình đào tạo.", "25%"]
      - ["Thông tin hợp tác để học môn bên trường khác được đăng ở đâu?", "Nội dung hợp tác được công khai trên cổng thông tin điện tử.", "thông tin điện tử"]
      - ["Ai quyết định việc hợp tác học phần với trường khác?", "Hiệu trưởng quyết định nội dung hợp tác trên cơ sở đối sánh các điều kiện quy định.", "Hiệu trưởng quyết định"]
      - ["Em muốn qua trường đối tác học quốc phòng theo diện trao đổi tín chỉ thì có nằm trong quy định này không?", "Không: quy định trao đổi này không bao gồm giáo dục thể chất và giáo dục quốc phòng–an ninh.", "không bao gồm"]
  - source: QuyCheDaoTao_Chuong4_Dieu19
    topic: nganh_hoc
    cases:
      - ["Em vừa lên năm hai, đã có thể đăng ký ngành thứ hai chưa?", "Sớm nhất khi được xếp trình độ năm hai chương trình thứ nhất; vẫn phải đáp ứng điều kiện học lực và đầu vào cùng điều kiện bổ sung.", "năm thứ hai"]
      - ["Học lực trung bình là hết cơ hội học song bằng hả?", "Không; có nhánh học lực trung bình kèm đáp ứng điều kiện trúng tuyển chương trình thứ hai và các điều kiện quy định khác.", "xếp loại trung bình"]
      - ["Em học song bằng thì môn hai ngành giống nhau có được công nhận không?", "Được công nhận học phần có nội dung và khối lượng kiến thức tương đương trong chương trình thứ nhất.", "tương đương"]
      - ["Học thêm ngành thứ hai có cho em một thời hạn học tối đa mới không?", "Thời gian tối đa là thời gian tối đa quy định cho chương trình thứ nhất, không tự kéo dài vì học hai chương trình.", "thời gian tối đa quy định cho chương trình thứ nhất"]
      - ["Ngành đầu bị cảnh báo nhưng ngành hai điểm tốt, em vẫn học tiếp ngành hai được chứ?", "Nếu chương trình thứ nhất dưới trung bình hoặc thuộc diện cảnh báo thì bị buộc thôi học chương trình thứ hai ở học kỳ tiếp theo.", "học kỳ tiếp theo"]
  - source: QuyCheDaoTao_Chuong4_Dieu21
    topic: diem
    cases:
      - ["Lần đầu em nhờ bạn thi giúp sẽ bị đuổi học luôn không?", "Vi phạm lần thứ nhất bị đình chỉ học tập một năm; lần thứ hai buộc thôi học.", "một năm"]
      - ["Người đi thi thay có bị xử lý giống người nhờ thi không?", "Cả thi hộ và nhờ thi hộ đều chịu mức đình chỉ một năm lần đầu và buộc thôi học lần hai.", "đều bị kỷ luật"]
      - ["Nộp chứng chỉ giả để xét tốt nghiệp có bị thôi học không?", "Sử dụng chứng chỉ giả làm điều kiện tốt nghiệp bị buộc thôi học; bằng đã cấp bị thu hồi, hủy bỏ.", "chứng chỉ giả"]
      - ["Gian lận trong bài kiểm tra của một môn có bị xử lý không?", "Bị xử lý kỷ luật đối với học phần vi phạm theo quy định; không gán mức cụ thể khi nguồn không nêu cho hành vi đó.", "từng học phần"]
      - ["Nếu đã nhận bằng rồi mới phát hiện em dùng hồ sơ giả thì bằng còn giá trị không?", "Văn bằng tốt nghiệp đã cấp bị thu hồi, hủy bỏ khi dùng hồ sơ/văn bằng/chứng chỉ giả làm điều kiện theo quy định.", "thu hồi"]
  - source: QuyCheDanhGiaKetQuaRenLuyen_Chuong4_Dieu15
    source_by_cohort: {K51: QuyCheDanhGiaRenLuyen_Chuong4_Dieu15}
    topic: ren_luyen
