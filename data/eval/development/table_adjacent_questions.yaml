# Questions that sit next to a lookup table but are answered by the text around it,
# and "where do I submit / whom do I contact" questions answered by the service catalog.
#
# Purpose: official_v2 (2026-09-29) showed two planner patterns.
#   - A rule question near a table was sent to the table, which does not hold
#     the rule. Case 059 ("bằng cả điểm học tập lẫn điểm rèn luyện thì học bổng
#     chia thế nào") got the scholarship levels instead of the tie rule, and the
#     answer read as if it had answered.
#   - "nộp / gửi ... ở đâu" went to RAG instead of the service catalog (041, 042,
#     096), which loses the office's contacts.
# This set measures how often each happens before anything is changed.
#
# Development data, not a hold-out: written 2026-09-29 by the AI assistant from
# the handbook text (the articles holding the lookup tables and their
# neighbours) and the K51 service catalog, before any run; not independently
# reviewed. r01 rewords official_v2 case 059, so it is not blind. official_v3
# was not read; overlap with it was not screened.
#
# route:
#   includes_rag  at least one task reads the handbook text (a table lookup
#                 beside it is fine); the gold parent must be retrieved
#   directory     a structured student_service or office task
# gold_parent:    the parent that holds the answer (rule questions only)
# must_include:   facts the answer must state (checked case-insensitively)
#
# Each question is run 3 times (the planner varies between runs). Nothing is
# decided on a single run.
version: 1
