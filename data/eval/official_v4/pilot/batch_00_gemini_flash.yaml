    - "Từ chối lịch sự trả lời câu hỏi về thời tiết ngoài phạm vi"
    - "Nêu rõ chỉ hỗ trợ thông tin quy định, quy chế và dịch vụ sinh viên trong Sổ tay sinh viên của trường"
