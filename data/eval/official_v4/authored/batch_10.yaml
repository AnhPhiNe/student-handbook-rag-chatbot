- phieu: V4-175
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho mình hỏi đối với các học phần còn lại, mức điểm thang 10 từ 8,5 đến 10 với từ 4,8 đến 5,4 thì quy đổi ra điểm chữ gì và xếp loại đạt hay không đạt vậy?"
  dap_an_nhap: "Theo quy định đánh giá đối với các học phần còn lại:\n- Thang điểm 10 từ 8,5 – 10: quy đổi thành điểm chữ A, xếp loại Đạt.\n- Thang điểm 10 từ 4,8 – 5,4: quy đổi thành điểm chữ D+, xếp loại Không đạt."
  y_bat_buoc:
    - "Thang điểm 10 từ 8,5 – 10: quy đổi thành điểm chữ A, xếp loại Đạt"
    - "Thang điểm 10 từ 4,8 – 5,4: quy đổi thành điểm chữ D+, xếp loại Không đạt"
  nguon:
    - "Đ1: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 10"
  hanh_vi: tra_loi
  ghi_chu: ""

- phieu: V4-180
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Thời gian học tập chuẩn và tối đa của hình thức chính quy khác với hình thức vừa làm vừa học như thế nào vậy ạ?"
  dap_an_nhap: "Thời gian học tập chuẩn và tối đa giữa hai hình thức đào tạo được quy định như sau:\n- Hình thức chính quy: Thời gian học tập chuẩn là 04 năm học, thời gian học tập tối đa là 06 năm học.\n- Hình thức vừa làm vừa học: Thời gian học tập chuẩn là 05 năm học, thời gian học tập tối đa là 7,5 năm học.\n- Quy tắc đối với sinh viên liên thông: Đối với sinh viên học liên thông đã được miễn trừ khối lượng tín chỉ tích lũy ở cả hai hình thức, thời gian tối đa để hoàn thành khóa học được xác định trên cơ sở thời gian theo kế hoạch học tập chuẩn toàn khoá giảm tương ứng với khối lượng được miễn trừ."
  y_bat_buoc:
    - "Chính quy: thời gian học tập chuẩn là 04 năm học, thời gian học tập tối đa là 06 năm học"
    - "Vừa làm vừa học: thời gian học tập chuẩn là 05 năm học, thời gian học tập tối đa là 7,5 năm học"
    - "Đối với sinh viên học liên thông đã được miễn trừ khối lượng tín chỉ tích lũy, thời gian tối đa để sinh viên hoàn thành khóa học được xác định trên cơ sở thời gian theo kế hoạch học tập chuẩn toàn khoá giảm tương ứng với khối lượng được miễn trừ"
  nguon:
    - "Đ2: Quy chế đào tạo trình độ đại học tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 3"
  hanh_vi: tra_loi
  ghi_chu: ""

