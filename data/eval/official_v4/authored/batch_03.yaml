  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-019
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Học bổng khuyến khích học tập loại Giỏi được tính theo công thức và hệ số như thế nào vậy ạ?"
  dap_an_nhap: "Mức học bổng khuyến khích học tập loại Giỏi được tính theo công thức: Số tín chỉ x định mức học phí 1 tín chỉ tự nhiên hoặc xã hội x 1.25 (hệ số là 1.25). Định mức học phí 1 tín chỉ tự nhiên hoặc xã hội được xác định phụ thuộc vào ngành học của sinh viên."
  y_bat_buoc:
    - "Học bổng loại Giỏi: Số tín chỉ x định mức học phí 1 tín chỉ tự nhiên hoặc xã hội x 1.25"
    - "Hệ số: 1.25"
    - "Định mức học phí 1 tín chỉ tự nhiên hoặc xã hội tùy thuộc vào ngành học"
  nguon:
    - "Đ8: Quy chế công tác sinh viên đối với chương trình đào tạo đại học hệ chính quy Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 28"
  hanh_vi: tra_loi
  ghi_chu: ""
- phieu: V4-021
  hoi_thoai:
    - vai: sinh_vien
      noi_dung: "Cho em hỏi xíu, để được xét hb kht thì trong học kỳ cần tích lũy tối thiểu bao nhiêu tín chỉ theo kế hoạch, và mấy tín chỉ trả nợ hay cải thiện có được tính vô không ạ?"
  dap_an_nhap: "Để xét học bổng khuyến khích học tập, tổng số tín chỉ sinh viên tích lũy trong một học kỳ phải lớn hơn hoặc bằng 15 tín chỉ theo kế hoạch trong chương trình đào tạo của khóa học (tất cả các tín chỉ đều phải đạt, không bao gồm các tín chỉ trả nợ, cải thiện, tương đương,…)."
  y_bat_buoc:
    - "Tích lũy lớn hơn hoặc bằng 15 tín chỉ theo kế hoạch"
    - "Tất cả các tín chỉ đều phải đạt"
    - "Không bao gồm các tín chỉ trả nợ, cải thiện, tương đương"
  nguon:
    - "Đ9: Quy chế công tác sinh viên đối với sinh viên hệ chính quy tại Trường Đại học Sư phạm Thành phố Hồ Chí Minh, Điều 27"
  hanh_vi: tra_loi
  ghi_chu: ""
