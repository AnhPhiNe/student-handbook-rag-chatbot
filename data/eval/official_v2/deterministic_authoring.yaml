# official_v2: held-out questions written from handbook content in student phrasing.
# Gold comes from catalog selectors (see scripts/build_official_deterministic.py),
# never from system output. Every case names its UI cohort (`selected_cohort`) and
# its `slice` (`family.detail`); memory cases carry earlier turns in `history`.
settings:
  id_prefix: official_v2_det
  independent_holdout: true
  overlap_policy: >-
    Held-out: written after official_v1 was frozen, screened against official_v1
    queries for near-duplicates, and never used to tune prompts or code.
  expected: {cases: 154}

cases:
